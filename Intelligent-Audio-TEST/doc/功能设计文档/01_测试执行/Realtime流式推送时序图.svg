<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1920" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sec-title { font-size: 14px; font-weight: 700; }
      .flow { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #2563eb; stroke-width: 1.6; fill: none; marker-end: url(#arrowBlue); }
      .flow-red { stroke: #dc2626; stroke-width: 1.6; fill: none; marker-end: url(#arrowRed); }
      .flow-amber { stroke: #f59e0b; stroke-width: 1.6; fill: none; marker-end: url(#arrowAmber); }
      .flow-green { stroke: #16a34a; stroke-width: 1.6; fill: none; marker-end: url(#arrowGreen); }
      .box-name { font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .box-desc { font-size: 10px; fill: #64748b; }
      .note { font-size: 9.5px; fill: #64748b; }
      .body { font-size: 10.5px; fill: #334155; }
      .pill-t { font-size: 10px; font-weight: 600; text-anchor: middle; }
      .chip-t { font-size: 9.5px; text-anchor: middle; }
      .lbl { font-size: 9.5px; font-weight: 600; }
      .num-badge { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .ts-lbl { font-size: 9px; fill: #64748b; text-anchor: end; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="1920" fill="#f1f5f9"/>

  <text x="620" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Realtime 流式推送与结果获取</text>
  <text x="620" y="66" text-anchor="middle" font-size="12" fill="#64748b">生产者-消费者 + 事件队列架构 · 推送与接收完全并行互不阻塞 · 厂商字段隔离</text>

  <!-- ① 核心架构 -->
  <rect x="24" y="88" width="1192" height="440" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="88" width="1192" height="38" rx="10" fill="#dbeafe"/>
  <rect x="24" y="114" width="1192" height="12" fill="#dbeafe"/>
  <circle cx="46" cy="107" r="11" fill="#3b82f6"/>
  <text x="46" y="111" class="num-badge">1</text>
  <text x="66" y="112" class="sec-title" fill="#1e3a8a">RealtimeAPIAdapter 核心架构 — 一个后台接收线程 + 一个阻塞队列</text>

  <!-- Push Direction -->
  <rect x="48" y="142" width="540" height="170" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="48" y="142" width="540" height="26" rx="8" fill="#dbeafe"/>
  <text x="318" y="160" text-anchor="middle" class="box-name" fill="#1e40af">推送方向 (executor → API)</text>

  <rect x="68" y="180" width="100" height="28" rx="6" fill="#2563eb"/>
  <text x="118" y="198" text-anchor="middle" class="chip-t" fill="#fff">executor</text>
  <path d="M 168 194 L 268 194" class="flow-blue"/>
  <text x="218" y="188" text-anchor="middle" class="note">send(chunk)</text>
  <rect x="278" y="180" width="120" height="28" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="338" y="198" text-anchor="middle" class="chip-t" fill="#1e40af">adapter.send()</text>
  <path d="M 398 194 L 488 194" class="flow-blue"/>
  <text x="443" y="188" text-anchor="middle" class="note">ws.send()</text>
  <rect x="498" y="180" width="70" height="28" rx="6" fill="#7c3aed"/>
  <text x="533" y="198" text-anchor="middle" class="chip-t" fill="#fff">API</text>

  <text x="68" y="228" class="body">1. RenderAudioStream.render() → 逐帧流式混音 + SPL增益 + 切片</text>
  <text x="68" y="246" class="body">2. for chunk in chunks: adapter.send(chunk, is_audio=True)</text>
  <text x="68" y="264" class="body">3. sleep(100ms) — 模拟实时流式速率</text>
  <text x="68" y="282" class="body">4. adapter.commit_input() → mark_commit() → ws.send(commit)</text>
  <rect x="68" y="292" width="500" height="14" rx="3" fill="#eff6ff"/>
  <text x="318" y="303" text-anchor="middle" class="note" font-style="italic">同步发送, 网络IO快, 不阻塞接收线程</text>

  <!-- Receive Direction -->
  <rect x="608" y="142" width="540" height="170" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <rect x="608" y="142" width="540" height="26" rx="8" fill="#fee2e2"/>
  <text x="878" y="160" text-anchor="middle" class="box-name" fill="#991b1b">接收方向 (API → executor)</text>

  <rect x="628" y="180" width="70" height="28" rx="6" fill="#dc2626"/>
  <text x="663" y="198" text-anchor="middle" class="chip-t" fill="#fff">API</text>
  <path d="M 698 194 L 798 194" class="flow-red"/>
  <text x="748" y="188" text-anchor="middle" class="note">ws.recv()</text>
  <rect x="808" y="180" width="120" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="868" y="198" text-anchor="middle" class="chip-t" fill="#991b1b">_recv_loop</text>
  <path d="M 928 194 L 1028 194" class="flow-red"/>
  <text x="978" y="188" text-anchor="middle" class="note">put()</text>
  <rect x="1038" y="180" width="90" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="1083" y="198" text-anchor="middle" class="chip-t" fill="#991b1b">event_queue</text>

  <text x="628" y="228" class="body">_recv_loop (daemon Thread):</text>
  <text x="648" y="246" class="body">├─ while connected: raw = ws.recv() → json.loads → queue.put(event)</text>
  <text x="648" y="264" class="body">├─ 只收消息入队, 不做厂商字段解析 (厂商无关)</text>
  <text x="648" y="282" class="body">└─ queue.Queue 线程安全阻塞队列</text>
  <rect x="628" y="292" width="500" height="14" rx="3" fill="#fef2f2"/>
  <text x="878" y="303" text-anchor="middle" class="note" font-style="italic">后台线程持续运行, 推送时继续接收</text>

  <!-- Parse + Output -->
  <rect x="48" y="326" width="540" height="68" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="318" y="348" text-anchor="middle" class="box-name" fill="#92400e">adapter.recv(timeout=5) → _parse_event(event)</text>
  <text x="68" y="368" class="body">event_queue.get(timeout=5) 阻塞等待 → 子类 _parse_event 解析厂商字段</text>
  <text x="68" y="384" class="body">_record_raw_event → _ai_audio_chunks.append(pcm) → _mark_first_frame() → _record_frame()</text>

  <rect x="608" y="326" width="540" height="68" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="878" y="348" text-anchor="middle" class="box-name" fill="#166534">adapter.output (property, 按需聚合)</text>
  <text x="628" y="368" class="body">audio = b''.join(_ai_audio_chunks) | text = ''.join(_ai_text_chunks)</text>
  <text x="628" y="384" class="body">latency_ms | event_log | frame_results | raw_event_log</text>

  <!-- Design principles bar -->
  <rect x="48" y="408" width="1144" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="620" y="428" text-anchor="middle" class="body" fill="#1e40af">推送与接收分离: send() 同步快返回, _recv_loop 后台持续运行 | 厂商字段隔离: _recv_loop 只入队, _parse_event 子类解析, executor 只读归一化事件</text>
  <rect x="48" y="448" width="1144" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="620" y="466" text-anchor="middle" class="body" fill="#166534">帧结果实时记录: _parse_event 每次 _record_frame(), 不等回复结束 | 最终结果按需聚合: adapter.output property 实时拼接所有帧</text>

  <!-- ② 正常轮时序 -->
  <rect x="24" y="544" width="1192" height="380" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="544" width="1192" height="38" rx="10" fill="#e2e8f0"/>
  <rect x="24" y="570" width="1192" height="12" fill="#e2e8f0"/>
  <circle cx="46" cy="563" r="11" fill="#64748b"/>
  <text x="46" y="567" class="num-badge">2</text>
  <text x="66" y="568" class="sec-title" fill="#334155">正常轮完整时序 (Normal Round)</text>

  <!-- Column headers -->
  <rect x="200" y="596" width="100" height="24" rx="4" fill="#2563eb"/>
  <text x="250" y="612" text-anchor="middle" class="chip-t" fill="#fff">executor</text>
  <rect x="600" y="596" width="100" height="24" rx="4" fill="#dc2626"/>
  <text x="650" y="612" text-anchor="middle" class="chip-t" fill="#fff">_recv_loop</text>
  <rect x="950" y="596" width="100" height="24" rx="4" fill="#7c3aed"/>
  <text x="1000" y="612" text-anchor="middle" class="chip-t" fill="#fff">API</text>

  <line x1="250" y1="620" x2="250" y2="900" stroke="#dbeafe" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="650" y1="620" x2="650" y2="900" stroke="#fee2e2" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="1000" y1="620" x2="1000" y2="900" stroke="#ede9fe" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="55" y="640" class="ts-lbl">T0</text>
  <path d="M 250 640 L 1000 640" class="flow-blue"/>
  <text x="625" y="635" text-anchor="middle" class="note">send(chunk_0) — 推送主讲人音频</text>

  <text x="55" y="670" class="ts-lbl">T0+N</text>
  <path d="M 250 670 L 1000 670" class="flow-blue"/>
  <text x="625" y="665" text-anchor="middle" class="note">send(chunk_N) + sleep(100ms)</text>

  <text x="55" y="700" class="ts-lbl">commit</text>
  <path d="M 250 700 L 1000 700" class="flow-blue"/>
  <text x="625" y="695" text-anchor="middle" class="note">commit_input() → mark_commit() 记录 T0</text>

  <text x="55" y="730" class="ts-lbl">T1</text>
  <path d="M 1000 730 L 650 730" class="flow-red"/>
  <text x="825" y="725" text-anchor="middle" class="note">response.audio.delta (AI 音频帧1)</text>
  <path d="M 650 730 L 250 730" class="flow-amber"/>
  <text x="450" y="725" text-anchor="middle" class="note">recv() → _parse_event → _mark_first_frame T1</text>
  <rect x="180" y="716" width="140" height="18" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="250" y="729" text-anchor="middle" class="chip-t" fill="#166534">latency_ms = T1-T0</text>

  <text x="55" y="770" class="ts-lbl">T2..N</text>
  <path d="M 1000 770 L 650 770" class="flow-red"/>
  <text x="825" y="765" text-anchor="middle" class="note">response.audio.delta ×N (流式音频)</text>
  <path d="M 650 770 L 250 770" class="flow-amber"/>
  <text x="450" y="765" text-anchor="middle" class="note">recv() ×N → 帧结果实时记录</text>

  <text x="55" y="800" class="ts-lbl">done</text>
  <path d="M 1000 800 L 650 800" class="flow-red"/>
  <text x="825" y="795" text-anchor="middle" class="note">response.audio.done</text>
  <path d="M 650 800 L 250 800" class="flow-amber"/>
  <text x="450" y="795" text-anchor="middle" class="note">recv() → "ai_audio_done" ✓</text>

  <rect x="170" y="816" width="170" height="22" rx="6" fill="#16a34a"/>
  <text x="255" y="831" text-anchor="middle" class="chip-t" fill="#fff" font-weight="600">output.audio → 保存 wav + 评估</text>

  <text x="400" y="860" class="note" font-style="italic">推送时 _recv_loop 继续接收; 接收时 executor 可以继续推送下一个 chunk — 互不阻塞</text>

  <!-- ③ 打断轮时序 -->
  <rect x="24" y="940" width="1192" height="600" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="940" width="1192" height="38" rx="10" fill="#fee2e2"/>
  <rect x="24" y="966" width="1192" height="12" fill="#fee2e2"/>
  <circle cx="46" cy="959" r="11" fill="#dc2626"/>
  <text x="46" y="963" class="num-badge">3</text>
  <text x="66" y="964" class="sec-title" fill="#991b1b">打断轮完整时序 (Barge-in Round)</text>

  <!-- Column headers -->
  <rect x="200" y="992" width="送上" height="0" fill="none"/>
  <rect x="200" y="992" width="100" height="24" rx="4" fill="#2563eb"/>
  <text x="250" y="1008" text-anchor="middle" class="chip-t" fill="#fff">executor</text>
  <rect x="600" y="992" width="100" height="24" rx="4" fill="#dc2626"/>
  <text x="650" y="1008" text-anchor="middle" class="chip-t" fill="#fff">_recv_loop</text>
  <rect x="950" y="992" width="100" height="24" rx="4" fill="#7c3aed"/>
  <text x="1000" y="1008" text-anchor="middle" class="chip-t" fill="#fff">API</text>

  <line x1="250" y1="1016" x2="250" y2="1520" stroke="#fee2e2" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="650" y1="1016" x2="650" y2="1520" stroke="#fee2e2" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="1000" y1="1016" x2="1000" y2="1520" stroke="#fee2e2" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="55" y="1040" class="ts-lbl">等AI说话</text>
  <path d="M 1000 1040 L 650 1040" class="flow-red"/>
  <text x="825" y="1035" text-anchor="middle" class="note">AI 音频帧1 (AI 正在回复)</text>
  <path d="M 650 1040 L 250 1040" class="flow-amber"/>
  <text x="450" y="1035" text-anchor="middle" class="note">recv() → "ai_audio_delta" ✓ AI已开始说话</text>

  <text x="55" y="1075" class="ts-lbl">延迟</text>
  <rect x="170" y="1062" width="160" height="20" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="250" y="1076" text-anchor="middle" class="chip-t" fill="#92400e">sleep(interruption_delay_ms)</text>
  <text x="700" y="1076" text-anchor="middle" class="note">← 等 AI 说一会儿 (如 1500ms)</text>

  <text x="55" y="1110" class="ts-lbl">推打断音频</text>
  <path d="M 250 1110 L 1000 1110" class="flow-blue"/>
  <text x="625" y="1105" text-anchor="middle" class="note">send(打断音频 chunk_0..N) + commit_input()</text>

  <text x="55" y="1148" class="ts-lbl">检测窗口</text>
  <rect x="170" y="1134" width="200" height="24" rx="6" fill="#fef0f0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="270" y="1150" text-anchor="middle" class="chip-t" fill="#dc2626" font-weight="600">Barge-in 检测窗口 (5s)</text>
  <path d="M 1000 1160 L 650 1160" class="flow-red"/>
  <text x="825" y="1155" text-anchor="middle" class="note" font-weight="600" fill="#dc2626">speech_started! / response.cancelled</text>
  <path d="M 650 1160 L 250 1160" class="flow-amber"/>
  <text x="450" y="1155" text-anchor="middle" class="note" font-weight="600" fill="#dc2626">recv() → barge_in_detected=True ✓</text>

  <rect x="170" y="1174" width="180" height="20" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="260" y="1188" text-anchor="middle" class="chip-t" fill="#166534">barge_in_latency_ms = 精确延迟</text>

  <text x="55" y="1220" class="ts-lbl">等AI重回复</text>
  <path d="M 1000 1220 L 650 1220" class="flow-red"/>
  <text x="825" y="1215" text-anchor="middle" class="note">AI 新音频帧1 (AI 重新回复)</text>
  <path d="M 650 1220 L 250 1220" class="flow-amber"/>
  <text x="450" y="1215" text-anchor="middle" class="note">recv() → "ai_audio_delta"</text>

  <path d="M 1000 1250 L 650 1250" class="flow-red"/>
  <text x="825" y="1245" text-anchor="middle" class="note">AI 新音频帧 ×N (流式音频)</text>
  <path d="M 650 1250 L 250 1250" class="flow-amber"/>
  <text x="450" y="1245" text-anchor="middle" class="note">recv() ×N → 帧结果记录</text>

  <path d="M 1000 1280 L 650 1280" class="flow-red"/>
  <text x="825" y="1275" text-anchor="middle" class="note">response.audio.done</text>
  <path d="M 650 1280 L 250 1280" class="flow-amber"/>
  <text x="450" y="1275" text-anchor="middle" class="note">recv() → "ai_audio_done" ✓</text>

  <rect x="120" y="1296" width="260" height="28" rx="6" fill="#16a34a"/>
  <text x="250" y="1314" text-anchor="middle" class="chip-t" fill="#fff" font-weight="600">output = 新回复PCM + barge_in + latency</text>

  <rect x="900" y="1296" width="260" height="28" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="1030" y="1314" text-anchor="middle" class="chip-t" fill="#dc2626">未检测到 speech_started → barge-in 失败</text>

  <rect x="48" y="408" width="1144" height="32" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="24" y="1550" width="1192" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="48" y="1572" class="box-name" fill="#166534">关键设计原则</text>
  <text x="48" y="1590" class="body" fill="#166534">① 推送与接收分离: send() 同步快返回, _recv_loop 后台持续运行 | ② 厂商字段隔离: _recv_loop 只入队, _parse_event 子类解析, executor 只读归一化事件</text>

  <rect x="24" y="1610" width="1192" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="48" y="1632" class="box-name" fill="#1e40af">帧结果与最终结果</text>
  <text x="48" y="1650" class="body" fill="#1e40af">③ 帧结果实时记录: _parse_event 每次 _record_frame(), 不等回复结束 | ④ 最终结果按需聚合: adapter.output property 实时拼接 audio = b''.join(_ai_audio_chunks)</text>

  <!-- E2E vs Realtime comparison -->
  <rect x="24" y="1670" width="1192" height="230" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="1670" width="1192" height="38" rx="10" fill="#e2e8f0"/>
  <rect x="24" y="1696" width="1192" height="12" fill="#e2e8f0"/>
  <circle cx="46" cy="1689" r="11" fill="#64748b"/>
  <text x="46" y="1693" class="num-badge">4</text>
  <text x="66" y="1694" class="sec-title" fill="#334155">E2E device_driver vs Realtime api_adapter 对比</text>

  <line x1="48" y1="1724" x2="1192" y2="1724" stroke="#e2e8f0" stroke-width="1"/>
  <text x="68" y="1742" class="lbl" fill="#475569">维度</text>
  <text x="340" y="1742" class="lbl" fill="#475569">E2E (device_driver)</text>
  <text x="780" y="1742" class="lbl" fill="#475569">Realtime (adapter)</text>
  <line x1="48" y1="1750" x2="1192" y2="1750" stroke="#e2e8f0" stroke-width="1"/>
  <text x="68" y="1768" class="body">推送方式</text>
  <text x="340" y="1768" class="body">PyAudio callback 实时混音播放</text>
  <text x="780" y="1768" class="body">adapter.send() 逐 chunk WebSocket 推送</text>
  <text x="68" y="1788" class="body">接收方式</text>
  <text x="340" y="1788" class="body">PyAudio 录音 callback 抓取 PCM</text>
  <text x="780" y="1788" class="body">_recv_loop 后台线程 → 事件队列</text>
  <text x="68" y="1808" class="body">AI 说话检测</text>
