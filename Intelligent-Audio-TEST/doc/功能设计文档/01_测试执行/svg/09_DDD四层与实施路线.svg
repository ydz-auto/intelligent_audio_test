<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1400" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sec-title { font-size: 14px; font-weight: 700; }
      .flow { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-red { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowRed); }
      .flow-violet { stroke: #7c3aed; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowViolet); }
      .box-name { font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .box-desc { font-size: 10px; fill: #64748b; }
      .note { font-size: 9.5px; fill: #64748b; }
      .body { font-size: 10.5px; fill: #334155; }
      .pill-t { font-size: 10px; font-weight: 600; text-anchor: middle; }
      .chip-t { font-size: 9.5px; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="1400" fill="#f1f5f9"/>

  <text x="24" y="44" font-size="21" font-weight="700" fill="#0f172a">测试执行 · 前后端统一设计（DDD 四层镜像）与实施路线 P0→P3</text>
  <text x="24" y="68" font-size="12" fill="#64748b">同一套四层结构与命名纪律：Presentation 只见 camelCase · Infrastructure 唯一知道 snake_case · Domain 零依赖 · Application 编排用例与缓存 ReadModel</text>

  <!-- ① 四层镜像 -->
  <rect x="24" y="92" width="1192" height="286" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="92" width="1192" height="38" rx="10" fill="#e0e7ff"/>
  <rect x="24" y="118" width="1192" height="12" fill="#e0e7ff"/>
  <circle cx="46" cy="111" r="11" fill="#6366f1"/>
  <text x="46" y="115" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="66" y="116" class="sec-title" fill="#3730a3">前后端 DDD 四层对称（02 §3.7 · §10）— 层职责一一对应，命名与依赖方向同构</text>

  <g>
    <text x="60" y="150" class="body" font-weight="700" fill="#334155">层</text>
    <text x="200" y="150" class="body" font-weight="700" fill="#3730a3">前端（Vue3 + TS + Pinia）</text>
    <text x="640" y="150" class="body" font-weight="700" fill="#065f46">后端服务（以 api_test_service 为例）</text>
    <line x1="44" y1="158" x2="1216" y2="158" stroke="#a5b4fc"/>
    <g class="note" fill="#475569">
      <text x="60" y="176">Presentation</text><text x="200" y="176">views/ + components/ —— 只见 camelCase Domain 与 composables（Ports）</text><text x="640" y="176">api_gateway/routes/*_bp.py + schemas/（业务逻辑不下沉到路由）</text>
      <text x="60" y="200">Application</text><text x="200" y="200">composables/ + store/ —— 编排用例、缓存 ReadModel，只见 Domain</text><text x="640" y="200">application/commands · queries · handlers（Command 只写 / Query 只读）</text>
      <text x="60" y="224">Domain</text><text x="200" y="224">domain/model/ + domain/enums.ts —— 零依赖、无索引签名兜底</text><text x="640" y="224">domain/entities · value_objects · events · services</text>
      <text x="60" y="248">Infrastructure</text><text x="200" y="248">api/ + adapters/ + dto/ + http/ —— 唯一知道 snake_case 的层</text><text x="640" y="248">infrastructure/grpc_proxies · acl · persistence · oss + interfaces/grpc</text>
    </g>
    <line x1="44" y1="262" x2="1216" y2="262" stroke="#a5b4fc"/>
    <rect x="44" y="270" width="580" height="52" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2"/>
    <text x="60" y="290" font-size="11" font-weight="700" fill="#3730a3">读模型对称</text>
    <text x="60" y="308" class="note">前端 store 缓存 ReadModel ↔ 网关 api_gateway/infrastructure/read_models/read_models.py 缓存查询视图</text>
    <text x="60" y="320" class="note">进度优先读 Redis 进度缓存，详情读 DB；Query 禁止反向触发写</text>
    <rect x="636" y="270" width="580" height="52" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
    <text x="652" y="290" font-size="11" font-weight="700" fill="#065f46">网关是 camelCase ↔ snake_case 的转换边界</text>
    <text x="652" y="308" class="note">domain/repositories/acl 定义端口接口 + infrastructure/acl 提供 gRPC 实现（ACL 仓储模式）</text>
    <text x="652" y="320" class="note">网关无直连 DB；CRUD 全部经 gRPC（17 个域蓝图，*_command_service / *_query_service 成对）</text>
    <text x="46" y="348" class="note" fill="#b91c1c">禁止跨层调用与反向依赖：视图不得 import dto / http；Domain 不得出现框架与协议细节；索引签名兜底（[key: string]: any）视为坏味道</text>
    <text x="46" y="366" class="body">Socket.IO 契约：命名空间 '/' 推 task_progress / report_generated / secondary_compare_generated；'/ws/logs' 推 task_log（subscribe_task · unsubscribe_task · set_filter）</text>
  </g>

  <!-- ② 五层对称模板 -->
  <rect x="24" y="394" width="1192" height="180" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="394" width="1192" height="38" rx="10" fill="#dcfce7"/>
  <rect x="24" y="420" width="1192" height="12" fill="#dcfce7"/>
  <circle cx="46" cy="413" r="11" fill="#16a34a"/>
  <text x="46" y="417" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="66" y="418" class="sec-title" fill="#14532d">新页面标准模板 — SPLMapping 五层对称（UC-0902 声压级映射页，可复制到任意新域）</text>

  <rect x="44" y="440" width="176" height="52" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="132" y="460" class="box-name" text-anchor="middle" font-size="11">SPLMapping.vue</text>
  <text x="132" y="476" class="chip-t" fill="#64748b">Presentation · 表格 / 表单</text>
  <text x="132" y="488" class="chip-t" fill="#059669">views/Evaluation/</text>
  <line x1="220" y1="466" x2="232" y2="466" class="flow"/>
  <rect x="234" y="440" width="176" height="52" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="322" y="460" class="box-name" text-anchor="middle" font-size="11">useSplMapping</text>
  <text x="322" y="476" class="chip-t" fill="#64748b">composables = Port</text>
  <text x="322" y="488" class="chip-t" fill="#059669">编排用例 · 缓存 ReadModel</text>
  <line x1="410" y1="466" x2="422" y2="466" class="flow"/>
  <rect x="424" y="440" width="176" height="52" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="512" y="460" class="box-name" text-anchor="middle" font-size="11">splPort → splApi</text>
  <text x="512" y="476" class="chip-t" fill="#64748b">api/splApi.ts</text>
  <text x="512" y="488" class="chip-t" fill="#059669">http 封装 · 拦截器</text>
  <line x1="600" y1="466" x2="612" y2="466" class="flow"/>
  <rect x="614" y="440" width="176" height="52" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="702" y="460" class="box-name" text-anchor="middle" font-size="11">splAdapter → splDto</text>
  <text x="702" y="476" class="chip-t" fill="#64748b">snake_case 唯一出现处</text>
  <text x="702" y="488" class="chip-t" fill="#92400e">字段一一对应 proto</text>
  <line x1="790" y1="466" x2="802" y2="466" class="flow"/>
  <rect x="804" y="440" width="186" height="52" rx="8" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="897" y="460" class="box-name" text-anchor="middle" font-size="11">domain/model/spl.ts</text>
  <text x="897" y="476" class="chip-t" fill="#64748b">camelCase · 零依赖</text>
  <text x="897" y="488" class="chip-t" fill="#3730a3">+ domain/enums.ts 枚举</text>
  <text x="46" y="516" class="note" text-anchor="start">验收：五层模板完整、无跨层调用；rms_db / gain_db 等后端字段经 Adapter 映射为 rmsDb / gainDb 后才进入视图</text>

  <rect x="44" y="524" width="1172" height="34" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="60" y="546" class="chip-t" fill="#854d0e" text-anchor="start">配置化与命名纪律：端口 service_ports.py ｜ 并发 concurrency_config.json ｜ 枚举 common_enums.py ↔ enums.ts ｜ 队列 task:queue + BRPOP 超时（常量化）｜ 环境变量覆盖 BaseConfig ｜ 开关 DISTRIBUTED_COORDINATOR_ENABLED</text>

  <!-- ③ 实施路线 -->
  <rect x="24" y="590" width="1192" height="470" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="590" width="1192" height="38" rx="10" fill="#dbeafe"/>
  <rect x="24" y="616" width="1192" height="12" fill="#dbeafe"/>
  <circle cx="46" cy="609" r="11" fill="#3b82f6"/>
  <text x="46" y="613" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="66" y="614" class="sec-title" fill="#1e3a8a">实施路线 P0 → P3（02 §11）— 先重构（契约 / 模型 / 枚举先行），再管消费方（网关与前端切换）</text>

  <rect x="44" y="636" width="280" height="150" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.4"/>
  <rect x="44" y="636" width="280" height="24" rx="8" fill="#3b82f6"/>
  <rect x="44" y="650" width="280" height="10" fill="#3b82f6"/>
  <text x="60" y="653" font-size="11.5" font-weight="700" fill="#ffffff">P0 · 契约与数据（先行）</text>
  <text x="60" y="678" class="body">① 枚举：DeviceType / APIProtocol /</text>
  <text x="60" y="692" class="body">　 OutputType / CalibrationStatus</text>
  <text x="60" y="706" class="body">② TaskCase 增 device_type / device_id</text>
  <text x="60" y="720" class="body">　 + 迁移脚本与索引</text>
  <text x="60" y="734" class="body">③ proto：StartAPITestRequest /</text>
  <text x="60" y="748" class="body">　 EvaluateCaseRequest / RenderAudioStream</text>
  <text x="60" y="762" class="body">④ _dispatch_case_by_type 改按 device_type</text>
  <text x="60" y="778" class="note">⑤ 前端 enums.ts 镜像</text>

  <rect x="344" y="636" width="280" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="344" y="636" width="280" height="24" rx="8" fill="#16a34a"/>
  <rect x="344" y="650" width="280" height="10" fill="#16a34a"/>
  <text x="360" y="653" font-size="11.5" font-weight="700" fill="#ffffff">P1 · api_test_service DDD 落位</text>
  <text x="360" y="678" class="body">① application/services/ 新建：</text>
  <text x="360" y="692" class="body">　 api_session_executor / realtime_session_executor</text>
  <text x="360" y="706" class="body">② infrastructure/adapters/ 新建：</text>
  <text x="360" y="720" class="body">　 APIAdapterFactory + BaseAPIAdapter 生命周期</text>
  <text x="360" y="734" class="body">③ 会话绑定元数据落 Redis（RedisStore）</text>
  <text x="360" y="748" class="body">④ core/ 旧实现迁移退役</text>
  <text x="360" y="762" class="note">⑤ RenderAudioStream 消费链路联调</text>
  <text x="360" y="778" class="note">语义不变，仅目录与依赖方向归位</text>

  <rect x="644" y="636" width="280" height="150" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <rect x="644" y="636" width="280" height="24" rx="8" fill="#dc2626"/>
  <rect x="644" y="650" width="280" height="10" fill="#dc2626"/>
  <text x="660" y="653" font-size="11.5" font-weight="700" fill="#ffffff">P2 · 分布式协同</text>
  <text x="660" y="678" class="body">① endpoint 并发改 DistributedSemaphore</text>
  <text x="660" y="692" class="body">　 sem:api:endpoint:{host} + max_per_endpoint</text>
  <text x="660" y="706" class="body">② physical 互斥落 DistributedLock</text>
  <text x="660" y="720" class="body">　 lock:task:physical:{device_id}</text>
  <text x="660" y="734" class="body">③ running_e2e / running_apis 多副本升级预留</text>
  <text x="660" y="748" class="body">④ replicas:2 全链路联调</text>
  <text x="660" y="762" class="note">　 调度 → 收养 → 亲和路由 → 事件隔离</text>
  <text x="660" y="778" class="note">⑤ Redis key 前缀全部枚举化（RedisKeyPrefix）</text>

  <rect x="944" y="636" width="272" height="150" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="944" y="636" width="272" height="24" rx="8" fill="#7c3aed"/>
  <rect x="944" y="650" width="272" height="10" fill="#7c3aed"/>
  <text x="960" y="653" font-size="11.5" font-weight="700" fill="#ffffff">P3 · api_adapter_service 下线</text>
  <text x="960" y="678" class="body">① 能力并入 api_test_service Adapter 体系</text>
  <text x="960" y="692" class="body">② 网关 grpc_proxies 切换调用方</text>
  <text x="960" y="706" class="body">③ 从 run_all.py / docker-compose.yml 移除</text>
  <text x="960" y="720" class="body">④ 清理 service_ports.py 相关常量</text>
  <text x="960" y="734" class="body">⑤ 注册表与 adapter 实现随迁</text>
  <text x="960" y="748" class="note">　 (protocol, vendor) 键不变，apis 配置零变更</text>
  <text x="960" y="762" class="note">同时消除容器内 8000 / 注册 5008 的遗留不一致</text>
  <text x="960" y="778" class="note">服务数收敛：11 → 10（后端）</text>

  <line x1="324" y1="711" x2="342" y2="711" class="flow"/>
  <line x1="624" y1="711" x2="642" y2="711" class="flow"/>
  <line x1="924" y1="711" x2="942" y2="711" class="flow"/>

  <rect x="44" y="800" width="1172" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="60" y="820" font-size="11.5" font-weight="700" fill="#1e3a8a">迁移时间线与回滚策略（05 §四）</text>
  <text x="60" y="840" class="body">P0 双写期：新增列可空，读旧兼容（task.type）+ 写新（device_type）→ 回填脚本 scripts/migrations/… 分批次 UPDATE → 校验计数一致后再切判定分支</text>
  <text x="60" y="858" class="note" fill="#b91c1c">每阶段可独立回滚：P0 回滚 = 判定分支切回 task.type（保留一版）；P1 回滚 = core/ 与 application/services/ 双入口并存；P2 回滚 = 开关 DISTRIBUTED_COORDINATOR_ENABLED；P3 不可逆（服务下线），须 P1+P2 全绿后执行</text>

  <g>
    <text x="60" y="906" class="body" font-weight="700" fill="#334155">废弃清单（05 §3.1）</text>
    <text x="60" y="928" class="note">· task.type 作为执行路由依据 —— 废弃，改 TaskCase.device_type　· test_type 冗余列 —— 废弃（由 device_type + algorithm_type 表达）</text>
    <text x="60" y="944" class="note">· TaskType 引入 'realtime_api' —— 不引入（语义由 device_type 承载）　· 进程内 dict 设备互斥 —— 废弃，改 Redis 锁</text>
    <text x="60" y="960" class="note">· log_and_emit 直发 Socket.IO —— 废弃，改 EventBus 发布 + 网关转发　· 消费侧 AudioStreamOrchestrator.chunk_audio —— 下沉 audio_service</text>
    <text x="60" y="976" class="note">· api_adapter_service 独立服务 —— P3 下线并入 api_test_service　· 前端组件直连后端单体接口 —— 改四层镜像 + Port</text>
    <text x="60" y="996" class="note" fill="#c2410c">· 魔法值一并清零：device_type / 端口 / 并发上限 / 阈值 / 锁 TTL / 事件名 / 状态字符串 —— 全部枚举化或配置化</text>
    <text x="60" y="1016" class="body" fill="#1e3a8a" font-weight="700">落位原则：不新建服务、不引入 MQ；跨服务一律 gRPC + ACL；分布式协同复用 Redis（EventBus + task:queue + 锁/信号量 + 服务注册）；执行器统一继承 BaseExecutor 五 mixin 基座。</text>
    <text x="60" y="1036" class="note">设计目标校验：语义不变（device_type 路由 / Adapter 生命周期 / E2E 与 Realtime 对称 / SPL 映射）· 落位按服务边界重组 · 开发/生产分环境配置矩阵。</text>
    <text x="60" y="1052" class="note">（注：P0~P3 涉及路径与端口以 01_服务拓扑与总体架构.svg 的核验清单为准，图中「新增 / 待建」标注对应文档「（新增）」标记）</text>
  </g>

  <!-- ④ 验收清单 -->
  <rect x="24" y="1076" width="1192" height="278" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="1076" width="1192" height="38" rx="10" fill="#e2e8f0"/>
  <rect x="24" y="1102" width="1192" height="12" fill="#e2e8f0"/>
  <circle cx="46" cy="1095" r="11" fill="#64748b"/>
  <text x="46" y="1099" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="66" y="1100" class="sec-title" fill="#1e293b">UseCase 验收对照（01 各 UC 验收标准 · 逐条可验证）</text>

  <rect x="44" y="1122" width="384" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="1142" font-size="11.5" font-weight="700" fill="#065f46">UC-0901 被测 API 管理</text>
  <text x="60" y="1160" class="note">apis 新增列落库（device_type / adapter_class /</text>
  <text x="60" y="1174" class="note">audio_config / output_types / rms_spl_mapping_id）</text>
  <text x="60" y="1190" class="note">CRUD 全经 gRPC，网关无直连 DB</text>
  <text x="60" y="1206" class="note" fill="#b91c1c">密钥不出现在任何日志与事件 payload</text>

  <rect x="442" y="1122" width="384" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="458" y="1142" font-size="11.5" font-weight="700" fill="#065f46">UC-0902 RMS SPL 校准映射</text>
  <text x="458" y="1160" class="note">api_rms_spl_mappings 落库并与 API 关联</text>
  <text x="458" y="1174" class="note">spl_to_gain 多点插值结果与校准点一致</text>
  <text x="458" y="1190" class="note">同一 API 并发校准被分布式锁互斥，无脏数据</text>
  <text x="458" y="1206" class="note" fill="#b91c1c">间隔 / TTL / 插值边界均配置化</text>

  <rect x="840" y="1122" width="376" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="856" y="1142" font-size="11.5" font-weight="700" fill="#065f46">UC-0903 任务关联被测设备</text>
  <text x="856" y="1160" class="note">task_case_relations 含 device_id + device_type</text>
  <text x="856" y="1174" class="note">混跑示例（4 用例 3 类型）全部正确分发</text>
  <text x="856" y="1190" class="note">同一物理设备同时仅一个任务占用（锁验证）</text>
  <text x="856" y="1206" class="note" fill="#b91c1c">废弃字段不再读写，TaskType 无 realtime_api</text>

  <rect x="44" y="1234" width="572" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="1254" font-size="11.5" font-weight="700" fill="#5b21b6">UC-1001 事件隔离 · UC-1002 帧/汇总双通道</text>
  <text x="60" y="1272" class="note">并发 ≥2 任务，各前端会话仅收到自己 task_id 的事件（房间隔离）</text>
  <text x="60" y="1286" class="note">frame 时间戳 ms 精度；帧拼接 == summary.audio；评估只读 summary</text>
  <text x="60" y="1300" class="note">executor 不读厂商字段（不读 event["delta"] / ["audio_chunk"]）</text>
  <text x="60" y="1316" class="note" fill="#b91c1c">节流阈值可配置且无魔法数字；全库无裸字符串频道名</text>

  <rect x="632" y="1234" width="584" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="648" y="1254" font-size="11.5" font-weight="700" fill="#5b21b6">UC-1003 新增厂商 Realtime 适配器（OCP）</text>
  <text x="648" y="1272" class="note">新厂商只新增一个子类文件（4 抽象方法）+ 一次 register 调用</text>
  <text x="648" y="1286" class="note">基类 / executor / 工厂零改动；归一化事件 11 种全覆盖</text>
  <text x="648" y="1300" class="note">帧与汇总经基类统一属性输出（UC-1002 契约不变）</text>
  <text x="648" y="1316" class="note" fill="#b91c1c">vendor / 事件类型枚举化；自动匹配冲突 → 启动期抛错强制显式配置</text>

  <text x="46" y="1348" class="body" font-weight="700" fill="#1e293b">总验收：架构 = DDD + CQRS + 消息/事件驱动（Redis 队列与频道）；开发/生产双环境；enum 化；配置化；坏味道清零（魔法数字 / 魔法字符串 / 硬编码 / 大文件 / 大函数 / 重复代码未抽公共组件 / 设计模式缺失）。</text>
  <text x="46" y="1366" class="note">「先重构，再管消费方」：P0 契约与模型 → P1 服务内部落位 → P2 分布式正确性 → P3 服务收敛；每步交付后网关与前端再切换。</text>

  <line x1="0" y1="1382" x2="1240" y2="1382" stroke="#cbd5e1" stroke-width="1"/>
