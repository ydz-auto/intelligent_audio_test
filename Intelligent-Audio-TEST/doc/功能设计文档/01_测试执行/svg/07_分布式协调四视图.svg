<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1380" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sec-title { font-size: 14px; font-weight: 700; }
      .flow { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-red { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowRed); }
      .flow-violet { stroke: #7c3aed; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowViolet); }
      .box-name { font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .box-desc { font-size: 10px; fill: #64748b; }
      .note { font-size: 9.5px; fill: #64748b; }
      .body { font-size: 10.5px; fill: #334155; }
      .pill-t { font-size: 10px; font-weight: 600; text-anchor: middle; }
      .chip-t { font-size: 9.5px; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="1380" fill="#f1f5f9"/>

  <text x="24" y="44" font-size="21" font-weight="700" fill="#0f172a">测试执行 · 分布式协调四视图（V9.7.31 新增视图，源单体无对应）</text>
  <text x="24" y="68" font-size="12" fill="#64748b">原语：shared/utils/distributed_coordinator.py（DistributedLock / DistributedSemaphore / set_flag / try_claim_task）· service_registry.py（RedisServiceRegistry）· redis_pubsub.py（EventBus）</text>

  <!-- ① SPL 校准互斥 -->
  <rect x="24" y="92" width="1192" height="300" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="92" width="1192" height="38" rx="10" fill="#ffedd5"/>
  <rect x="24" y="118" width="1192" height="12" fill="#ffedd5"/>
  <circle cx="46" cy="111" r="11" fill="#f59e0b"/>
  <text x="46" y="115" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="66" y="116" class="sec-title" fill="#9a3412">SPL 校准互斥 — 同一 device_id 全局串行（写路径只发生在 api_test_service）</text>

  <rect x="44" y="142" width="250" height="52" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="169" y="162" class="box-name" text-anchor="middle" font-size="11">前端 · 声压级映射页</text>
  <text x="169" y="178" class="chip-t" fill="#64748b">POST /api/digital-spl/{id}/calibrate</text>
  <line x1="294" y1="168" x2="308" y2="168" class="flow"/>
  <rect x="310" y="142" width="250" height="52" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="435" y="162" class="box-name" text-anchor="middle" font-size="11">api_gateway · spl_bp</text>
  <text x="435" y="178" class="chip-t" fill="#64748b">SPLCommandService（新增蓝图）</text>
  <line x1="560" y1="168" x2="574" y2="168" class="flow"/>
  <rect x="576" y="142" width="250" height="52" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="701" y="162" class="box-name" text-anchor="middle" font-size="11">api_test_service · SPL command</text>
  <text x="701" y="178" class="chip-t" fill="#64748b">gRPC ApiRmsSplConfigService（新增）· ACL</text>
  <line x1="826" y1="168" x2="840" y2="168" class="flow"/>
  <rect x="842" y="142" width="360" height="52" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="1022" y="162" class="box-name" text-anchor="middle" font-size="11" fill="#854d0e">DistributedLock.acquire</text>
  <text x="1022" y="178" class="chip-t" fill="#854d0e">key = spl:calibrate:{device_id} · ttl 30s · retry 0.1s / 30s</text>

  <rect x="44" y="210" width="760" height="112" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
  <text x="60" y="232" font-size="11.5" font-weight="700" fill="#166534">锁获取成功（持有随机 token）→ 采集 / 插值 / 落库 / 发布 → 释放</text>
  <text x="60" y="252" class="body">① audio_service gRPC :50052　StartSPL / MeasureSPL　多点采集（gain 扫描点序列配置化）→ 各点 SPL(dB)</text>
  <text x="60" y="270" class="body">② SPL → gain 多点插值（SPLMappingService / ApiRmsSplService.spl_to_gain）→ calibration_data.points</text>
  <text x="60" y="288" class="body">③ 落库 api_rms_spl_mappings（新增）+ 校准历史　calibration_status = CALIBRATED（枚举，非字符串）</text>
  <text x="60" y="306" class="body">④ EventBus 发布进度 / 完成（task_id = null，device_id）→ 网关 → Socket.IO　⑤ release：比对 token + Lua CAS</text>

  <rect x="820" y="210" width="382" height="112" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="836" y="232" font-size="11.5" font-weight="700" fill="#b91c1c">锁获取失败 / 冲突</text>
  <text x="836" y="252" class="body">重试至 retry_timeout → 返回「校准进行中」（409 语义）</text>
  <text x="836" y="270" class="body">执行期冲突：存在运行中 E2E 任务 → 拒绝（403）</text>
  <text x="836" y="288" class="note">避免后端扬声器被抢占</text>
  <text x="836" y="308" class="note">取代源单体的「隐式进程内互斥」</text>

  <rect x="44" y="332" width="1158" height="46" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="60" y="351" class="chip-t" fill="#854d0e" text-anchor="start" font-weight="700">finally 语义与死锁防护</text>
  <text x="60" y="368" class="note" text-anchor="start">采集中途失败 → finally 释放锁 + calibration_status 回滚 failed + EventBus 发布失败事件；持锁实例崩溃 → 锁 TTL 30s 到期自动过期（与视图 3 孤儿收养协同），杜绝死锁</text>
  <line x1="424" y1="194" x2="424" y2="208" class="flow"/>
  <text x="432" y="206" class="chip-t" fill="#16a34a" text-anchor="start">成功</text>
  <line x1="1010" y1="194" x2="1010" y2="208" class="flow-red"/>
  <text x="1018" y="206" class="chip-t" fill="#b91c1c" text-anchor="start">失败</text>

  <!-- ② physical 互斥 -->
  <rect x="24" y="408" width="1192" height="290" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="408" width="1192" height="38" rx="10" fill="#fee2e2"/>
  <rect x="24" y="434" width="1192" height="12" fill="#fee2e2"/>
  <circle cx="46" cy="427" r="11" fill="#dc2626"/>
  <text x="46" y="431" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="66" y="432" class="sec-title" fill="#7f1d1d">physical 设备互斥与 endpoint 并发控制 — 进程内 dict 方案废弃，升级为 Redis 原语（跨实例生效）</text>

  <rect x="44" y="458" width="240" height="52" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="164" y="478" class="box-name" text-anchor="middle" font-size="11">worker 领取 physical 用例</text>
  <text x="164" y="494" class="chip-t" fill="#64748b">e2e_test_service / api_test_service</text>
  <line x1="284" y1="484" x2="298" y2="484" class="flow"/>
  <rect x="300" y="458" width="280" height="52" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="440" y="478" class="box-name" text-anchor="middle" font-size="11">计算锁 key（前缀枚举化）</text>
  <text x="440" y="494" class="chip-t" fill="#64748b">lock:task:physical:{device_id}（RedisKeyPrefix）</text>
  <line x1="580" y1="484" x2="594" y2="484" class="flow"/>
  <rect x="596" y="458" width="290" height="52" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="741" y="478" class="box-name" text-anchor="middle" font-size="11" fill="#854d0e">acquire：SET NX PX + 随机 token</text>
  <text x="741" y="494" class="chip-t" fill="#854d0e">Redis 不可用 → 降级放行（仅开发）</text>
  <line x1="886" y1="484" x2="900" y2="484" class="flow"/>
  <rect x="902" y="458" width="300" height="52" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="1052" y="478" class="box-name" text-anchor="middle" font-size="11">重试策略</text>
  <text x="1052" y="494" class="chip-t" fill="#64748b">retry_interval 0.1s → retry_timeout 30s（配置化）</text>

  <rect x="44" y="526" width="570" height="88" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
  <text x="60" y="546" font-size="11.5" font-weight="700" fill="#166534">成功 → 执行 → 安全释放</text>
  <text x="60" y="564" class="body">device_service gRPC :50053 设备控制 / 音频下发（LoggingMixin 全程 → EventBus）</text>
  <text x="60" y="580" class="body">正常或异常均在 finally release：比对 token + Lua 原子「比对 + 删除」</text>
  <text x="60" y="600" class="note" fill="#b91c1c">防 A 的超时锁被 B 的释放误删（无 token 校验的实现是错的）</text>

  <rect x="632" y="526" width="570" height="88" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="648" y="546" font-size="11.5" font-weight="700" fill="#b91c1c">失败 / 持有者崩溃</text>
  <text x="648" y="564" class="body">超时仍失败 → 用例 FAILED（设备占用中）或重新入队，不阻塞其他用例</text>
  <text x="648" y="580" class="body">崩溃未 release → TTL 30s 自动过期 → Registry 判死 → 孤儿锁强制清理 + 收养</text>
  <text x="648" y="600" class="note">等待锁的任务不发执行事件，仅发排队状态，避免「假运行中」误导前端</text>

  <rect x="44" y="628" width="1158" height="60" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="60" y="648" font-size="11.5" font-weight="700" fill="#7f1d1d">并发上限类控制（配额，非互斥）</text>
  <text x="60" y="666" class="body">API 粒度（已有）：api:sem:{api_id} → DistributedSemaphore + 进程内 BoundedSemaphore 兜底（Lua 原子 INCR / DECR + EXPIRE）</text>
  <text x="60" y="682" class="body">endpoint 粒度（P2）：sem:api:endpoint:{host}，上限入 concurrency_config.json　·　E2E 全局互斥 running_e2e 多副本预留升级</text>

  <!-- ③ 孤儿收养 -->
  <rect x="24" y="714" width="1192" height="250" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="714" width="1192" height="38" rx="10" fill="#dbeafe"/>
  <rect x="24" y="740" width="1192" height="12" fill="#dbeafe"/>
  <circle cx="46" cy="733" r="11" fill="#3b82f6"/>
  <text x="46" y="737" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="66" y="738" class="sec-title" fill="#1e3a8a">孤儿任务收养与中断恢复 — worker_instance_id 记名 + 心跳 TTL + DB 真相源续跑</text>

  <rect x="44" y="764" width="280" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="184" y="784" class="box-name" text-anchor="middle" font-size="11">① 实例启动注册 + 心跳</text>
  <text x="184" y="800" class="chip-t" fill="#64748b">register(...) · TTL 15s · 心跳 ttl/3 = 5s</text>
  <line x1="324" y1="790" x2="334" y2="790" class="flow"/>
  <rect x="336" y="764" width="280" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="476" y="784" class="box-name" text-anchor="middle" font-size="11">② BRPOP 领取 → DB 记名</text>
  <text x="476" y="800" class="chip-t" fill="#64748b">worker_instance_id = 'A'（try_claim_task）</text>
  <line x1="616" y1="790" x2="626" y2="790" class="flow"/>
  <rect x="628" y="764" width="280" height="52" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="768" y="784" class="box-name" text-anchor="middle" font-size="11">③ 实例崩溃（OOM / 重启）</text>
  <text x="768" y="800" class="chip-t" fill="#b91c1c">心跳停止 → 超过 TTL 15s 过期</text>
  <line x1="908" y1="790" x2="918" y2="790" class="flow"/>
  <rect x="920" y="764" width="282" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="1061" y="784" class="box-name" text-anchor="middle" font-size="11">④ 实例 B 判死</text>
  <text x="1061" y="800" class="chip-t" fill="#64748b">get_alive_ids() 不含 A</text>

  <line x1="1061" y1="816" x2="1061" y2="836" class="flow" stroke-dasharray="0"/>
  <rect x="44" y="828" width="380" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="234" y="848" class="box-name" text-anchor="middle" font-size="11">⑤ 兜底扫描 DB</text>
  <text x="234" y="864" class="chip-t" fill="#64748b">worker_instance_id NOT NULL AND NOT IN alive_ids</text>
  <line x1="424" y1="854" x2="434" y2="854" class="flow"/>
  <rect x="436" y="828" width="380" height="52" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="626" y="848" class="box-name" text-anchor="middle" font-size="11">⑥ 解除归属 + 重新入队</text>
  <text x="626" y="864" class="chip-t" fill="#64748b">置 NULL → LPUSH task:queue</text>
  <line x1="816" y1="854" x2="826" y2="854" class="flow"/>
  <rect x="828" y="828" width="374" height="52" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
  <text x="1015" y="848" class="box-name" text-anchor="middle" font-size="11">⑦ 收养续跑（记 B）</text>
  <text x="1015" y="864" class="chip-t" fill="#065f46">completed 用例不重跑 · 中间态重入队 · 缓存可重建</text>

  <rect x="44" y="892" width="1158" height="56" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="60" y="912" class="chip-t" fill="#854d0e" text-anchor="start" font-weight="700">误杀防护与边界</text>
  <text x="60" y="930" class="note" text-anchor="start">BRPOP 后先校验归属（worker_instance_id ∈ {NULL, 本实例}）→ 非本实例持有的中间态任务不处理；实例重启仅恢复归属本实例或未归属的中间态任务；</text>
  <text x="60" y="944" class="note" text-anchor="start">收养期间原实例恰好复活（网络分区恢复）→ 由归属校验 + 原子置 NULL 保证只有一个实例持有。迁移脚本 scripts/migrations/202609/add_worker_instance_id.py（增列 + 索引）</text>

  <!-- ④ 事件隔离 -->
  <rect x="24" y="980" width="1192" height="176" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="980" width="1192" height="38" rx="10" fill="#ede9fe"/>
  <rect x="24" y="1006" width="1192" height="12" fill="#ede9fe"/>
  <circle cx="46" cy="999" r="11" fill="#7c3aed"/>
  <text x="46" y="1003" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="66" y="1004" class="sec-title" fill="#4c1d95">多任务事件隔离（UC-1001）— 四层递进，前端契约 TASK_SOCKET_EVENTS 保持不变</text>

  <rect x="44" y="1030" width="286" height="76" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="187" y="1050" class="box-name" text-anchor="middle" font-size="11">L1 · Redis 频道层</text>
  <text x="187" y="1066" class="chip-t" fill="#5b21b6">task:{task_id}:events（按 task_id 派生）</text>
  <text x="187" y="1080" class="chip-t" fill="#64748b">全局 task_progress / task_logs 亦带 taskId</text>
  <text x="187" y="1096" class="chip-t" fill="#b91c1c">频道名只来自 EventChannel 枚举</text>
  <line x1="330" y1="1068" x2="342" y2="1068" class="flow-violet"/>
  <rect x="344" y="1030" width="286" height="76" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="487" y="1050" class="box-name" text-anchor="middle" font-size="11">L2 · 网关过滤层</text>
  <text x="487" y="1066" class="chip-t" fill="#5b21b6">app.py::_start_redis_subscriber</text>
  <text x="487" y="1080" class="chip-t" fill="#64748b">按 payload.taskId 过滤分发，不转发无关事件</text>
  <text x="487" y="1096" class="chip-t" fill="#64748b">emit_sync / broadcast_log_sync 桥接循环</text>
  <line x1="630" y1="1068" x2="642" y2="1068" class="flow-violet"/>
  <rect x="644" y="1030" width="286" height="76" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="787" y="1050" class="box-name" text-anchor="middle" font-size="11">L3 · Socket.IO 房间层</text>
  <text x="787" y="1066" class="chip-t" fill="#5b21b6">room = task:{task_id}</text>
  <text x="787" y="1080" class="chip-t" fill="#64748b">'/' 推进度 · '/ws/logs' 推日志（sid 过滤）</text>
  <text x="787" y="1096" class="chip-t" fill="#64748b">_SocketIOCompatManager 维护房间映射</text>
  <line x1="930" y1="1068" x2="942" y2="1068" class="flow-violet"/>
  <rect x="944" y="1030" width="258" height="76" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
  <text x="1073" y="1050" class="box-name" text-anchor="middle" font-size="11">L4 · 前端路由层</text>
  <text x="1073" y="1066" class="chip-t" fill="#065f46">taskChannel.ts 按 taskId 路由</text>
  <text x="1073" y="1080" class="chip-t" fill="#64748b">→ 对应任务视图 / Pinia store</text>
  <text x="1073" y="1096" class="chip-t" fill="#64748b">多任务页面并行互不串扰</text>

  <text x="46" y="1128" class="note" fill="#4c1d95">兜底：事件链路丢失不影响正确性 —— DB 是唯一持久化真相源，进度由 task_service ReadModel 重建（CQRS 读模型兜底）；断线重连后按 task_id 重新入房，frame 从当前帧续传、summary 由落库数据兜底。</text>
  <text x="46" y="1146" class="note">验收：并发 ≥2 任务各前端仅收到自己 task_id 的事件 · 任一实例 kill 后心跳超时被收养并继续产出事件 · 全代码库无裸字符串频道名（静态检查 EventChannel 引用）· log_and_emit 直发模式已废弃</text>

  <!-- ⑤ 三层状态 -->
  <rect x="24" y="1172" width="1192" height="150" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="1172" width="1192" height="38" rx="10" fill="#e2e8f0"/>
  <rect x="24" y="1198" width="1192" height="12" fill="#e2e8f0"/>
  <circle cx="46" cy="1191" r="11" fill="#64748b"/>
  <text x="46" y="1195" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
