<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1210" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sec-title { font-size: 14px; font-weight: 700; }
      .flow { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-red { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowRed); }
      .flow-violet { stroke: #7c3aed; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowViolet); }
      .box-name { font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .box-desc { font-size: 10px; fill: #64748b; }
      .note { font-size: 9.5px; fill: #64748b; }
      .body { font-size: 10.5px; fill: #334155; }
      .pill-t { font-size: 10px; font-weight: 600; text-anchor: middle; }
      .chip-t { font-size: 9.5px; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="1210" fill="#f1f5f9"/>

  <text x="24" y="44" font-size="21" font-weight="700" fill="#0f172a">离线混音六步（下沉 audio_service）· SPL 映射与增益链路</text>
  <text x="24" y="68" font-size="12" fill="#64748b">三种 API 模式的混音编排完全一致（同一 orchestrator、同一 6 步），差别只在消费方式 · 用户配的是目标声压级 dB SPL，系统换算为数字增益后作用于 RMS</text>

  <!-- ① 消费侧 -->
  <rect x="24" y="92" width="1192" height="116" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="92" width="1192" height="38" rx="10" fill="#dcfce7"/>
  <rect x="24" y="118" width="1192" height="12" fill="#dcfce7"/>
  <circle cx="46" cy="111" r="11" fill="#16a34a"/>
  <text x="46" y="115" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="66" y="116" class="sec-title" fill="#14532d">消费侧 api_test_service —— 只做「组装请求 + 消费 chunk」，混音细节全部封在 audio_service 进程内</text>
  <rect x="44" y="138" width="580" height="56" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="60" y="158" font-size="11" font-weight="700" fill="#166534">① 组装 RenderAudioStreamRequest</text>
  <text x="60" y="176" class="body">audios_config = round.audios（type: speaker / interferer / noise · spl · delay · loop）</text>
  <text x="60" y="190" class="note">api_id = 被测 API.id · target_format = api.audio_config · background_noise_config = {轮次级, 全局级}（透传未合并）</text>
  <rect x="636" y="138" width="580" height="56" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="652" y="158" font-size="11" font-weight="700" fill="#166534">② AudioRenderAclRepositoryImpl（新增）→ gRPC :50052</text>
  <text x="652" y="176" class="body">ACL 仓储模式：执行器只见端口，proto 细节留在 infrastructure 层</text>
  <text x="652" y="190" class="note">SPL 增益由 api_test_service 侧预计算后随混音请求传入 → audio_service 不感知 SPL 语义</text>

  <line x1="630" y1="208" x2="630" y2="222" class="flow"/>
  <text x="642" y="220" class="chip-t" fill="#166534" text-anchor="start">跨服务边界：唯一 gRPC 调用点</text>

  <!-- ② 六步 -->
  <rect x="24" y="224" width="1192" height="392" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="224" width="1192" height="38" rx="10" fill="#dbeafe"/>
  <rect x="24" y="250" width="1192" height="12" fill="#dbeafe"/>
  <circle cx="46" cy="243" r="11" fill="#3b82f6"/>
  <text x="46" y="247" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="66" y="248" class="sec-title" fill="#1e3a8a">audio_service :: RenderService（新增）→ AudioStreamOrchestrator（新增）· 六步全部在本进程内完成</text>

  <g filter="url(#softShadow)">
    <rect x="44" y="282" width="382" height="140" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="44" y="282" width="382" height="24" rx="8" fill="#3b82f6"/>
    <rect x="44" y="296" width="382" height="10" fill="#3b82f6"/>
    <text x="60" y="299" font-size="11.5" font-weight="700" fill="#ffffff">Step 1 · 加载各源 PCM</text>
    <text x="60" y="326" class="body">audio_loader(audio_id) → PCM（源格式各不相同）</text>
    <text x="60" y="343" class="note">speaker 44.1k/24bit · interferer 48k/16bit · noise 44.1k/16bit</text>
    <text x="60" y="363" class="body">sources = [{config, pcm, type, target_spl, loop}]</text>
    <text x="60" y="383" class="note">输入 = round.audios + background_noise（轮次级 &gt; 全局级）</text>
    <text x="60" y="398" class="note">interferers[] 带 startDelay / spl / loop（通用，三类执行一致）</text>

    <rect x="438" y="282" width="368" height="140" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="438" y="282" width="368" height="24" rx="8" fill="#3b82f6"/>
    <rect x="438" y="296" width="368" height="10" fill="#3b82f6"/>
    <text x="454" y="299" font-size="11.5" font-weight="700" fill="#ffffff">Step 2 · 格式适配（v1.1 新增层）</text>
    <text x="454" y="326" class="body">detect_source_format(pcm, file) → resolve_target_format()</text>
    <text x="454" y="343" class="note">dst = api.audio_config（sample_rate / bit_depth / channels）</text>
    <text x="454" y="363" class="body">转换顺序固定：位深 24bit→float32→16bit · 采样率 resample_poly</text>
    <text x="454" y="378" class="body">通道 stereo → 下混均值 → mono</text>
    <text x="454" y="398" class="note" fill="#c2410c">★ 混音前必须适配：不同采样率样本无法直接叠加</text>
    <text x="454" y="412" class="note" fill="#c2410c">★ 无 SPL 配置时，本步仍然执行（只有增益跳过）</text>

    <rect x="818" y="282" width="378" height="140" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4"/>
    <rect x="818" y="282" width="378" height="24" rx="8" fill="#f59e0b"/>
    <rect x="818" y="296" width="378" height="10" fill="#f59e0b"/>
    <text x="834" y="299" font-size="11.5" font-weight="700" fill="#ffffff">Step 3 · RMS 补偿 + SPL 增益</text>
    <text x="834" y="326" class="body">3a 归一化到 −30 dBFS：rms = sqrt(mean(s²)) → current_db</text>
    <text x="834" y="343" class="body">　 gain_db = −30 − current_db → gain_comp = 10^(db/20)</text>
    <text x="834" y="363" class="body">3b SPL 增益：spl_to_gain(api_id, target_spl) → gain_linear</text>
    <text x="834" y="378" class="note">　 有 mapping 用映射；无 api_id 退 _linear_approx(target_spl)</text>
    <text x="834" y="398" class="note" fill="#92400e">示例 BASE = 65dB：65→1.0 ｜ 55→0.316 ｜ 45→0.1</text>
    <text x="834" y="412" class="note" fill="#92400e">相对能量比 speaker : interferer : noise = 1 : 0.3 : 0.1</text>

    <rect x="44" y="442" width="382" height="140" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="44" y="442" width="382" height="24" rx="8" fill="#3b82f6"/>
    <rect x="44" y="456" width="382" height="10" fill="#3b82f6"/>
    <text x="60" y="459" font-size="11.5" font-weight="700" fill="#ffffff">Step 4 · 时间轴编排（speaker 感知交叠）</text>
    <text x="60" y="486" class="body">calculate_speaker_aware_audio_delays(audios_config)</text>
    <text x="60" y="503" class="note">→ timeline = [{1, 0ms → 3000ms}, {2, 2000ms → 4500ms}]</text>
    <text x="60" y="523" class="body">噪声不参与时间轴计算（单独按 loop / delay 混入）</text>
    <text x="60" y="543" class="body">total_samples = 16000 × max_end_ms / 1000</text>
    <text x="60" y="560" class="note" fill="#c2410c">mix_buffer = np.zeros(total_samples, float32)</text>

    <rect x="438" y="442" width="368" height="140" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="438" y="442" width="368" height="24" rx="8" fill="#3b82f6"/>
    <rect x="438" y="456" width="368" height="10" fill="#3b82f6"/>
    <text x="454" y="459" font-size="11.5" font-weight="700" fill="#ffffff">Step 5 · 混音叠加（float32 缓冲）</text>
    <text x="454" y="486" class="body">samples int16 → float32（已统一格式）→ *= gain_linear</text>
    <text x="454" y="503" class="note">noise 且 loop=True → 铺满整个混音缓冲（循环拷贝）</text>
    <text x="454" y="523" class="body">其他源 → start_sample = 16000 × start_ms / 1000</text>
    <text x="454" y="538" class="body">　 mix_buffer[start:end] += samples</text>
    <text x="454" y="558" class="note" fill="#1e3a8a">最终 mix_buffer = Σ(各源 × gain)　·　立体声按 interleaved 帧对齐</text>

    <rect x="818" y="442" width="378" height="140" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="818" y="442" width="378" height="24" rx="8" fill="#16a34a"/>
    <rect x="818" y="456" width="378" height="10" fill="#16a34a"/>
    <text x="834" y="459" font-size="11.5" font-weight="700" fill="#ffffff">Step 6 · 切片输出 base64 chunk</text>
    <text x="834" y="486" class="body">mix_buffer → np.clip(±满量程) → int16 量化</text>
    <text x="834" y="503" class="note">chunk_samples = 16000 × 100ms / 1000 = 1600 → 3200 bytes</text>
    <text x="834" y="523" class="body">[0:1600] → AudioChunk(seq=0) · [1600:3200] → seq=1 · …</text>
    <text x="834" y="540" class="body">[-1600:] → AudioChunk(seq=N, last=True)　不足补零</text>
    <text x="834" y="560" class="note" fill="#166534">防削波按目标位深满量程 clip　→　gRPC stream [AudioChunk]</text>
  </g>
  <line x1="426" y1="352" x2="436" y2="352" class="flow"/>
  <line x1="806" y1="352" x2="816" y2="352" class="flow"/>
  <path class="flow" d="M1007,422 V432 H235 V440"/>
  <line x1="426" y1="512" x2="436" y2="512" class="flow"/>
  <line x1="806" y1="512" x2="816" y2="512" class="flow"/>
  <text x="46" y="606" class="note">噪声合并优先级：轮次级 background_noise &gt; case 级全局 background_noise（跨所有轮次）· 主讲人 / 干扰人 / 噪声三路一次混成，不再单独推送噪声流</text>

  <!-- ③ 消费方式 -->
  <rect x="24" y="626" width="1192" height="96" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="626" width="1192" height="38" rx="10" fill="#ede9fe"/>
  <rect x="24" y="652" width="1192" height="12" fill="#ede9fe"/>
  <circle cx="46" cy="645" r="11" fill="#7c3aed"/>
  <text x="46" y="649" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="66" y="650" class="sec-title" fill="#4c1d95">同一混音产物的三种消费方式（差别只在出口，不在编排）</text>
  <rect x="44" y="668" width="380" height="42" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="60" y="686" font-size="11" font-weight="700" fill="#5b21b6">WebSocket API（Realtime）</text>
  <text x="60" y="702" class="note">for chunk → adapter.send(chunk) + sleep → input_audio_buffer.append</text>
  <rect x="438" y="668" width="380" height="42" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="454" y="686" font-size="11" font-weight="700" fill="#5b21b6">HTTP API（流式 SSE）</text>
  <text x="454" y="702" class="note">for chunk → SSE 推送（HttpStreamAdapter）· 事件驱动检测 AI 说话</text>
  <rect x="832" y="668" width="364" height="42" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="848" y="686" font-size="11" font-weight="700" fill="#5b21b6">HTTP API（非实时）</text>
  <text x="848" y="702" class="note">RenderAudioFile（新增）整文件返回 → 一次性 POST（文件级）</text>

  <!-- ④ SPL 决策 -->
  <rect x="24" y="742" width="1192" height="196" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="742" width="1192" height="38" rx="10" fill="#ffedd5"/>
  <rect x="24" y="768" width="1192" height="12" fill="#ffedd5"/>
  <circle cx="46" cy="761" r="11" fill="#f59e0b"/>
  <text x="46" y="765" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="66" y="766" class="sec-title" fill="#9a3412">SPL 处理三分支 — 目标声压级（dB SPL）→ 数字增益 → 作用于 RMS（音频导入阶段不涉及 SPL，Audio 表无 SPL 字段）</text>

  <rect x="44" y="816" width="100" height="44" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="94" y="834" class="chip-t" fill="#9a3412">case_config</text>
  <text x="94" y="849" class="chip-t" fill="#64748b">round.audios</text>
  <polygon points="204,838 320,800 436,838 320,876" fill="#fefce8" stroke="#ca8a04" stroke-width="1.4"/>
  <text x="320" y="833" font-size="10.5" font-weight="600" fill="#854d0e" text-anchor="middle">round.audios[].spl</text>
  <text x="320" y="848" font-size="10.5" font-weight="600" fill="#854d0e" text-anchor="middle">是否配置？</text>
  <path class="flow" d="M436,838 H456 V817 H472"/>
  <text x="446" y="834" class="chip-t" fill="#64748b" text-anchor="start">否</text>
  <rect x="474" y="796" width="356" height="42" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="490" y="814" font-size="11" font-weight="700" fill="#9a3412">否 → gain = 1.0</text>
  <text x="490" y="830" class="note">原始 RMS 不变，直接切 chunk 推送（格式适配仍执行）</text>
  <path class="flow" d="M370,861 H470"/>
  <text x="384" y="874" class="chip-t" fill="#16a34a" text-anchor="start">是</text>
  <rect x="474" y="846" width="722" height="42" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="490" y="864" font-size="11" font-weight="700" fill="#9a3412">是 → 查 SPL 映射（按 task_case_relations.device_type 分支，废弃 task.type）</text>
  <text x="490" y="880" class="note">gain × 原始 RMS = 目标声压 → 混音 → chunk　·　映射未命中 / 无 api_id → 线性近似 _linear_approx(target_spl)</text>
  <line x1="150" y1="838" x2="200" y2="838" class="flow"/>

  <rect x="44" y="900" width="560" height="30" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="324" y="920" class="chip-t" fill="#3730a3">physical → SPLMappingService.spl_to_gain(mapping_id, target_spl) · DB 查 SPLMapping（物理校准）</text>
  <rect x="616" y="900" width="580" height="30" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="906" y="920" class="chip-t" fill="#065f46">http_api / websocket_api → ApiRmsSplService.spl_to_gain(api_id, spl) · api_rms_spl_mappings 多点插值（数字校准，新增）</text>

  <!-- ⑤ 对称设计 -->
  <rect x="24" y="954" width="1192" height="212" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="954" width="1192" height="38" rx="10" fill="#e2e8f0"/>
  <rect x="24" y="980" width="1192" height="12" fill="#e2e8f0"/>
  <circle cx="46" cy="973" r="11" fill="#64748b"/>
  <text x="46" y="977" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="66" y="978" class="sec-title" fill="#1e293b">E2E（物理）与 API 类（数字）对称设计 — 两套 SPL 映射并存，语义对称、落位分离</text>

  <g>
    <text x="60" y="1014" class="body" font-weight="700" fill="#334155">维度</text>
    <text x="240" y="1014" class="body" font-weight="700" fill="#3730a3">E2E · audio_driver + spl_service</text>
    <text x="660" y="1014" class="body" font-weight="700" fill="#065f46">API 类 · AudioStreamOrchestrator + ApiRmsSplService</text>
    <line x1="44" y1="1022" x2="1216" y2="1022" stroke="#cbd5e1"/>
    <g class="note" fill="#475569">
      <text x="60" y="1040">混音时机</text><text x="240" y="1040">实时（PyAudio callback 内逐帧 += 叠加）</text><text x="660" y="1040">离线（audio_service 内一次性混音完成）</text>
      <text x="60" y="1060">格式适配</text><text x="240" y="1060">声卡格式由 PyAudio 自动处理</text><text x="660" y="1060">AudioFormatAdapter → api.audio_config（重采样 / 位深 / 通道）</text>
      <text x="60" y="1080">RMS 补偿</text><text x="240" y="1080">calculate_gain_compensation（file → dBFS → gain）</text><text x="660" y="1080">_rms_compensate（bytes → numpy → dBFS → gain）</text>
      <text x="60" y="1100">SPL 关联</text><text x="240" y="1100">PlaybackDevice 1:N SPLMapping（device_service）</text><text x="660" y="1100">API 1:N ApiRmsSplMapping（api_test_service，新增）</text>
      <text x="60" y="1120">校准方式</text><text x="240" y="1120">物理校准：播放测试音 + 实测 SPL</text><text x="660" y="1120">数字校准：发送已知 RMS + 评估识别效果</text>
      <text x="60" y="1140" fill="#b91c1c">校准互斥</text><text x="240" y="1140">单实例依赖 DB 状态（行锁自然串行）</text><text x="660" y="1140" fill="#b91c1c">Redis DistributedLock（多实例必需，新增维度）</text>
      <text x="60" y="1160">增益链路</text><text x="240" y="1160">effective = audio_gain × GLOBAL_SAFE_GAIN × gain_comp</text><text x="660" y="1160">effective = spl_gain × rms_compensate</text>
    </g>
  </g>

  <line x1="0" y1="1180" x2="1240" y2="1180" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="1200" font-size="10.5" fill="#64748b">依据：08_混音与SPL映射.md §一 跨服务全景 · §二 格式适配层 · §四 噪声合并优先级 · §五 混音 6 步 · §六 SPL 对称设计 · §七 executor 调用；01_UseCase总览.md §0.7</text>
</svg>
