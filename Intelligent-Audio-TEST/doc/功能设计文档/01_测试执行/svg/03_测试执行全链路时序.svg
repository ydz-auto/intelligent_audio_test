<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1300" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sec-title { font-size: 14px; font-weight: 700; }
      .flow { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-red { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowRed); }
      .flow-violet { stroke: #7c3aed; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowViolet); }
      .box-name { font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .box-desc { font-size: 10px; fill: #64748b; }
      .note { font-size: 9.5px; fill: #64748b; }
      .body { font-size: 10.5px; fill: #334155; }
      .pill-t { font-size: 10px; font-weight: 600; text-anchor: middle; }
      .chip-t { font-size: 9.5px; text-anchor: middle; }
      .ms { font-size: 9.5px; fill: #334155; }
      .life { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 4; }
      .fr { fill: none; stroke: #94a3b8; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="1300" fill="#f1f5f9"/>

  <text x="24" y="44" font-size="21" font-weight="700" fill="#0f172a">测试执行 · 全链路时序图（创建 → 调度 → 分发 → 执行 → 评估 → 事件回推）</text>
  <text x="24" y="68" font-size="12" fill="#64748b">participant = 微服务实例 · 实线 = 同步 gRPC（proto + ACL 仓储）· 紫色虚线 = Redis 事件链路 · 阶段间解耦全部经 Redis，不引入 MQ</text>

  <!-- ① 时序主图 -->
  <rect x="24" y="92" width="1192" height="726" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="92" width="1192" height="38" rx="10" fill="#e2e8f0"/>
  <rect x="24" y="118" width="1192" height="12" fill="#e2e8f0"/>
  <circle cx="46" cy="111" r="11" fill="#64748b"/>
  <text x="46" y="115" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="66" y="116" class="sec-title" fill="#1e293b">全链路时序 — 对应 02_架构设计.md §4.1（含 alt 分支与 loop 观测链路）</text>

  <!-- participants -->
  <g>
    <rect x="48" y="140" width="136" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="116" y="158" class="box-name" text-anchor="middle" font-size="11">前端 Vue3</text>
    <text x="116" y="174" class="chip-t" fill="#64748b">taskChannel.ts</text>
    <rect x="194" y="140" width="136" height="42" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="262" y="158" class="box-name" text-anchor="middle" font-size="11">api_gateway</text>
    <text x="262" y="174" class="chip-t" fill="#64748b">:5000</text>
    <rect x="340" y="140" width="136" height="42" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="408" y="158" class="box-name" text-anchor="middle" font-size="11">task_service</text>
    <text x="408" y="174" class="chip-t" fill="#64748b">:5001 / 50061</text>
    <rect x="486" y="140" width="136" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="554" y="158" class="box-name" text-anchor="middle" font-size="11">Redis</text>
    <text x="554" y="174" class="chip-t" fill="#64748b">task:queue · EventBus</text>
    <rect x="632" y="140" width="136" height="42" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text x="700" y="158" class="box-name" text-anchor="middle" font-size="11">api_test_service</text>
    <text x="700" y="174" class="chip-t" fill="#64748b">:5003 ×2（replicas）</text>
    <rect x="778" y="140" width="136" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="846" y="158" class="box-name" text-anchor="middle" font-size="11">e2e_test_service</text>
    <text x="846" y="174" class="chip-t" fill="#64748b">:5002 / 50051</text>
    <rect x="924" y="140" width="136" height="42" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="992" y="158" class="box-name" text-anchor="middle" font-size="11">evaluation_service</text>
    <text x="992" y="174" class="chip-t" fill="#64748b">:5004 / 50091</text>
    <rect x="1070" y="140" width="136" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <text x="1138" y="158" class="box-name" text-anchor="middle" font-size="11">report_service</text>
    <text x="1138" y="174" class="chip-t" fill="#64748b">:5006</text>
  </g>
  <g class="life">
    <line x1="116" y1="182" x2="116" y2="800"/><line x1="262" y1="182" x2="262" y2="800"/><line x1="408" y1="182" x2="408" y2="800"/>
    <line x1="554" y1="182" x2="554" y2="800"/><line x1="700" y1="182" x2="700" y2="800"/><line x1="846" y1="182" x2="846" y2="800"/>
    <line x1="992" y1="182" x2="992" y2="800"/><line x1="1138" y1="182" x2="1138" y2="800"/>
  </g>

  <!-- messages -->
  <line x1="116" y1="208" x2="262" y2="208" class="flow"/>
  <text x="124" y="204" class="ms">1  POST /api/tasks 创建任务（选关联用例 + 被测设备 → 写 device_type）</text>
  <line x1="116" y1="236" x2="262" y2="236" class="flow"/>
  <text x="124" y="232" class="ms">2  POST /api/tasks/{id}/start 启动</text>
  <line x1="262" y1="264" x2="408" y2="264" class="flow"/>
  <text x="270" y="260" class="ms">3  gRPC CreateTask / StartTask（grpc_proxies → ACL）</text>

  <rect x="414" y="274" width="240" height="46" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="422" y="291" class="chip-t" fill="#92400e" text-anchor="start">4  Command Handler 落库 · TaskCreated</text>
  <text x="422" y="308" class="chip-t" fill="#64748b" text-anchor="start">worker_instance_id = NULL · 状态 PENDING</text>

  <line x1="408" y1="326" x2="554" y2="326" class="flow"/>
  <text x="416" y="322" class="ms">5  LPUSH task:queue（事件驱动入队）</text>
  <rect x="336" y="338" width="286" height="30" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="346" y="351" class="chip-t" fill="#854d0e" text-anchor="start">Note · SchedulerMixin._scheduler_loop（多实例竞争）</text>
  <text x="346" y="363" class="chip-t" fill="#854d0e" text-anchor="start">BRPOP 5s 超时 → _schedule_pending_tasks DB 兜底</text>
  <line x1="554" y1="386" x2="408" y2="386" class="flow"/>
  <text x="416" y="382" class="ms">6  BRPOP 返回 task_id → 归属校验 / 记名 worker_instance_id</text>
  <rect x="414" y="394" width="240" height="28" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="422" y="413" class="chip-t" fill="#92400e" text-anchor="start">7  _claim_case 原子占位（行数 ≠ 1 → 跳过）</text>

  <!-- alt -->
  <rect class="fr" x="106" y="434" width="800" height="166" rx="6"/>
  <rect x="106" y="434" width="252" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="116" y="448" class="chip-t" fill="#047857" text-anchor="start" font-weight="700">alt · [device_type = physical]</text>
  <line x1="408" y1="468" x2="846" y2="468" class="flow"/>
  <text x="416" y="464" class="ms">8a  gRPC StartE2ETask（:50051）→ ExecutionService</text>
  <rect x="756" y="478" width="150" height="34" rx="6" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="764" y="492" class="chip-t" fill="#3730a3" text-anchor="start">8b  BaseExecutor 五 mixin</text>
  <text x="764" y="505" class="chip-t" fill="#64748b" text-anchor="start">协同 audio / device</text>
  <line x1="106" y1="522" x2="906" y2="522" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="206" y="538" class="chip-t" fill="#047857" text-anchor="start" font-weight="700">[device_type = http_api / websocket_api]</text>
  <line x1="408" y1="560" x2="700" y2="560" class="flow"/>
  <text x="416" y="556" class="ms">9a  gRPC CreateAPITest / StartAPITest（+ device_type 新增字段）</text>
  <rect x="638" y="570" width="192" height="26" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="646" y="587" class="chip-t" fill="#065f46" text-anchor="start">9b  实例内闭环执行 · 负载均衡分配 worker</text>

  <line x1="700" y1="622" x2="992" y2="622" class="flow"/>
  <text x="708" y="618" class="ms">10  submit_evaluate_case → gRPC EvaluateCase（:50091）</text>
  <line x1="846" y1="652" x2="992" y2="652" class="flow"/>
  <text x="854" y="648" class="ms">11  submit_evaluate_case（physical 结果 · 不进程内等待）</text>
  <line x1="992" y1="682" x2="1138" y2="682" class="flow"/>
  <text x="1000" y="678" class="ms">12  评估完成 → 报告生成（REPORT_EVENTS）</text>
  <line x1="408" y1="712" x2="554" y2="712" class="flow"/>
  <text x="416" y="708" class="ms">13  EventBus.publish（CASE_EVENTS / TASK_EVENTS）</text>

  <rect class="fr" x="106" y="726" width="520" height="72" rx="6"/>
  <rect x="106" y="726" width="392" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="116" y="740" class="chip-t" fill="#334155" text-anchor="start" font-weight="700">loop 观测链路 · 执行全程持续（控制面与数据面分离）</text>
  <line x1="554" y1="762" x2="262" y2="762" class="flow-violet"/>
  <text x="270" y="758" class="ms" fill="#7c3aed">14  _start_redis_subscriber 订阅 task_logs / task_progress</text>
  <line x1="262" y1="790" x2="116" y2="790" class="flow-violet"/>
  <text x="124" y="786" class="ms" fill="#7c3aed">15  Socket.IO：task_progress → '/'　·　task_log → '/ws/logs'（room = task:{id}）</text>

  <!-- ② 阶段职责 -->
  <rect x="24" y="834" width="1192" height="272" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="834" width="1192" height="38" rx="10" fill="#dbeafe"/>
  <rect x="24" y="860" width="1192" height="12" fill="#dbeafe"/>
  <circle cx="46" cy="853" r="11" fill="#3b82f6"/>
  <text x="46" y="857" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="66" y="858" class="sec-title" fill="#1e3a8a">各阶段职责划分（02 §4.2）— 谁负责什么、关键组件、关键约束</text>

  <g>
    <text x="60" y="892" class="body" font-weight="700" fill="#334155">阶段</text>
    <text x="140" y="892" class="body" font-weight="700" fill="#334155">责任服务</text>
    <text x="356" y="892" class="body" font-weight="700" fill="#334155">关键组件</text>
    <text x="736" y="892" class="body" font-weight="700" fill="#334155">关键约束</text>
    <line x1="44" y1="900" x2="1216" y2="900" stroke="#93c5fd"/>
    <g class="note" fill="#475569">
      <text x="60" y="918">创建</text><text x="140" y="918">api_gateway → task_service</text><text x="356" y="918">task_command_service → application/commands + handlers</text><text x="736" y="918">Command 只写；TaskCreated 经 EventBus 广播</text>
      <text x="60" y="938">启动</text><text x="140" y="938">task_service</text><text x="356" y="938">LPUSH task:queue</text><text x="736" y="938">归属 worker_instance_id = NULL，待调度认领</text>
      <text x="60" y="958">调度</text><text x="140" y="958">task_service</text><text x="356" y="958">mixins/scheduler.py（BRPOP + DB 兜底 + _claim_case）</text><text x="736" y="958">E2E 互斥 running_e2e · API 互斥 running_apis（进程内）</text>
      <text x="60" y="978">分发</text><text x="140" y="978">task_service</text><text x="356" y="978">mixins/task_dispatch.py _dispatch_case_by_type</text><text x="736" y="978">按 TaskCase.device_type 路由（P0 改造点）</text>
      <text x="60" y="998">执行</text><text x="140" y="998">api_test / e2e_test_service</text><text x="356" y="998">APITestService（池 8）/ ExecutionService · BaseExecutor</text><text x="736" y="998">Realtime 实例内闭环 · APIConcurrencyManager 控并发</text>
      <text x="60" y="1018">评估</text><text x="140" y="1018">evaluation_service</text><text x="356" y="1018">EvaluateCase / Reevaluate 系列</text><text x="736" y="1018">执行器统一经 submit_evaluate_case 调用</text>
      <text x="60" y="1038">报告</text><text x="140" y="1038">report_service</text><text x="356" y="1038">评估完成事件触发</text><text x="736" y="1038">REPORT_EVENTS 频道广播</text>
      <text x="60" y="1058">回推</text><text x="140" y="1058">api_gateway</text><text x="356" y="1058">_start_redis_subscriber → emit_sync / broadcast_log_sync</text><text x="736" y="1058">'/' 推进度 · '/ws/logs' 推日志（sid 过滤 + task 房间）</text>
    </g>
    <text x="60" y="1082" class="note" fill="#92400e">评估入参：answer + latency（非实时）｜ + first_frame_ms（流式）｜ user_wav + ai_wav + first_frame_ms + event_log（E2E / Realtime）</text>
  </g>

  <!-- ③ 异常路径 -->
  <rect x="24" y="1122" width="1192" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="1122" width="1192" height="38" rx="10" fill="#fee2e2"/>
  <rect x="24" y="1148" width="1192" height="12" fill="#fee2e2"/>
  <circle cx="46" cy="1141" r="11" fill="#dc2626"/>
  <text x="46" y="1145" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="66" y="1146" class="sec-title" fill="#7f1d1d">关键分支与异常路径 — 单用例失败不阻断任务主循环</text>
  <text x="46" y="1174" class="body">· 调度异常：BRPOP 5s 无消息 → DB 兜底扫描 pending；_claim_case 影响行数 ≠ 1（被他实例抢占）→ 静默跳过，不重复执行</text>
  <text x="46" y="1192" class="body">· 执行异常：gRPC CreateAPITest 失败 / worker 抛异常 → TaskCase 置 FAILED + error_message，经 EventBus _emit_alert 告知前端</text>
  <text x="46" y="1210" class="body">· 评估解耦：提交后即发布 CASE_EXECUTION_COMPLETED，task_service 订阅消费更新终态；评估失败不影响执行结果落库</text>
  <text x="46" y="1228" class="body" fill="#b91c1c">· 实例崩溃：心跳 TTL 15s 过期 → _adopt_orphan_tasks 收养，中间态用例回退 PENDING 重新入队（Realtime 会话重建 = 有损恢复）</text>
  <text x="46" y="1244" class="note">禁止：跨实例共享 WS 连接池（破坏单写者原则）· 会话状态全量塞 Redis 每帧同步（高频音频流变热点）</text>

  <line x1="0" y1="1268" x2="1240" y2="1268" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="1288" font-size="10.5" fill="#64748b">依据：02_架构设计.md §4.1 全链路时序 · §4.2 阶段职责划分 · §5.2 Realtime 实例内闭环 · §5.4 孤儿收养；03_流程图.md §2.1 API 测试任务全链路</text>
</svg>
