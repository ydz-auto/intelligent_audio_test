<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1400" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sec-title { font-size: 14px; font-weight: 700; }
      .flow { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-blue { stroke: #2563eb; stroke-width: 1.6; fill: none; marker-end: url(#arrowBlue); }
      .flow-red { stroke: #dc2626; stroke-width: 1.6; fill: none; marker-end: url(#arrowRed); }
      .flow-amber { stroke: #f59e0b; stroke-width: 1.6; fill: none; marker-end: url(#arrowAmber); }
      .flow-green { stroke: #16a34a; stroke-width: 1.6; fill: none; marker-end: url(#arrowGreen); }
      .flow-red-d { stroke: #dc2626; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrowRed); }
      .flow-amber-d { stroke: #f59e0b; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrowAmber); }
      .flow-green-d { stroke: #16a34a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrowGreen); }
      .box-name { font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .box-desc { font-size: 10px; fill: #64748b; }
      .note { font-size: 9.5px; fill: #64748b; }
      .body { font-size: 10.5px; fill: #334155; }
      .chip-t { font-size: 9.5px; text-anchor: middle; }
      .lbl { font-size: 9.5px; font-weight: 600; }
      .num-badge { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .decision-t { font-size: 12px; font-weight: 600; fill: #854d0e; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="1400" fill="#f1f5f9"/>

  <text x="620" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">轮次状态机 (Realtime)</text>
  <text x="620" y="66" text-anchor="middle" font-size="12" fill="#64748b">IDLE → 正常轮 / 打断轮 → AI_THINKING → AI_SPEAKING → AI_DONE → round_result → 下一轮 IDLE</text>

  <!-- ① 状态机主图 -->
  <rect x="24" y="88" width="1192" height="920" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="88" width="1192" height="38" rx="10" fill="#e2e8f0"/>
  <rect x="24" y="114" width="1192" height="12" fill="#e2e8f0"/>
  <circle cx="46" cy="107" r="11" fill="#64748b"/>
  <text x="46" y="111" class="num-badge">1</text>
  <text x="66" y="112" class="sec-title" fill="#334155">轮次状态机 — 正常轮路径 (左) + 打断轮路径 (右)</text>

  <!-- IDLE -->
  <ellipse cx="620" cy="160" rx="80" ry="32" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="620" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">IDLE</text>
  <text x="620" y="175" text-anchor="middle" class="note">等待下一轮</text>

  <!-- Decision -->
  <path d="M 620 192 L 620 210" class="flow"/>
  <polygon points="620,210 780,265 620,320 460,265" fill="#fefce8" stroke="#ca8a04" stroke-width="1.6" filter="url(#softShadow)"/>
  <text x="620" y="262" class="decision-t">is_interruption?</text>
  <text x="620" y="280" text-anchor="middle" class="box-desc">轮次类型判断</text>

  <!-- Left branch: Normal -->
  <path d="M 460 265 L 250 265 L 250 320" class="flow-blue"/>
  <text x="355" y="257" text-anchor="middle" class="lbl" fill="#2563eb">False (正常轮)</text>

  <!-- Right branch: Barge-in -->
  <path d="M 780 265 L 990 265 L 990 320" class="flow-red"/>
  <text x="885" y="257" text-anchor="middle" class="lbl" fill="#dc2626">True (打断轮)</text>

  <!-- ===== Normal Round Path (Left) ===== -->
  <rect x="100" y="324" width="300" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="250" y="348" text-anchor="middle" class="box-name" fill="#1e40af">推送主讲人音频</text>
  <text x="250" y="364" text-anchor="middle" class="box-desc">send(chunk)×N → commit_input()</text>
  <path d="M 250 374 L 250 400" class="flow-blue"/>

  <rect x="100" y="404" width="300" height="50" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="250" y="428" text-anchor="middle" class="box-name" fill="#1e40af">AI_THINKING</text>
  <text x="250" y="444" text-anchor="middle" class="box-desc">commit 后等 AI 首帧响应</text>
  <path d="M 250 454 L 250 480" class="flow-blue"/>
  <text x="280" y="472" class="note">← audio.delta</text>

  <rect x="100" y="484" width="300" height="50" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="250" y="508" text-anchor="middle" class="box-name" fill="#1e40af">AI_SPEAKING</text>
  <text x="250" y="524" text-anchor="middle" class="box-desc">recv → audio.delta ×N (流式音频)</text>
  <path d="M 250 534 L 250 560" class="flow-blue"/>
  <text x="280" y="552" class="note">← audio.done</text>

  <rect x="100" y="564" width="300" height="50" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.4"/>
  <text x="250" y="588" text-anchor="middle" class="box-name" fill="#166534">AI_DONE</text>
  <text x="250" y="604" text-anchor="middle" class="box-desc">← response.audio.done</text>
  <path d="M 250 614 L 250 640" class="flow-green"/>

  <ellipse cx="250" cy="670" rx="120" ry="28" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>
  <text x="250" y="675" text-anchor="middle" class="chip-t" fill="#fff" font-weight="600">round_result → 下一轮 IDLE</text>

  <!-- ===== Barge-in Round Path (Right) ===== -->
  <rect x="840" y="324" width="300" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="990" y="348" text-anchor="middle" class="box-name" fill="#991b1b">等 AI 开始说话</text>
  <text x="990" y="364" text-anchor="middle" class="box-desc">recv → ai_audio_delta (阶段A)</text>
  <path d="M 990 374 L 990 400" class="flow-red"/>

  <rect x="840" y="404" width="300" height="50" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
  <text x="990" y="428" text-anchor="middle" class="box-name" fill="#92400e">延迟 interruption_delay_ms</text>
  <text x="990" y="444" text-anchor="middle" class="box-desc">AI 说了 N 毫秒 (如 1500ms)</text>
  <path d="M 990 454 L 990 480" class="flow-red"/>

  <rect x="840" y="484" width="300" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="990" y="508" text-anchor="middle" class="box-name" fill="#991b1b">推送打断音频</text>
  <text x="990" y="524" text-anchor="middle" class="box-desc">send(chunk)×N → commit_input()</text>
  <path d="M 990 534 L 990 560" class="flow-red"/>

  <!-- Barge-in detection diamond -->
  <polygon points="990,564 1140,614 990,664 840,614" fill="#fef0f0" stroke="#dc2626" stroke-width="1.6" filter="url(#softShadow)"/>
  <text x="990" y="610" class="decision-t" fill="#991b1b">检测 barge-in</text>
  <text x="990" y="628" text-anchor="middle" class="box-desc">(5s 事件窗口)</text>

  <!-- Two outcomes -->
  <path d="M 840 614 L 700 614" class="flow-red"/>
  <text x="770" y="606" text-anchor="middle" class="lbl" fill="#dc2626">Yes</text>
  <text x="770" y="596" text-anchor="middle" class="note" fill="#dc2626">speech_started</text>

  <path d="M 1140 614 L 1140 684" class="flow-amber-d"/>
  <text x="1170" y="650" class="lbl" fill="#f59e0b">No</text>
  <text x="1170" y="662" class="note" fill="#f59e0b">AI说完了</text>

  <!-- BARGE_IN detected -->
  <rect x="540" y="590" width="160" height="50" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
  <text x="620" y="612" text-anchor="middle" class="box-name" fill="#fff">BARGE_IN</text>
  <text x="620" y="628" text-anchor="middle" class="box-desc" fill="#fee2e2">AI 停止输出</text>
  <path d="M 620 640 L 620 666" class="flow-red"/>

  <!-- Wait AI re-reply -->
  <rect x="540" y="670" width="160" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="620" y="692" text-anchor="middle" class="box-name" fill="#991b1b">等 AI 重新回复</text>
  <text x="620" y="708" text-anchor="middle" class="box-desc">→ AI_SPEAKING</text>

  <!-- Arrow from "等 AI 重新回复" back to AI_SPEAKING (left side) -->
  <path d="M 540 690 Q 400 690 400 510" class="flow-red-d"/>
  <text x="430" y="640" text-anchor="middle" class="note" fill="#dc2626">AI 重新回复 → AI_SPEAKING → AI_DONE</text>

  <!-- Barge-in failed -->
  <rect x="1060" y="690" width="160" height="50" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.4" stroke-dasharray="4 2"/>
  <text x="1140" y="712" text-anchor="middle" class="box-name" fill="#92400e">Barge-in 失败</text>
  <text x="1140" y="728" text-anchor="middle" class="box-desc">AI 说完, 窗口已过</text>

  <!-- round_result (Barge-in success) -->
  <path d="M 620 720 L 620 760" class="flow-red"/>
  <ellipse cx="620" cy="790" rx="140" ry="28" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
  <text x="620" y="795" text-anchor="middle" class="chip-t" fill="#fff" font-weight="600">round_result (barge_in=True) → IDLE</text>

  <!-- round_result (Barge-in failed) -->
  <path d="M 1140 740 L 1140 760" class="flow-amber"/>
  <ellipse cx="1140" cy="790" rx="140" ry="28" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="1140" y="795" text-anchor="middle" class="chip-t" fill="#fff" font-weight="600">round_result (barge_in=False) → IDLE</text>

  <!-- Return arrows to IDLE -->
  <path d="M 250 698 Q 250 160 540 160" class="flow-green-d"/>
  <path d="M 620 818 Q 620 160 700 160" class="flow-red-d"/>
  <path d="M 1140 818 Q 1140 160 700 160" class="flow-amber-d"/>

  <!-- ===== Exception Paths ===== -->
  <rect x="48" y="840" width="1144" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="620" y="864" text-anchor="middle" class="box-name" fill="#dc2626">异常路径 (任意状态均可触发)</text>

  <rect x="68" y="880" width="260" height="28" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="198" y="898" text-anchor="middle" class="chip-t" fill="#dc2626">connection_closed → round_result(success=False)</text>
  <rect x="348" y="880" width="240" height="28" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="468" y="898" text-anchor="middle" class="chip-t" fill="#dc2626">timeout → round_result(success=False)</text>
  <rect x="608" y="880" width="240" height="28" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="728" y="898" text-anchor="middle" class="chip-t" fill="#dc2626">error event → round_result(success=False)</text>
  <rect x="868" y="880" width="300" height="28" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="1018" y="898" text-anchor="middle" class="chip-t" fill="#dc2626">任意异常: 记录已收集结果 → round_result(success=False)</text>

  <text x="48" y="930" class="body">executor 只管调 adapter.post_process(is_interruption=...), 不关心检测细节</text>
  <text x="48" y="950" class="note">检测手段: 事件驱动 (Realtime) vs RMS 轮询 (E2E) · 精度: 毫秒级 (事件时间戳) · 延迟: 低 (事件即时推送) · 抗干扰: 强 (API 事件是权威信号)</text>

  <!-- Legend -->
  <rect x="48" y="972" width="1144" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="68" y="978" width="16" height="16" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="92" y="990" class="note">正常轮路径</text>
  <rect x="220" y="978" width="16" height="16" rx="3" fill="#fee2e2" stroke="#dc2626"/>
  <text x="244" y="990" class="note">打断轮路径</text>
  <rect x="380" y="978" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="404" y="990" class="note">完成状态</text>
  <rect x="530" y="978" width="16" height="16" rx="3" fill="#fefce8" stroke="#ca8a04"/>
  <text x="554" y="990" class="note">决策点</text>
  <rect x="660" y="978" width="16" height="16" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2"/>
  <text x="684" y="990" class="note">异常路径</text>
  <rect x="810" y="978" width="16" height="16" rx="3" fill="#ffffff" stroke="#fcd34d" stroke-dasharray="3 2"/>
  <text x="834" y="990" class="note">失败路径</text>

  <!-- ② 检测方式对比 -->
  <rect x="24" y="1028" width="1192" height="170" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="1028" width="1192" height="38" rx="10" fill="#dbeafe"/>
  <rect x="24" y="1054" width="1192" height="12" fill="#dbeafe"/>
  <circle cx="46" cy="1047" r="11" fill="#3b82f6"/>
  <text x="46" y="1051" class="num-badge">2</text>
  <text x="66" y="1052" class="sec-title" fill="#1e3a8a">E2E vs Realtime 检测方式对称映射</text>

  <line x1="48" y1="1084" x2="1192" y2="1084" stroke="#e2e8f0" stroke-width="1"/>
  <text x="68" y="1102" class="lbl" fill="#475569">生命周期 / 操作</text>
  <text x="360" y="1102" class="lbl" fill="#475569">E2E device_driver</text>
  <text x="780" y="1102" class="lbl" fill="#475569">Realtime api_adapter</text>
  <line x1="48" y1="1110" x2="1192" y2="1110" stroke="#e2e8f0" stroke-width="1"/>
  <text x="68" y="1128" class="body">AI 说话检测</text>
  <text x="360" y="1128" class="body">_wait_ai_reply_start_via_pcm() — RMS 轮询</text>
  <text x="780" y="1128" class="body">_wait_ai_speaking() — recv() 等 ai_audio_delta</text>
  <text x="68" y="1148" class="body">AI 说完检测</text>
  <text x="360" y="1148" class="body">_wait_ai_reply_end_via_pcm() — 双阶段 RMS</text>
  <text x="780" y="1148" class="body">_wait_ai_complete() — 等 ai_audio_done</text>
  <text x="68" y="1168" class="body">首帧时延</text>
  <text x="360" y="1168" class="body">_detect_ai_pcm_first_frame() — PCM size 增长</text>
  <text x="780" y="1168" class="body">commit → 第一个 ai_audio_delta 时间戳</text>
  <text x="68" y="1188" class="body">barge-in 轮</text>
  <text x="360" y="1188" class="body">只等 AI 开始(阶段A) → 跳过等说完 → 收尾</text>
  <text x="780" y="1188" class="body">_wait_ai_speaking() → 推打断音频 → 检测 speech_started</text>

  <text x="620" y="1216" text-anchor="middle" class="note" font-style="italic">核心洞察: 两者完全对称, 差异仅在检测手段 — 事件驱动 (Realtime) vs RMS 轮询 (E2E) · executor 不关心检测细节</text>

  <!-- Footnote -->
  <text x="620" y="1360" text-anchor="middle" class="note">Realtime 轮次状态机 · adapter.post_process(is_interruption=...) 驱动 · v3.0</text>
</svg>