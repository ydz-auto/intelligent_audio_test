<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1600" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .phase-title { font-size: 15px; font-weight: 700; }
      .phase-sub   { font-size: 11px; fill: #64748b; }
      .step-name   { font-size: 13px; font-weight: 600; fill: #1e293b; }
      .step-name-s { font-size: 12.5px; font-weight: 600; fill: #1e293b; }
      .step-desc   { font-size: 10.5px; fill: #64748b; }
      .note        { font-size: 10.5px; fill: #64748b; }
      .body        { font-size: 11px; fill: #334155; }
      .num-badge   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .flow        { stroke: #94a3b8; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-blue   { stroke: #2563eb; stroke-width: 1.6; fill: none; marker-end: url(#arrowBlue); }
      .flow-green  { stroke: #16a34a; stroke-width: 1.6; fill: none; marker-end: url(#arrowGreen); }
      .flow-red    { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#arrowRed); }
      .flow-red-d  { stroke: #dc2626; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3; marker-end: url(#arrowRed); }
      .decision    { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.4; }
      .decision-t  { font-size: 12px; font-weight: 600; fill: #854d0e; text-anchor: middle; }
      .label       { font-size: 10px; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <!-- ===================== 背景 ===================== -->
  <rect x="0" y="0" width="1240" height="1600" fill="#f1f5f9"/>

  <!-- ===================== 标题区 ===================== -->
  <text x="620" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">整体评估流程（当前实现）</text>
  <text x="620" y="66" text-anchor="middle" class="phase-sub">E2E 多轮用例 · 逐轮评估 → 整体评估 → 轮次聚合 → 分数回填 → 报告取值</text>

  <!-- ===================== ① 多轮执行完成 · 前置判定 ===================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="100" width="1160" height="130" rx="12" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
    <rect x="40" y="100" width="6" height="130" rx="3" fill="#4f46e5"/>
  </g>
  <text x="64" y="128" class="phase-title" fill="#4f46e5">① 多轮执行完成 · 前置判定</text>
  <text x="288" y="128" class="phase-sub">E2EExecutor._finalize_rounds()</text>

  <rect x="70" y="142" width="520" height="74" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="90" y="164" class="step-name-s">构建 algo_result</text>
  <text x="90" y="182" class="step-desc">algo_result = { test_type: e2e, rounds: [轮0 … 轮N], aggregated: {...} }</text>
  <text x="90" y="199" class="step-desc">每轮 rounds[i] = { round, output, latency, evaluation: {} }</text>

  <rect x="640" y="142" width="260" height="74" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="660" y="164" class="step-name-s">判定 · _has_round_dims</text>
  <text x="660" y="182" class="step-desc">rounds[i].evaluation.dimensions 非空</text>
  <text x="660" y="199" class="step-desc">→ 需逐轮评估 + 轮次聚合</text>

  <rect x="930" y="142" width="250" height="74" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="950" y="164" class="step-name-s">判定 · _has_overall_dims</text>
  <text x="950" y="182" class="step-desc">config.dimensions 非空</text>
  <text x="950" y="199" class="step-desc">→ 提交整体评估 round_number=None</text>

  <!-- 连接：① → ② -->
  <line x1="620" y1="230" x2="620" y2="258" class="flow"/>

  <!-- ===================== ② 逐轮评估 · 每轮独立提交 ===================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="260" width="1160" height="180" rx="12" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="40" y="260" width="6" height="180" rx="3" fill="#d97706"/>
  </g>
  <text x="64" y="288" class="phase-title" fill="#d97706">② 逐轮评估 · 每轮独立提交</text>
  <text x="330" y="288" class="phase-sub">evaluate_case(round_number=0 … N-1) · 与整体评估相互独立</text>
  <rect x="1010" y="270" width="170" height="22" rx="11" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="1095" y="285" text-anchor="middle" font-size="10.5" font-weight="600" fill="#92400e">× N 轮 · 逐轮提交</text>

  <rect x="70" y="304" width="420" height="76" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="90" y="328" class="step-name-s">提交逐轮评估</text>
  <text x="90" y="348" class="step-desc">evaluate_case(round_number=round_idx)</text>
  <text x="90" y="366" class="step-desc">仅取 rounds[idx].evaluation.dimensions</text>

  <rect x="540" y="304" width="420" height="76" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="560" y="328" class="step-name-s">请求 → 评估服务</text>
  <text x="560" y="348" class="step-desc">{ rounds: [仅当前轮数据], dimensions: 本轮维度 }</text>
  <text x="560" y="366" class="step-desc">服务端返回本轮各维度分</text>

  <rect x="1000" y="304" width="180" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1090" y="330" text-anchor="middle" class="step-name-s">落库</text>
  <text x="1090" y="350" text-anchor="middle" class="step-desc">TestResultDimension</text>
  <text x="1090" y="366" text-anchor="middle" class="step-desc">(round_number=i)</text>

  <line x1="490" y1="342" x2="536" y2="342" class="flow"/>
  <line x1="960" y1="342" x2="996" y2="342" class="flow"/>

  <text x="70" y="418" class="note">逐轮评估在每轮执行完成后立即提交（不等所有轮次完成）· 评估服务只处理当前轮的数据</text>

  <!-- 连接：② → ③ -->
  <line x1="620" y1="440" x2="620" y2="468" class="flow"/>

  <!-- ===================== ③ 整体评估 · round_number=None ===================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="470" width="1160" height="210" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="40" y="470" width="6" height="210" rx="3" fill="#2563eb"/>
  </g>
  <text x="64" y="498" class="phase-title" fill="#2563eb">③ 整体评估 · round_number=None</text>
  <text x="370" y="498" class="phase-sub">仅当 _has_overall_dims（顶层 config.dimensions 非空）时提交</text>

  <path d="M 150 528 L 220 558 L 150 588 L 80 558 Z" class="decision"/>
  <text x="150" y="552" text-anchor="middle" class="decision-t" font-size="11">_has_overall</text>
  <text x="150" y="567" text-anchor="middle" class="decision-t" font-size="11">_dims?</text>

  <line x1="220" y1="558" x2="254" y2="558" class="flow-blue"/>

  <rect x="258" y="524" width="480" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="278" y="544" class="step-name-s">提交整体评估 · evaluate_case(round_number=None)</text>
  <text x="278" y="562" class="step-desc">payload: { rounds: [全量 N 轮数据], dimensions: [顶层维度] }</text>

  <rect x="780" y="524" width="380" height="52" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="800" y="544" class="step-name-s">评估服务：基于全量 N 轮数据</text>
  <text x="800" y="562" class="step-desc">只返回整体维度分（不返回各轮分）</text>

  <line x1="738" y1="550" x2="776" y2="550" class="flow-blue"/>

  <rect x="258" y="596" width="902" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="709" y="617" text-anchor="middle" class="step-name-s">落库 → TestResultDimension(round_number=None, score)</text>

  <line x1="150" y1="588" x2="150" y2="616" class="flow-red-d"/>
  <rect x="40" y="600" width="240" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="160" y="620" text-anchor="middle" class="step-name-s" fill="#991b1b">无顶层维度 → 跳过整体评估</text>
  <text x="160" y="638" text-anchor="middle" class="step-desc" fill="#b91c1c">仅走逐轮评估 + RoundAggregator 聚合</text>

  <text x="70" y="662" class="note">整体评估收到全量 N 轮数据，但只对顶层 config.dimensions 打分 · 各轮分数由逐轮评估（②）单独返回</text>

  <!-- 连接：③ → ④ -->
  <line x1="620" y1="680" x2="620" y2="708" class="flow"/>

  <!-- ===================== ④ 轮次聚合 · RoundAggregator ===================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="710" width="1160" height="250" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="40" y="710" width="6" height="250" rx="3" fill="#059669"/>
  </g>
  <text x="64" y="738" class="phase-title" fill="#059669">④ 轮次聚合 · RoundAggregator</text>
  <text x="330" y="738" class="phase-sub">aggregate_round_results(result_id) · 所有轮次评估完成后触发</text>

  <rect x="70" y="754" width="520" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="90" y="776" class="step-name-s">按维度分组 · 计算平均</text>
  <text x="90" y="796" class="step-desc">查询 round_number IS NOT NULL 记录 · 取 completed 轮次分数算术平均</text>

  <rect x="640" y="754" width="520" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="660" y="776" class="step-name-s">写 algorithm_result['aggregated']</text>
  <text x="660" y="796" class="step-desc">{ avg_{dim}: 平均分, round_count, completed_rounds }</text>

  <line x1="590" y1="784" x2="636" y2="784" class="flow-green"/>
  <path d="M 900 814 L 900 856 L 704 856" class="flow-green"/>

  <path d="M 620 828 L 700 856 L 620 884 L 540 856 Z" class="decision"/>
  <text x="620" y="851" text-anchor="middle" class="decision-t" font-size="11">TestResultDimension</text>
  <text x="620" y="866" text-anchor="middle" class="decision-t" font-size="11">(round_number=None) 已存在?</text>

  <line x1="700" y1="856" x2="726" y2="856" class="flow-green"/>
  <rect x="730" y="834" width="430" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="945" y="853" text-anchor="middle" class="step-name-s" fill="#991b1b">已有整体记录 → 不覆盖其分数</text>
  <text x="945" y="871" text-anchor="middle" class="step-desc" fill="#b91c1c">仅整体评估未产生分数时用算术平均兜底</text>

  <path d="M 620 884 L 620 906 L 104 906" class="flow-green"/>
  <rect x="100" y="898" width="480" height="46" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="340" y="917" text-anchor="middle" class="step-name-s" fill="#065f46">无整体记录 → 创建聚合记录</text>
  <text x="340" y="935" text-anchor="middle" class="step-desc" fill="#047857">round_number=None · score = 各轮算术平均</text>

  <!-- 连接：④ → ⑤ -->
  <line x1="620" y1="960" x2="620" y2="988" class="flow"/>

  <!-- ===================== ⑤ 评估分数回填 ===================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="990" width="1160" height="130" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="40" y="990" width="6" height="130" rx="3" fill="#7c3aed"/>
  </g>
  <text x="64" y="1018" class="phase-title" fill="#7c3aed">⑤ 评估分数回填</text>
  <text x="240" y="1018" class="phase-sub">update_algorithm_result_evaluation(task_id, result_id) · _has_round_dims 时执行</text>

  <rect x="70" y="1034" width="620" height="56" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="90" y="1056" class="step-name-s">回填各轮评估分数</text>
  <text x="90" y="1076" class="step-desc">从 DB 查各轮分数 → rounds[round_idx].evaluation = { dim_key: score }</text>

  <rect x="740" y="1034" width="420" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="950" y="1056" text-anchor="middle" class="step-name-s">仅回填轮次分数</text>
  <text x="950" y="1076" text-anchor="middle" class="step-desc">聚合由报告层 report_utils 查 DB 完成</text>

  <line x1="690" y1="1062" x2="736" y2="1062" class="flow"/>

  <!-- 连接：⑤ → ⑥ -->
  <line x1="620" y1="1120" x2="620" y2="1148" class="flow"/>

  <!-- ===================== ⑥ 报告层取值 · extract_dimension_values ===================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="1150" width="1160" height="210" rx="12" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/>
    <rect x="40" y="1150" width="6" height="210" rx="3" fill="#0891b2"/>
  </g>
  <text x="64" y="1178" class="phase-title" fill="#0891b2">⑥ 报告层取值 · extract_dimension_values</text>
  <text x="380" y="1178" class="phase-sub">按用例（TestResult）粒度聚合 · 非轮次粒度</text>

  <rect x="70" y="1196" width="340" height="80" rx="8" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.2"/>
  <circle cx="96" cy="1220" r="11" fill="#0891b2"/><text x="96" y="1224" class="num-badge">1</text>
  <text x="118" y="1224" class="step-name-s">有 overall 记录</text>
  <text x="86" y="1244" class="step-desc">round_number=None → 取整体值</text>
  <text x="86" y="1262" class="step-desc">（报告展示优先整体）</text>

  <rect x="450" y="1196" width="340" height="80" rx="8" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.2"/>
  <circle cx="476" cy="1220" r="11" fill="#0891b2"/><text x="476" y="1224" class="num-badge">2</text>
  <text x="498" y="1224" class="step-name-s">无 overall → 各轮算术平均</text>
  <text x="466" y="1244" class="step-desc">round(sum / len, 4)</text>
  <text x="466" y="1262" class="step-desc">（多轮用例合并为 1 个样本点）</text>

  <rect x="830" y="1196" width="340" height="80" rx="8" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.2"/>
  <circle cx="856" cy="1220" r="11" fill="#0891b2"/><text x="856" y="1224" class="num-badge">3</text>
  <text x="878" y="1224" class="step-name-s">只有一轮 → 取该轮值</text>
  <text x="846" y="1244" class="step-desc">（无轮次结构）</text>

  <line x1="410" y1="1236" x2="446" y2="1236" class="flow"/>
  <line x1="790" y1="1236" x2="826" y2="1236" class="flow"/>

  <text x="70" y="1308" class="note">影响：正态分布 / metric_data / raw_data / device_stats 全部按用例粒度 → 多轮用例只贡献一个样本点，轮间波动被平均掩盖</text>
  <text x="70" y="1330" class="note">非 average 维度（WER 等）：有 overall 取 1 个 item 做策略聚合；无 overall 时各轮作为独立 item → 统计口径不一致</text>

  <!-- ===================== ⑦ 当前架构特征 ===================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="1390" width="1160" height="110" rx="12" fill="#fefce8" stroke="#facc15" stroke-width="1.5"/>
    <rect x="40" y="1390" width="6" height="110" rx="3" fill="#ca8a04"/>
  </g>
  <text x="64" y="1418" class="phase-title" fill="#b45309">当前架构特征（为什么有的用例只有轮次、没有整体维度）</text>
  <text x="64" y="1444" class="body">· 逐轮评估与整体评估是两次独立调用：整体评估仅处理顶层 config.dimensions，不负责各轮分数</text>
  <text x="64" y="1466" class="body">· 整体评估收到全量 N 轮数据但只返回整体维度分（各轮分由逐轮评估单独返回）</text>
  <text x="64" y="1488" class="body">· round_number=None 整体记录由整体评估写入 或 RoundAggregator 平均兜底 → 未触发聚合的用例只剩各轮记录</text>

  <!-- ===================== 图例 ===================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="1520" width="1160" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  </g>
  <line x1="70" y1="1540" x2="110" y2="1540" class="flow"/>
  <text x="118" y="1544" class="note">主流程</text>
  <line x1="200" y1="1540" x2="240" y2="1540" class="flow-blue"/>
  <text x="248" y="1544" class="note">整体评估</text>
  <line x1="360" y1="1540" x2="400" y2="1540" class="flow-green"/>
  <text x="408" y="1544" class="note">聚合 / 完成</text>
  <rect x="500" y="1530" width="16" height="16" rx="3" fill="#fefce8" stroke="#ca8a04"/>
  <text x="524" y="1544" class="note">判定 / 分支</text>
  <line x1="640" y1="1540" x2="680" y2="1540" class="flow-red-d"/>
  <text x="688" y="1544" class="note">跳过 / 条件分支</text>

  <!-- 底部落款 -->
  <text x="620" y="1584" text-anchor="middle" class="note">依据代码：e2e_executor.py · evaluation_service.py · endpoint_worker.py · evaluation_result_processor.py · round_aggregator.py · e2e_aggregator.py · report_utils.py</text>
</svg>
