# INT-181：前端生产容器 nginx 配置 —— 反代契约与 vite dev 代理一致（frontend/vite.config.ts server.proxy）
# INT-1276：演示地址 dev server → build 产物后，在这里接 gzip + 分级缓存（只改托管，不碰业务代码）。
#   - 镜像内 nginx（nginx:alpine 1.31.x）无 brotli 模块，只用 gzip 动态压缩，不另装模块。
#   - 带 hash 的产物（/static/、/assets/）长缓存 immutable；入口 index.html 不缓存，发版即生效。
#   - /api/ 的 JSON 压缩由网关侧（api_gateway 的 GZipMiddleware）负责，nginx 不重复压
#     （gzip_proxied off：代理响应原样透传，避免两边各加一套）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # INT-2067：api_gateway 容器被 recreate 后 IP 漂移，nginx 启动期只解析一次 upstream 主机名并
    #   缓存 IP，后续仍连旧 IP → 15173/16173 全 /api 502（需重启演示前端才恢复）。
    #   改为 Docker 内嵌 DNS(127.0.0.11) 动态解析：resolver + 变量 proxy_pass 让 nginx 每 30s
    #   重解析一次，网关重建后 ≤30s 自动恢复，不再依赖手工重启演示前端。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_gateway http://api_gateway:5000;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_proxied off;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xhtml+xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf;

    # ---- 缓存分级 ----
    # 带 hash 的构建产物：一年 + immutable
    location ^~ /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 入口 HTML 不缓存（保证发版后被立即拉取）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # SPA 兜底（hash 路由，刷新/直达回退 index.html）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass $api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $api_gateway;
        proxy_set_header Host $host;
    }

    # WebSocket（socket.io 日志实时推送）
    location /socket.io/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
