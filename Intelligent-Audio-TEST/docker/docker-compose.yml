version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: intelligent_audio_test
      POSTGRES_PASSWORD: intelligent_audio_test666
      POSTGRES_DB: intelligent_audio_test
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligent_audio_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0...3}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - RUSTFS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - RUSTFS_OBS_LOGGER_LEVEL=info
    volumes:
      - rustfs_data_0:/data/rustfs0
      - rustfs_data_1:/data/rustfs1
      - rustfs_data_2:/data/rustfs2
      - rustfs_data_3:/data/rustfs3
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://localhost:9000/health && curl -fsS http://localhost:9001/rustfs/console/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api_gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api_gateway
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://rustfs:9000
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - OSS_BUCKET_NAME=intelligent-audio-test
      - OSS_KEY_PREFIX=intelligent_audio_test
      - SERVICE_HOST=api_gateway
      - TASK_SERVICE_HOST=task_service
      - TASK_SERVICE_GRPC_PORT=50061
      - E2E_TEST_SERVICE_HOST=e2e_test_service
      - E2E_TEST_SERVICE_GRPC_PORT=50051
      - API_TEST_SERVICE_HOST=api_test_service
      - API_TEST_SERVICE_GRPC_PORT=50071
      - EVALUATION_SERVICE_HOST=evaluation_service
      - EVALUATION_SERVICE_GRPC_PORT=50091
      - AUDIO_SERVICE_HOST=audio_service
      - AUDIO_SERVICE_GRPC_PORT=50052
      - DEVICE_SERVICE_HOST=device_service
      - DEVICE_SERVICE_GRPC_PORT=50053
      - REPORT_SERVICE_HOST=report_service
      - REPORT_SERVICE_GRPC_PORT=50068
      - ALGORITHM_SERVICE_HOST=algorithm_service
      - ALGORITHM_SERVICE_GRPC_PORT=50067
      - AUTH_SERVICE_HOST=auth_service
      - AUTH_SERVICE_GRPC_PORT=50069
      - AUTH_MODE=${AUTH_MODE:-off}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - DATA_TRANSFER_TMP_DIR=/app/storage/data_transfer
    volumes:
      # 与 task_service 共享：数据导入/导出 ZIP 中转（INT-25），两容器必须挂同一卷
      - data_transfer_tmp:/app/storage/data_transfer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      report_service:
        condition: service_healthy
      algorithm_service:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  task_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.task_service
    ports:
      - "5001:5001"
      - "50061:50061"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://rustfs:9000
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - OSS_BUCKET_NAME=intelligent-audio-test
      - OSS_KEY_PREFIX=intelligent_audio_test
      - SERVICE_HOST=task_service
      - GRPC_PORT=50061
      - E2E_TEST_SERVICE_HOST=e2e_test_service
      - E2E_TEST_SERVICE_GRPC_PORT=50051
      - API_TEST_SERVICE_HOST=api_test_service
      - API_TEST_SERVICE_PORT=5003
      - API_TEST_SERVICE_GRPC_PORT=50071
      - EVALUATION_SERVICE_HOST=evaluation_service
      - EVALUATION_SERVICE_GRPC_PORT=50091
      - AUDIO_SERVICE_HOST=audio_service
      - AUDIO_SERVICE_GRPC_PORT=50052
      - DEVICE_SERVICE_HOST=device_service
      - DEVICE_SERVICE_GRPC_PORT=50053
      - DATA_TRANSFER_TMP_DIR=/app/storage/data_transfer
    volumes:
      # 与 api_gateway 共享：数据导入/导出 ZIP 中转（INT-25），两容器必须挂同一卷
      - data_transfer_tmp:/app/storage/data_transfer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  evaluation_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.evaluation_service
    ports:
      - "5004:5004"
      - "50091:50091"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://rustfs:9000
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - OSS_BUCKET_NAME=intelligent-audio-test
      - OSS_KEY_PREFIX=intelligent_audio_test
      - SERVICE_HOST=evaluation_service
      - GRPC_PORT=50091
      - TASK_SERVICE_HOST=task_service
      - TASK_SERVICE_GRPC_PORT=50061
      - AUDIO_SERVICE_HOST=audio_service
      - AUDIO_SERVICE_GRPC_PORT=50052
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  e2e_test_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.e2e_test_service
    ports:
      - "5002:5002"
      - "50051:50051"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://rustfs:9000
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - OSS_BUCKET_NAME=intelligent-audio-test
      - OSS_KEY_PREFIX=intelligent_audio_test
      - GRPC_PORT=50051
      - LAB_NAME=lab-a
      - SERVICE_HOST=e2e_test_service
      - TASK_SERVICE_HOST=task_service
      - TASK_SERVICE_GRPC_PORT=50061
      - EVALUATION_SERVICE_HOST=evaluation_service
      - EVALUATION_SERVICE_GRPC_PORT=50091
      - AUDIO_SERVICE_HOST=audio_service
      - AUDIO_SERVICE_GRPC_PORT=50052
      - DEVICE_SERVICE_HOST=device_service
      - DEVICE_SERVICE_GRPC_PORT=50053
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    devices:
      - /dev/bus/usb:/dev/bus/usb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  audio_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.audio_service
    ports:
      - "50052:50052"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://rustfs:9000
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - OSS_BUCKET_NAME=intelligent-audio-test
      - OSS_KEY_PREFIX=intelligent_audio_test
      - SERVICE_HOST=audio_service
      - GRPC_PORT=50052
      - DEVICE_SERVICE_HOST=device_service
      - DEVICE_SERVICE_GRPC_PORT=50053
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50052')).result(timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  device_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.device_service
    ports:
      - "50053:50053"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://rustfs:9000
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - OSS_BUCKET_NAME=intelligent-audio-test
      - OSS_KEY_PREFIX=intelligent_audio_test
      - SERVICE_HOST=device_service
      - GRPC_PORT=50053
      - AUDIO_SERVICE_HOST=audio_service
      - AUDIO_SERVICE_GRPC_PORT=50052
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    devices:
      - /dev/bus/usb:/dev/bus/usb
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50053')).result(timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  report_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.report_service
    ports:
      - "5006:5006"
      - "50068:50068"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://rustfs:9000
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - OSS_BUCKET_NAME=intelligent-audio-test
      - OSS_KEY_PREFIX=intelligent_audio_test
      - SERVICE_HOST=report_service
      - GRPC_PORT=50068
      - TASK_SERVICE_HOST=task_service
      - TASK_SERVICE_GRPC_PORT=50061
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5006/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  algorithm_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.algorithm_service
    ports:
      - "5007:5007"
      - "50067:50067"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://rustfs:9000
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - OSS_BUCKET_NAME=intelligent-audio-test
      - OSS_KEY_PREFIX=intelligent_audio_test
      - SERVICE_HOST=algorithm_service
      - GRPC_PORT=50067
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5007/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  auth_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.auth_service
    ports:
      - "5009:5009"
      - "50069:50069"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://rustfs:9000
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - OSS_BUCKET_NAME=intelligent-audio-test
      - OSS_KEY_PREFIX=intelligent_audio_test
      - SERVICE_HOST=auth_service
      - GRPC_PORT=50069
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5009/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api_adapter_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api_adapter_service
    ports:
      - "5008:5008"
      - "50081:50081"
    environment:
      - ADAPTER_SERVICE_HTTP_PORT=5008
      - ADAPTER_SERVICE_GRPC_PORT=50081
      - VOICE_LLM_API_BASE=${VOICE_LLM_API_BASE:-}
      - VOICE_LLM_API_KEY=${VOICE_LLM_API_KEY:-}
      - VOLC_WS_URL=${VOLC_WS_URL:-}
      - VOLC_API_KEY=${VOLC_API_KEY:-}
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5008/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api_test_service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api_test_service
    ports:
      - "5003:5003"
      - "50071:50071"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://rustfs:9000
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-intelligent_audio_test}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-intelligent_audio_test666}
      - OSS_BUCKET_NAME=intelligent-audio-test
      - OSS_KEY_PREFIX=intelligent_audio_test
      - SERVICE_HOST=api_test_service
      - GRPC_PORT=50071
      - ADAPTER_SERVICE_HOST=api_adapter_service
      - ADAPTER_SERVICE_HTTP_PORT=5008
      - EVALUATION_SERVICE_HOST=evaluation_service
      - EVALUATION_SERVICE_GRPC_PORT=50091
    depends_on:
      - postgres
      - redis
      - rustfs
      - api_adapter_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 多实例扩容（--scale / deploy.replicas）前需先移除上方固定宿主端口映射，否则第二个副本端口冲突
    deploy:
      replicas: 1

volumes:
  postgres_data:
  rustfs_data_0:
  rustfs_data_1:
  rustfs_data_2:
  rustfs_data_3:
  # 网关 ↔ task_service 数据导入/导出 ZIP 中转卷（INT-25 链路依赖）
  data_transfer_tmp:
