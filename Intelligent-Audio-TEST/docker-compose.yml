version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: intelligent_audio_test
      POSTGRES_PASSWORD: intelligent_audio_test666
      POSTGRES_DB: intelligent_audio_test
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligent_audio_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minio minio123;
      mc mb myminio/audios --ignore-existing;
      mc mb myminio/case-result --ignore-existing;
      mc mb myminio/ref-params --ignore-existing;
      mc mb myminio/reports --ignore-existing;
      mc mb myminio/archives --ignore-existing;
      mc mb myminio/temp --ignore-existing;
      exit 0;
      "

  api_gateway:
    build:
      context: .
      dockerfile: Dockerfile.api_gateway
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://minio:9000
      - OSS_ACCESS_KEY=minio
      - OSS_SECRET_KEY=minio123
      - OSS_BUCKET_AUDIOS=audios
      - OSS_BUCKET_CASE_RESULT=case-result
      - OSS_BUCKET_REF_PARAMS=ref-params
      - OSS_BUCKET_REPORTS=reports
      - OSS_BUCKET_ARCHIVES=archives
      - OSS_BUCKET_TEMP=temp
      - SERVICE_HOST=api_gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  task_service:
    build:
      context: .
      dockerfile: Dockerfile.task_service
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://minio:9000
      - OSS_ACCESS_KEY=minio
      - OSS_SECRET_KEY=minio123
      - OSS_BUCKET_AUDIOS=audios
      - OSS_BUCKET_CASE_RESULT=case-result
      - OSS_BUCKET_REF_PARAMS=ref-params
      - OSS_BUCKET_REPORTS=reports
      - OSS_BUCKET_ARCHIVES=archives
      - OSS_BUCKET_TEMP=temp
      - SERVICE_HOST=task_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  e2e_test_service:
    build:
      context: .
      dockerfile: Dockerfile.e2e_test_service
    ports:
      - "5002:5002"
      - "50051:50051"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://minio:9000
      - OSS_ACCESS_KEY=minio
      - OSS_SECRET_KEY=minio123
      - OSS_BUCKET_AUDIOS=audios
      - OSS_BUCKET_CASE_RESULT=case-result
      - OSS_BUCKET_REF_PARAMS=ref-params
      - OSS_BUCKET_REPORTS=reports
      - OSS_BUCKET_ARCHIVES=archives
      - OSS_BUCKET_TEMP=temp
      - GRPC_PORT=50051
      - LAB_NAME=lab-a
      - SERVICE_HOST=e2e_test_service
    depends_on:
      - postgres
      - redis
      - minio
    devices:
      - /dev/bus/usb:/dev/bus/usb

  api_test_service:
    build:
      context: .
      dockerfile: Dockerfile.api_test_service
    ports:
      - "5003:5003"
    environment:
      - DATABASE_URL=postgresql://intelligent_audio_test:intelligent_audio_test666@postgres:5432/intelligent_audio_test
      - REDIS_URL=redis://redis:6379
      - OSS_ENDPOINT=http://minio:9000
      - OSS_ACCESS_KEY=minio
      - OSS_SECRET_KEY=minio123
      - OSS_BUCKET_AUDIOS=audios
      - OSS_BUCKET_CASE_RESULT=case-result
      - OSS_BUCKET_REPORTS=reports
      - OSS_BUCKET_TEMP=temp
      - SERVICE_HOST=api_test_service
    depends_on:
      - postgres
      - redis
      - minio
    deploy:
      replicas: 2

volumes:
  postgres_data:
  minio_data:
