<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1430" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1430" fill="#f1f5f9"/>

  <text x="24" y="44" font-size="21" font-weight="700" fill="#0f172a">分布式协调器</text>
  <text x="24" y="64" font-size="12" fill="#64748b">基于 Redis 的分布式锁 / 信号量 / 控制标志位，用于多实例部署场景</text>
  <line x1="24" y1="76" x2="1216" y2="76" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ① 设计原则 -->
  <rect x="24" y="92" width="1192" height="160" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="92" width="1192" height="38" rx="10" fill="#e0e7ff"/>
  <rect x="24" y="118" width="1192" height="12" fill="#e0e7ff"/>
  <circle cx="46" cy="111" r="11" fill="#6366f1"/>
  <text x="46" y="115" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="66" y="116" font-size="14" font-weight="700" fill="#3730a3">设计原则</text>

  <rect x="44" y="144" width="274" height="90" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <rect x="44" y="144" width="274" height="24" rx="8" fill="#eef2ff"/>
  <rect x="44" y="156" width="274" height="12" fill="#eef2ff"/>
  <circle cx="58" cy="156" r="7" fill="#6366f1"/>
  <text x="58" y="160" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <text x="72" y="160" font-size="11" font-weight="700" fill="#3730a3">安全降级</text>
  <text x="56" y="182" font-size="9.5" fill="#475569">Redis 不可达时所有方法返回</text>
  <text x="56" y="198" font-size="9.5" fill="#475569">安全默认值（放行），并打印 WARNING 日志</text>

  <rect x="336" y="144" width="274" height="90" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <rect x="336" y="144" width="274" height="24" rx="8" fill="#eef2ff"/>
  <rect x="336" y="156" width="274" height="12" fill="#eef2ff"/>
  <circle cx="350" cy="156" r="7" fill="#6366f1"/>
  <text x="350" y="160" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">T</text>
  <text x="364" y="160" font-size="11" font-weight="700" fill="#3730a3">TTL 防死锁</text>
  <text x="348" y="182" font-size="9.5" fill="#475569">锁和信号量都带 TTL，持有者</text>
  <text x="348" y="198" font-size="9.5" fill="#475569">崩溃后自动过期释放</text>

  <rect x="628" y="144" width="274" height="90" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <rect x="628" y="144" width="274" height="24" rx="8" fill="#eef2ff"/>
  <rect x="628" y="156" width="274" height="12" fill="#eef2ff"/>
  <circle cx="642" cy="156" r="7" fill="#6366f1"/>
  <text x="642" y="160" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="656" y="160" font-size="11" font-weight="700" fill="#3730a3">原子操作</text>
  <text x="640" y="182" font-size="9.5" fill="#475569">锁：SET NX EX + Lua 释放</text>
  <text x="640" y="198" font-size="9.5" fill="#475569">信号量：Lua 原子 INCR / DECR</text>

  <rect x="920" y="144" width="274" height="90" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <rect x="920" y="144" width="274" height="24" rx="8" fill="#eef2ff"/>
  <rect x="920" y="156" width="274" height="12" fill="#eef2ff"/>
  <circle cx="934" cy="156" r="7" fill="#6366f1"/>
  <text x="934" y="160" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <text x="948" y="160" font-size="11" font-weight="700" fill="#3730a3">开关可控</text>
  <text x="932" y="182" font-size="9.5" fill="#475569">DISTRIBUTED_COORDINATOR_ENABLED</text>
  <text x="932" y="198" font-size="9.5" fill="#475569">默认开启，关闭后零 Redis 开销</text>

  <!-- ② 三大原语 API -->
  <rect x="24" y="268" width="1192" height="440" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="268" width="1192" height="38" rx="10" fill="#fef3c7"/>
  <rect x="24" y="294" width="1192" height="12" fill="#fef3c7"/>
  <circle cx="46" cy="287" r="11" fill="#f59e0b"/>
  <text x="46" y="291" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="66" y="292" font-size="14" font-weight="700" fill="#92400e">三大原语 API</text>

  <rect x="44" y="320" width="368" height="260" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="44" y="320" width="368" height="28" rx="8" fill="#fef3c7"/>
  <rect x="44" y="336" width="368" height="12" fill="#fef3c7"/>
  <text x="56" y="339" font-size="11" font-weight="700" fill="#92400e">DistributedLock 分布式互斥锁</text>
  <text x="56" y="364" font-size="9.5" font-weight="600" fill="#475569">with 语法（推荐）</text>
  <text x="56" y="380" font-size="9.5" fill="#64748b">with DistributedLock('lock:resource', ttl=30):</text>
  <text x="56" y="398" font-size="9.5" fill="#64748b">    # 临界区</text>
  <text x="56" y="416" font-size="9.5" font-weight="600" fill="#475569">手动控制</text>
  <text x="56" y="432" font-size="9.5" fill="#64748b">lock = DistributedLock(key, ttl=30, retry_timeout=10)</text>
  <text x="56" y="450" font-size="9.5" fill="#64748b">lock.acquire(blocking=False) → lock.release()</text>
  <text x="56" y="470" font-size="9.5" font-weight="600" fill="#475569">参数</text>
  <text x="56" y="488" font-size="9.5" fill="#64748b">· key（lock: 前缀）  ttl=30s</text>
  <text x="56" y="506" font-size="9.5" fill="#64748b">· retry_interval=0.1  retry_timeout=30s</text>
  <text x="56" y="524" font-size="9.5" font-weight="600" fill="#475569">实现</text>
  <text x="56" y="542" font-size="9.5" fill="#64748b">SET key token NX EX ttl · Lua 校验 token 释放</text>
  <text x="56" y="558" font-size="9.5" fill="#64748b">释放时校验 token 防止误删</text>

  <rect x="434" y="320" width="368" height="260" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="434" y="320" width="368" height="28" rx="8" fill="#fef3c7"/>
  <rect x="434" y="336" width="368" height="12" fill="#fef3c7"/>
  <text x="446" y="339" font-size="11" font-weight="700" fill="#92400e">DistributedSemaphore 分布式信号量</text>
  <text x="446" y="364" font-size="9.5" font-weight="600" fill="#475569">使用示例</text>
  <text x="446" y="380" font-size="9.5" fill="#64748b">sem = DistributedSemaphore(</text>
  <text x="446" y="396" font-size="9.5" fill="#64748b">    'api:sem:api_123', max_count=5, ttl=300)</text>
  <text x="446" y="414" font-size="9.5" fill="#64748b">if sem.acquire(timeout=10):</text>
  <text x="446" y="432" font-size="9.5" fill="#64748b">    # 最多 5 个并发</text>
  <text x="446" y="450" font-size="9.5" fill="#64748b">    sem.release()</text>
  <text x="446" y="470" font-size="9.5" font-weight="600" fill="#475569">参数</text>
  <text x="446" y="488" font-size="9.5" fill="#64748b">· key（api:sem: 前缀）  max_count=5</text>
  <text x="446" y="506" font-size="9.5" fill="#64748b">· ttl=300s  timeout=10s（等待超时）</text>
  <text x="446" y="524" font-size="9.5" font-weight="600" fill="#475569">实现</text>
  <text x="446" y="542" font-size="9.5" fill="#64748b">Lua 脚本原子：INCR → 判超限 → 回退 DECR</text>
  <text x="446" y="558" font-size="9.5" fill="#64748b">→ EXPIRE，多进程并发安全</text>

  <rect x="824" y="320" width="368" height="260" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="824" y="320" width="368" height="28" rx="8" fill="#fef3c7"/>
  <rect x="824" y="336" width="368" height="12" fill="#fef3c7"/>
  <text x="836" y="339" font-size="11" font-weight="700" fill="#92400e">控制标志位 + 任务抢占</text>
  <text x="836" y="364" font-size="9.5" font-weight="600" fill="#475569">stop / pause 信号</text>
  <text x="836" y="380" font-size="9.5" fill="#64748b">dc.set_flag('task:stop:{task_id}')</text>
  <text x="836" y="398" font-size="9.5" fill="#64748b">dc.is_flag_set('task:stop:{task_id}')</text>
  <text x="836" y="416" font-size="9.5" fill="#64748b">dc.clear_flag('task:pause:{task_id}')</text>
  <text x="836" y="436" font-size="9.5" font-weight="600" fill="#475569">try_claim_task 任务抢占</text>
  <text x="836" y="452" font-size="9.5" fill="#64748b">dc.try_claim_task(task_id, holder_id='inst-A')</text>
  <text x="836" y="470" font-size="9.5" fill="#64748b">dc.release_task_claim(task_id)</text>
  <text x="836" y="490" font-size="9.5" font-weight="600" fill="#475569">注意</text>
  <text x="836" y="508" font-size="9.5" fill="#64748b">任务级防重复推荐 DB CAS：</text>
  <text x="836" y="526" font-size="9.5" fill="#64748b">UPDATE … WHERE status IN ('pending')</text>
  <text x="836" y="544" font-size="9.5" fill="#64748b">比 Redis 锁更可靠，try_claim 供特例使用</text>

  <!-- ③ Redis Key 命名约定 -->
  <rect x="24" y="724" width="1192" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="724" width="1192" height="38" rx="10" fill="#dcfce7"/>
  <rect x="24" y="750" width="1192" height="12" fill="#dcfce7"/>
  <circle cx="46" cy="743" r="11" fill="#16a34a"/>
  <text x="46" y="747" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="66" y="748" font-size="14" font-weight="700" fill="#166534">Redis Key 命名约定</text>

  <rect x="44" y="770" width="1152" height="24" rx="4" fill="#16a34a"/>
  <text x="100" y="786" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">#</text>
  <text x="280" y="786" font-size="10" font-weight="700" fill="#ffffff">用途</text>
  <text x="670" y="786" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Key 格式</text>
  <text x="1120" y="786" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">TTL</text>

  <rect x="44" y="794" width="1152" height="22" fill="#ffffff"/>
  <text x="100" y="810" font-size="10" fill="#475569" text-anchor="middle">1</text>
  <text x="280" y="810" font-size="10" fill="#475569">分布式锁</text>
  <text x="670" y="810" font-size="10" fill="#475569" text-anchor="middle">lock:{name}</text>
  <text x="1120" y="810" font-size="10" fill="#475569" text-anchor="middle">30s</text>

  <rect x="44" y="816" width="1152" height="22" fill="#f8fafc"/>
  <text x="100" y="832" font-size="10" fill="#475569" text-anchor="middle">2</text>
  <text x="280" y="832" font-size="10" fill="#475569">API 信号量</text>
  <text x="670" y="832" font-size="10" fill="#475569" text-anchor="middle">api:sem:{api_id}</text>
  <text x="1120" y="832" font-size="10" fill="#475569" text-anchor="middle">300s</text>

  <rect x="44" y="838" width="1152" height="22" fill="#ffffff"/>
  <text x="100" y="854" font-size="10" fill="#475569" text-anchor="middle">3</text>
  <text x="280" y="854" font-size="10" fill="#475569">停止标志</text>
  <text x="670" y="854" font-size="10" fill="#475569" text-anchor="middle">task:stop:{task_id}</text>
  <text x="1120" y="854" font-size="10" fill="#475569" text-anchor="middle">86400s</text>

  <rect x="44" y="860" width="1152" height="22" fill="#f8fafc"/>
  <text x="100" y="876" font-size="10" fill="#475569" text-anchor="middle">4</text>
  <text x="280" y="876" font-size="10" fill="#475569">暂停标志</text>
  <text x="670" y="876" font-size="10" fill="#475569" text-anchor="middle">task:pause:{task_id}</text>
  <text x="1120" y="876" font-size="10" fill="#475569" text-anchor="middle">86400s</text>

  <rect x="44" y="882" width="1152" height="22" fill="#ffffff"/>
  <text x="100" y="898" font-size="10" fill="#475569" text-anchor="middle">5</text>
  <text x="280" y="898" font-size="10" fill="#475569">任务抢占</text>
  <text x="670" y="898" font-size="10" fill="#475569" text-anchor="middle">task:claim:{task_id}</text>
  <text x="1120" y="898" font-size="10" fill="#475569" text-anchor="middle">600s</text>

  <!-- ④ 各服务使用情况 -->
  <rect x="24" y="940" width="1192" height="230" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="940" width="1192" height="38" rx="10" fill="#dbeafe"/>
  <rect x="24" y="966" width="1192" height="12" fill="#dbeafe"/>
  <circle cx="46" cy="959" r="11" fill="#3b82f6"/>
  <text x="46" y="963" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="66" y="964" font-size="14" font-weight="700" fill="#1e40af">各服务使用情况</text>

  <rect x="44" y="990" width="368" height="155" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="44" y="990" width="368" height="26" rx="8" fill="#dbeafe"/>
  <rect x="44" y="1004" width="368" height="12" fill="#dbeafe"/>
  <text x="56" y="1007" font-size="11" font-weight="700" fill="#1e40af">task_service</text>
  <text x="56" y="1032" font-size="10" font-weight="600" fill="#1e40af">execution_engine.py</text>
  <text x="56" y="1052" font-size="9.5" fill="#475569">· 任务级 DB CAS 防重复启动</text>
  <text x="56" y="1070" font-size="9.5" fill="#475569">· stop/pause 信号 Redis 广播</text>
  <text x="56" y="1088" font-size="9.5" fill="#475569">· 原子统计（先于 gRPC）</text>

  <rect x="434" y="990" width="368" height="155" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="434" y="990" width="368" height="26" rx="8" fill="#dbeafe"/>
  <rect x="434" y="1004" width="368" height="12" fill="#dbeafe"/>
  <text x="446" y="1007" font-size="11" font-weight="700" fill="#1e40af">api_test_service</text>
  <text x="446" y="1032" font-size="10" font-weight="600" fill="#1e40af">api_concurrency_manager.py</text>
  <text x="446" y="1052" font-size="9.5" fill="#475569">· Redis 分布式信号量限制 API 全局并发</text>
  <text x="446" y="1070" font-size="9.5" fill="#475569">· base_executor._handle_control 检查</text>
  <text x="446" y="1088" font-size="9.5" fill="#475569">  stop/pause 标志位</text>

  <rect x="824" y="990" width="368" height="155" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="824" y="990" width="368" height="26" rx="8" fill="#dbeafe"/>
  <rect x="824" y="1004" width="368" height="12" fill="#dbeafe"/>
  <text x="836" y="1007" font-size="11" font-weight="700" fill="#1e40af">e2e_test_service</text>
  <text x="836" y="1032" font-size="10" font-weight="600" fill="#1e40af">base_executor._handle_control</text>
  <text x="836" y="1052" font-size="9.5" fill="#475569">· 通过共享基类 check_stop / check_pause</text>
  <text x="836" y="1070" font-size="9.5" fill="#475569">· 检查 Redis stop/pause 标志位</text>

  <!-- ⑤ 降级策略 -->
  <rect x="24" y="1186" width="1192" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" filter="url(#softShadow)"/>
  <rect x="24" y="1186" width="1192" height="38" rx="10" fill="#fee2e2"/>
  <rect x="24" y="1212" width="1192" height="12" fill="#fee2e2"/>
  <circle cx="46" cy="1205" r="11" fill="#dc2626"/>
  <text x="46" y="1209" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="66" y="1210" font-size="14" font-weight="700" fill="#991b1b">降级策略</text>

  <rect x="44" y="1238" width="1152" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="56" y="1260" font-size="10.5" font-weight="700" fill="#166534">Redis 可达 + 开关 ON</text>
  <text x="230" y="1260" font-size="10.5" fill="#334155">→ 正常分布式协调：锁 / 信号量 / 标志位全部正常运作</text>

  <rect x="44" y="1278" width="1152" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="56" y="1300" font-size="10.5" font-weight="700" fill="#92400e">Redis 不可达 + 开关 ON</text>
  <text x="260" y="1300" font-size="10.5" fill="#334155">→ 降级放行：锁/信号量返回 True（放行），标志位返回 False/None，打印 WARNING 日志，不阻塞业务</text>

  <rect x="44" y="1318" width="1152" height="34" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
  <text x="56" y="1340" font-size="10.5" font-weight="700" fill="#334155">开关 OFF</text>
  <text x="170" y="1340" font-size="10.5" fill="#334155">→ 纯内存模式：acquire / is_flag_set 直接返回，零 Redis 连接开销（需手动设 DISTRIBUTED_COORDINATOR_ENABLED=false）</text>

  <line x1="24" y1="1390" x2="1216" y2="1390" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="1408" font-size="10" fill="#94a3b8">Intelligent-Audio-TEST · 分布式协调器 ｜ 基于 Redis 的分布式协调方案 ｜ 2026-09-11</text>
</svg>