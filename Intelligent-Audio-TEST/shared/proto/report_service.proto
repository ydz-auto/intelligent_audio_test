syntax = "proto3";

package report;

// ===== 报告配置服务（CRUD + 查询）=====
service ReportConfigService {
  // 创建报告
  rpc CreateReport(CreateReportRequest) returns (ReportConfigResponse);
  // 更新报告
  rpc UpdateReport(UpdateReportRequest) returns (ReportConfigResponse);
  // 删除报告（逻辑删除）
  rpc DeleteReport(DeleteReportRequest) returns (ReportConfigResponse);
  // 批量操作报告
  rpc BatchActionReports(BatchActionReportsRequest) returns (ReportConfigResponse);
  // 查询报告列表
  rpc ListReports(ListReportsRequest) returns (ReportConfigResponse);
  // 按同一套过滤条件计数（INT-280：HistoryReports Tab 计数服务端聚合；
  // 复用 ListReportsRequest，仅 status/report_type/favorite/deleted 过滤生效，分页字段忽略）
  rpc CountReports(ListReportsRequest) returns (ReportConfigResponse);
  // 查询单个报告详情
  rpc GetReportDetail(GetReportDetailRequest) returns (ReportConfigResponse);
  // 查询报告生成进度（按报告 ID 推导任务/生成状态）
  rpc GetReportProgress(GetReportProgressRequest) returns (ReportConfigResponse);
  // 按任务查询报告
  rpc GetReportByTask(GetReportByTaskRequest) returns (ReportConfigResponse);
  // 生成报告
  rpc GenerateReport(GenerateReportRequest) returns (ReportConfigResponse);
  // 更新报告状态
  rpc UpdateReportStatus(UpdateReportStatusRequest) returns (ReportConfigResponse);
  // 生成任务报告
  rpc GenerateTaskReport(GenerateTaskReportRequest) returns (ReportConfigResponse);
  // 生成对比报告
  rpc GenerateCompareReport(GenerateCompareReportRequest) returns (ReportConfigResponse);
  // 生成二次对比报告
  rpc GenerateSecondaryCompareReport(GenerateSecondaryCompareReportRequest) returns (ReportConfigResponse);
  // 查询报告用例列表
  rpc GetReportCases(GetReportCasesRequest) returns (ReportConfigResponse);
  // 搜索报告用例
  rpc SearchReportCases(SearchReportCasesRequest) returns (ReportConfigResponse);
  // 导出报告
  rpc ExportReports(ExportReportsRequest) returns (ReportConfigResponse);
  // 查询用例平均值
  rpc GetCaseAverages(GetCaseAveragesRequest) returns (ReportConfigResponse);
  // 下载用例日志
  rpc DownloadCaseLogs(DownloadCaseLogsRequest) returns (ReportConfigResponse);
  // 构建参考参数（供 api_gateway task_query_service 调用）
  rpc BuildReferenceParams(BuildReferenceParamsRequest) returns (ReportConfigResponse);
  // 任务数据导出：按 task_id 列表拉取报告 7 表只读行
  rpc ExportReportsForTasks(ExportReportsForTasksRequest) returns (ReportConfigResponse);
  // 任务数据导入：写入报告 7 表（单事务，内部做主键冲突剥离与 task_id/report_id 重映射），
  // 出参 {imported, id_mapping(test_reports), batch_id}
  rpc ImportReports(ImportReportsRequest) returns (ReportConfigResponse);
  // 回滚一次报告导入批次：按批次登记主键删除（补偿失败时人工介入的兜底入口）
  rpc RollbackReportImport(RollbackReportImportRequest) returns (ReportConfigResponse);

  // ---- 收藏 / 回收站（INT-141：report 归 report_service，user_id 走 x-user-id metadata）----
  // 收藏 / 取消收藏（幂等：重复收藏返回成功 + already_favorited；未收藏的取消同样成功）
  rpc FavoriteReport(FavoriteReportRequest) returns (ReportConfigResponse);
  rpc UnfavoriteReport(FavoriteReportRequest) returns (ReportConfigResponse);
  // 当前用户收藏的报告 ID 列表
  rpc ListFavoriteReportIds(ListFavoriteReportIdsRequest) returns (ReportConfigResponse);
  // 回收站列表（软删除项，含删除人/删除时间）
  rpc ListDeletedReports(ListDeletedReportsRequest) returns (ReportConfigResponse);
  // 恢复（单个+批量统一入口，ids 传一个即单个恢复）
  rpc RestoreReports(RestoreReportsRequest) returns (ReportConfigResponse);
  // 彻底删除（物理删除子表+主表；权限收敛在网关 admin/owner）
  rpc PurgeReports(PurgeReportsRequest) returns (ReportConfigResponse);

  // ---- 报告统计分析（INT-791：G04 报告统计分析页接真实接口）----
  // GET /reports/statistics：按维度统计（time|task_type|device_type|evaluation_metric）
  // + start_time/end_time + 可选 algorithm_type；结果含 overview/detail/chart/anomaly 四形态
  rpc GetStatistics(GetStatisticsRequest) returns (ReportConfigResponse);
  // GET /reports/statistics/trend：趋势分析（trend_type=time|dimension + metric + 时间范围）
  // 只返回时间序列数据，预测呈现归前端（不引入后端 ML 预测）
  rpc GetStatisticsTrend(GetStatisticsTrendRequest) returns (ReportConfigResponse);
  // POST /reports/statistics/report：报表生成（report_type × format × time_range），
  // 复用 binary 下载结构（mime_type/filename/content_base64）
  rpc GenerateStatisticsReport(GenerateStatisticsReportRequest) returns (ReportConfigResponse);
}

message CreateReportRequest {
  string data = 1;  // JSON：报告字段
}
message UpdateReportRequest {
  int32 report_id = 1;
  string data = 2;
}
message DeleteReportRequest {
  int32 report_id = 1;
  bool hard_delete = 2;
}
message BatchActionReportsRequest {
  string data = 1;  // JSON：批量操作参数
}
message ListReportsRequest {
  string report_type = 1;     // 可选，按类型过滤
  string status = 2;          // 可选，按状态过滤
  int32 task_id = 3;          // 可选，按任务过滤
  string algorithm_type = 4;  // 可选，按算法类型过滤
  int32 page = 5;
  int32 per_page = 6;
  string search = 7;
  string start_date = 8;
  string end_date = 9;
  bool favorite = 10;         // INT-141：仅当前用户收藏（x-user-id metadata）
  bool deleted = 11;          // INT-141：仅回收站（软删除项，含删除人/删除时间）
}

message GetReportDetailRequest {
  int32 report_id = 1;
}
message GetReportProgressRequest {
  int32 report_id = 1;
}
message GetReportByTaskRequest {
  int32 task_id = 1;
}
message GenerateReportRequest {
  int32 task_id = 1;
  string report_type = 2;
  string data = 3;  // JSON：额外参数
}
message UpdateReportStatusRequest {
  int32 report_id = 1;
  string status = 2;
}
message ReportConfigResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的结果
}
message GenerateTaskReportRequest {
  int32 task_id = 1;
  string name = 2;
  string description = 3;
}
message GenerateCompareReportRequest {
  string data = 1;  // JSON: {task_ids: [int], name: str, description: str}
}
message GenerateSecondaryCompareReportRequest {
  string data = 1;  // JSON: {report_ids: [int], description: str}
}
message GetReportCasesRequest {
  int32 report_id = 1;
  string data = 2;  // JSON: 查询参数（keyword/category/tags/page/per_page 等）
}
message SearchReportCasesRequest {
  int32 report_id = 1;
  string data = 2;  // JSON: 搜索参数（keyword/category/tags/include_untagged 等）
}
message ExportReportsRequest {
  string data = 1;  // JSON: {ids: [int], format: str}
}
message GetCaseAveragesRequest {
  string data = 1;  // JSON: {task_id, category, tags, categories, include_untagged}
}
message DownloadCaseLogsRequest {
  int32 report_id = 1;
  string case_id = 2;
}
message BuildReferenceParamsRequest {
  string data = 1;  // JSON: {case_info: dict, case_results: list, test_type: str}
}
message ExportReportsForTasksRequest {
  string task_ids = 1;  // JSON: list[int]，任务 ID 列表
}
message ImportReportsRequest {
  string data = 1;  // JSON: {tables: {表名: [行]}, task_id_mapping: {old: new}, batch_id: str}
}
message RollbackReportImportRequest {
  string batch_id = 1;
}

// ===== 收藏 / 回收站（INT-141）=====
message FavoriteReportRequest {
  int32 report_id = 1;
}
message ListFavoriteReportIdsRequest {
  int64 user_id = 1;  // 可选：显式指定用户（0 = 取 x-user-id metadata 当前用户）
}
message ListDeletedReportsRequest {
  int32 page = 1;
  int32 per_page = 2;
  string search = 3;
}
message RestoreReportsRequest {
  repeated int32 report_ids = 1;
}
message PurgeReportsRequest {
  repeated int32 report_ids = 1;
}

// ===== 报告统计分析（INT-791）=====
message GetStatisticsRequest {
  string data = 1;  // JSON: {dimension, start_time, end_time, algorithm_type}
}
message GetStatisticsTrendRequest {
  string data = 1;  // JSON: {trend_type, metric, start_time, end_time}
}
message GenerateStatisticsReportRequest {
  string data = 1;  // JSON: {report_type, content, format, time_range: {start_time, end_time}}
}

// ===== Benchmark 排行服务（D1 双轨排行：实测轨 + 外部基线导入 + 6 算法 + 指标映射）=====
service BenchmarkConfigService {
  // 触发排行计算（写侧命令：合并双轨 → 指标映射 → 6 算法 → ReadModel 落库 + 审计）
  rpc ComputeBenchmarkRanking(BenchmarkCommandRequest) returns (BenchmarkResponse);
  // 查询排行（读侧：只读 benchmark_rankings ReadModel，无写副作用）
  rpc GetBenchmarkRanking(BenchmarkQueryRequest) returns (BenchmarkResponse);
  // 查询参与排行的被测主体列表
  rpc GetBenchmarkRankingSubjects(BenchmarkQueryRequest) returns (BenchmarkResponse);
  // 外部基线数据源列表
  rpc ListBenchmarkSources(BenchmarkQueryRequest) returns (BenchmarkResponse);
  // 创建外部基线数据源
  rpc CreateBenchmarkSource(BenchmarkCommandRequest) returns (BenchmarkResponse);
  // 外部基线条目列表
  rpc ListBenchmarkBaselines(BenchmarkQueryRequest) returns (BenchmarkResponse);
  // 批量导入外部基线（导入即不可变快照新版本；逐行校验，非法行返回错误明细；内容重复幂等）
  rpc ImportBenchmarkBaselines(BenchmarkCommandRequest) returns (BenchmarkResponse);
  // 指标映射列表（读侧）
  rpc ListBenchmarkMetricMappings(BenchmarkQueryRequest) returns (BenchmarkResponse);
  // 创建指标映射（写侧命令 + 审计；dimension_name 唯一）
  rpc CreateBenchmarkMetricMapping(BenchmarkCommandRequest) returns (BenchmarkResponse);
  // 更新指标映射（写侧命令 + 审计）
  rpc UpdateBenchmarkMetricMapping(BenchmarkCommandRequest) returns (BenchmarkResponse);
  // 发布 Benchmark 报告（INT-481：聚合排行快照 → 复用报告 7 表结构 → benchmark_reports 落库）
  rpc CreateBenchmarkReport(BenchmarkCommandRequest) returns (BenchmarkResponse);
  // Benchmark 报告发布记录列表（INT-481 读侧）
  rpc ListBenchmarkReports(BenchmarkQueryRequest) returns (BenchmarkResponse);
  // Benchmark 报告发布记录详情（INT-481 读侧）
  rpc GetBenchmarkReport(BenchmarkQueryRequest) returns (BenchmarkResponse);
}

message BenchmarkCommandRequest {
  string data = 1;  // JSON: 命令参数
}
message BenchmarkQueryRequest {
  string data = 1;  // JSON: 查询参数（suite/category/metricCode/source/publishedTaskId/page/perPage 等）
}
message BenchmarkResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的结果
  int32 code = 4;
}

// ===== Report Studio 业务资产（INT-673，设计文档 §15.4/§15.5）=====
// documents / document_versions / chart_specs / export_jobs 四聚合，
// DSH Session/Run/SSE（/api/v1/agent/*）不在本服务；文档仅预留可空
// agent_session_id 绑定字段。
service ReportStudioService {
  // 用现有 reportId 创建草稿（可绑定已有 agentSessionId，可空）
  rpc CreateStudioDocument(StudioDocumentRequest) returns (StudioResponse);
  // 当前版本、Markdown、图表引用、ETag
  rpc GetStudioDocument(StudioDocumentRequest) returns (StudioResponse);
  // 人工编辑，expected_version + 幂等键；冲突 409 + 差异
  rpc UpdateStudioDocument(StudioDocumentRequest) returns (StudioResponse);
  // 不可变版本列表
  rpc ListStudioDocumentVersions(StudioDocumentRequest) returns (StudioResponse);
  // 选定历史版本恢复为新版本（不覆盖），带 expected_version
  rpc RestoreStudioDocumentVersion(StudioDocumentRequest) returns (StudioResponse);
  // 按当前报告数据 + ChartSpec 返回图表数据
  rpc GetStudioChartData(StudioChartDataRequest) returns (StudioResponse);
  // 固定文档版本 + 格式 + 主题，创建导出异步作业
  rpc CreateStudioExportJob(StudioExportJobRequest) returns (StudioResponse);
  // 作业状态轮询（pending/running/done/failed）+ 下载引用
  rpc GetStudioExportJob(StudioExportJobRequest) returns (StudioResponse);
  // 已完成产物鉴权下载
  rpc DownloadStudioExport(StudioExportJobRequest) returns (StudioResponse);
}

message StudioDocumentRequest {
  string data = 1;  // JSON：doc_id/report_id/agent_session_id/title/markdown_content/
                    // chart_refs/style_prefs/expected_version/idempotency_key/version
}

message StudioChartDataRequest {
  string data = 1;  // JSON：{doc_id, chart_id}
}

message StudioExportJobRequest {
  string data = 1;  // JSON：{doc_id, version, format, theme, export_id}
}

message StudioResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的结果
  int32 code = 4;   // HTTP 语义业务码（404/403/409/400/500；0 = 200）
}
