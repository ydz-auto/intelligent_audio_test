syntax = "proto3";
package task_service;
option py_generic_services = true;

// ===== 执行引擎服务 =====
service ExecutionService {
  // 创建任务
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  // 启动任务
  rpc StartTask(StartTaskRequest) returns (StartTaskResponse);
  // 停止任务
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);
  // 暂停任务
  rpc PauseTask(PauseTaskRequest) returns (PauseTaskResponse);
  // 恢复任务
  rpc ResumeTask(ResumeTaskRequest) returns (ResumeTaskResponse);
  // 从队列中移除任务
  rpc RemoveFromQueue(RemoveFromQueueRequest) returns (RemoveFromQueueResponse);
  // 获取任务状态
  rpc GetTaskStatus(GetTaskStatusRequest) returns (TaskStatusResponse);
  // 获取执行引擎实例信息（如线程池状态）
  rpc GetEngineInfo(GetEngineInfoRequest) returns (EngineInfoResponse);
  // 通知进度更新（evaluation_service 评估完成后调用）
  rpc NotifyProgress(NotifyProgressRequest) returns (NotifyProgressResponse);
  // 通知用例已完成（唤醒等待线程）
  rpc NotifyCaseCompleted(NotifyCaseCompletedRequest) returns (NotifyCaseCompletedResponse);
  // 注：EvaluateCase / Reevaluate / ReevaluateMultiRound / ReevaluateSingle
  // 已迁移至 evaluation_service.proto 的 EvaluationService
}

// ==================== ExecutionService Messages ====================

message CreateTaskRequest {
  string task_id = 1;
  string task_config = 2;  // JSON 序列化的任务配置
}

message CreateTaskResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的创建结果
}

message StartTaskRequest {
  string task_id = 1;
}

message StartTaskResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message StopTaskRequest {
  string task_id = 1;
}

message StopTaskResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message PauseTaskRequest {
  string task_id = 1;
}

message PauseTaskResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message ResumeTaskRequest {
  string task_id = 1;
}

message ResumeTaskResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message RemoveFromQueueRequest {
  string task_id = 1;
}

message RemoveFromQueueResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message GetTaskStatusRequest {
  string task_id = 1;
}

message TaskStatusResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的任务状态
}

// 注：ReevaluateRequest/Response, ReevaluateMultiRoundRequest/Response,
// ReevaluateSingleRequest/Response, EvaluateCaseRequest/Response
// 已迁移至 evaluation_service.proto

message GetEngineInfoRequest {
  string task_id = 1;
}

message EngineInfoResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的引擎信息（线程池状态等）
}

message NotifyProgressRequest {
  string task_id = 1;
  bool force = 2;
}

message NotifyProgressResponse {
  bool success = 1;
  string message = 2;
}

message NotifyCaseCompletedRequest {
  string task_id = 1;
}

message NotifyCaseCompletedResponse {
  bool success = 1;
  string message = 2;
}

// ===== 任务配置 CRUD 服务 =====
service TaskConfigService {
  // ---- 写操作 ----
  rpc CreateTaskConfig(CreateTaskConfigRequest) returns (TaskConfigResponse);
  rpc UpdateTaskConfig(UpdateTaskConfigRequest) returns (TaskConfigResponse);
  rpc DeleteTaskConfig(DeleteTaskConfigRequest) returns (TaskConfigResponse);
  rpc UpdateTaskCases(UpdateTaskCasesRequest) returns (TaskConfigResponse);
  rpc BatchActionTasks(BatchActionTasksRequest) returns (TaskConfigResponse);
  rpc MergeTasks(MergeTasksRequest) returns (TaskConfigResponse);

  // ---- 读操作 ----
  rpc ListTasks(ListTasksRequest) returns (TaskConfigResponse);
  rpc GetTaskDetail(GetTaskDetailRequest) returns (TaskConfigResponse);
  rpc GetTaskProgress(GetTaskProgressRequest) returns (TaskConfigResponse);
  rpc GetTaskStats(GetTaskStatsRequest) returns (TaskConfigResponse);
  rpc GetCaseDetail(GetCaseDetailRequest) returns (TaskConfigResponse);
  rpc GetCaseResults(GetCaseResultsRequest) returns (TaskConfigResponse);

  // ---- 生命周期操作（内部调用 execution_engine）----
  rpc StartTaskLifecycle(StartTaskLifecycleRequest) returns (TaskConfigResponse);
  rpc RetryTaskLifecycle(RetryTaskLifecycleRequest) returns (TaskConfigResponse);
  rpc ControlTaskLifecycle(ControlTaskLifecycleRequest) returns (TaskConfigResponse);
  rpc StopTaskLifecycle(StopTaskLifecycleRequest) returns (TaskConfigResponse);
  rpc RextractTaskLifecycle(RextractTaskLifecycleRequest) returns (TaskConfigResponse);
}

// ==================== TaskConfigService Messages ====================

message CreateTaskConfigRequest {
  string data = 1;  // JSON: {name, description, type, config, case_ids, device_ids, api_ids, tags, created_by}
}
message UpdateTaskConfigRequest {
  int32 task_id = 1;
  string data = 2;  // JSON: {name, description}
}
message DeleteTaskConfigRequest {
  int32 task_id = 1;
}
message UpdateTaskCasesRequest {
  int32 task_id = 1;
  string data = 2;  // JSON: {action: add/remove, case_ids}
}
message BatchActionTasksRequest {
  string data = 1;  // JSON: {action: delete/export, task_ids, format}
}
message MergeTasksRequest {
  string data = 1;  // JSON: {task_ids}
}
message ListTasksRequest {
  int32 page = 1;
  int32 per_page = 2;
  string status = 3;
  string type = 4;
  string algorithm_type = 5;
  string search = 6;
  string start_date = 7;
  string end_date = 8;
}
message GetTaskDetailRequest {
  int32 task_id = 1;
}
message GetTaskProgressRequest {
  int32 task_id = 1;
}
message GetTaskStatsRequest {
  int32 task_id = 1;
}
message GetCaseDetailRequest {
  int32 task_id = 1;
  int32 case_id = 2;
}
message GetCaseResultsRequest {
  int32 task_id = 1;
  int32 case_id = 2;
}
message StartTaskLifecycleRequest {
  int32 task_id = 1;
}
message RetryTaskLifecycleRequest {
  int32 task_id = 1;
}
message ControlTaskLifecycleRequest {
  int32 task_id = 1;
  string data = 2;  // JSON: {action, case_id}
}
message StopTaskLifecycleRequest {
  int32 task_id = 1;
}
message RextractTaskLifecycleRequest {
  int32 task_id = 1;
  string data = 2;  // JSON: {execution_status, evaluation_status}
}
message TaskConfigResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

// ===== 测试用例配置 CRUD 服务 =====
service TestCaseConfigService {
