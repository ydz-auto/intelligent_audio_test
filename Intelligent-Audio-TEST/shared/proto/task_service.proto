  rpc GetTestCaseDetail(GetTestCaseDetailRequest) returns (TestCaseConfigResponse);
  rpc GetTestCaseStats(GetTestCaseStatsRequest) returns (TestCaseConfigResponse);
  rpc GetTestCaseTags(GetTestCaseTagsRequest) returns (TestCaseConfigResponse);
  rpc GetTestCaseRefParams(GetTestCaseRefParamsRequest) returns (TestCaseConfigResponse);
  // 按筛选条件返回全量用例ID（不分页）
  rpc FetchCaseIds(FetchCaseIdsRequest) returns (TestCaseConfigResponse);
