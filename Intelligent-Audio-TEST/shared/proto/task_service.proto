  rpc CreateTestCaseConfig(CreateTestCaseConfigRequest) returns (TestCaseConfigResponse);
  rpc UpdateTestCaseConfig(UpdateTestCaseConfigRequest) returns (TestCaseConfigResponse);
  rpc DeleteTestCaseConfig(DeleteTestCaseConfigRequest) returns (TestCaseConfigResponse);
  rpc CopyTestCaseConfig(CopyTestCaseConfigRequest) returns (TestCaseConfigResponse);
  rpc BatchActionTestCases(BatchActionTestCasesRequest) returns (TestCaseConfigResponse);
  rpc UpdateTestCaseRefParams(UpdateTestCaseRefParamsRequest) returns (TestCaseConfigResponse);

  // ---- 读操作 ----
