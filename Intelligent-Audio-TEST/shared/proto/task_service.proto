// ===== 算法配置 CRUD 服务 =====
service AlgorithmConfigService {
  // ---- 算法定义 写操作 ----
  rpc CreateAlgorithm(CreateAlgorithmRequest) returns (AlgorithmConfigResponse);
  rpc UpdateAlgorithm(UpdateAlgorithmRequest) returns (AlgorithmConfigResponse);
  rpc DeleteAlgorithm(DeleteAlgorithmRequest) returns (AlgorithmConfigResponse);

  // ---- 算法分组 写操作 ----
  rpc CreateAlgorithmGroup(CreateAlgorithmGroupRequest) returns (AlgorithmConfigResponse);
  rpc UpdateAlgorithmGroup(UpdateAlgorithmGroupRequest) returns (AlgorithmConfigResponse);
  rpc DeleteAlgorithmGroup(DeleteAlgorithmGroupRequest) returns (AlgorithmConfigResponse);

  // ---- 参数(device/api) 写操作 ----
  rpc CreateParam(CreateParamRequest) returns (AlgorithmConfigResponse);
  rpc UpdateParam(UpdateParamRequest) returns (AlgorithmConfigResponse);
  rpc DeleteParam(DeleteParamRequest) returns (AlgorithmConfigResponse);

  // ---- 用例专属参数 写操作 ----
  rpc CreateCaseParam(CreateCaseParamRequest) returns (AlgorithmConfigResponse);
  rpc UpdateCaseParam(UpdateCaseParamRequest) returns (AlgorithmConfigResponse);
  rpc DeleteCaseParam(DeleteCaseParamRequest) returns (AlgorithmConfigResponse);

  // ---- 参考参数 写操作 ----
  rpc CreateReferenceParam(CreateReferenceParamRequest) returns (AlgorithmConfigResponse);
  rpc UpdateReferenceParam(UpdateReferenceParamRequest) returns (AlgorithmConfigResponse);
  rpc DeleteReferenceParam(DeleteReferenceParamRequest) returns (AlgorithmConfigResponse);

  // ---- 参数映射 写操作 ----
  rpc CreateMapping(CreateMappingRequest) returns (AlgorithmConfigResponse);
  rpc UpdateMapping(UpdateMappingRequest) returns (AlgorithmConfigResponse);
  rpc DeleteMapping(DeleteMappingRequest) returns (AlgorithmConfigResponse);

  // ---- 维度关联 写操作 ----
  rpc AssociateDimensions(AssociateDimensionsRequest) returns (AlgorithmConfigResponse);
  rpc CreateDimensionRelation(CreateDimensionRelationRequest) returns (AlgorithmConfigResponse);
  rpc UpdateDimensionRelation(UpdateDimensionRelationRequest) returns (AlgorithmConfigResponse);
  rpc DeleteDimensionRelation(DeleteDimensionRelationRequest) returns (AlgorithmConfigResponse);

  // ---- 批量操作 ----
  rpc ImportAlgorithms(ImportAlgorithmsRequest) returns (AlgorithmConfigResponse);
  rpc BulkDeleteAlgorithms(BulkDeleteAlgorithmsRequest) returns (AlgorithmConfigResponse);
  rpc ExtractParams(ExtractParamsRequest) returns (AlgorithmConfigResponse);
  rpc ReloadAlgorithmConfig(ReloadAlgorithmConfigRequest) returns (AlgorithmConfigResponse);

  // ---- 读操作 ----
  rpc ListAlgorithms(ListAlgorithmsRequest) returns (AlgorithmConfigResponse);
  rpc GetAlgorithm(GetAlgorithmRequest) returns (AlgorithmConfigResponse);
  rpc GetAlgorithmOptions(GetAlgorithmOptionsRequest) returns (AlgorithmConfigResponse);
  rpc ListAlgorithmGroups(ListAlgorithmGroupsRequest) returns (AlgorithmConfigResponse);
  rpc GetAlgorithmGroup(GetAlgorithmGroupRequest) returns (AlgorithmConfigResponse);
  rpc ListParams(ListParamsRequest) returns (AlgorithmConfigResponse);
  rpc GetParam(GetParamRequest) returns (AlgorithmConfigResponse);
  rpc ListCaseParams(ListCaseParamsRequest) returns (AlgorithmConfigResponse);
  rpc GetCaseParam(GetCaseParamRequest) returns (AlgorithmConfigResponse);
  rpc ListReferenceParams(ListReferenceParamsRequest) returns (AlgorithmConfigResponse);
  rpc ListMappings(ListMappingsRequest) returns (AlgorithmConfigResponse);
  rpc GetFormSchema(GetFormSchemaRequest) returns (AlgorithmConfigResponse);
  rpc GetAlgorithmDimensions(GetAlgorithmDimensionsRequest) returns (AlgorithmConfigResponse);
  rpc GetDimensionParams(GetDimensionParamsRequest) returns (AlgorithmConfigResponse);
}

