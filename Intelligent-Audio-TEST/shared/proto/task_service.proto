// ===== 任务数据查询服务（P1.5 新增，供 evaluation_service / api_test_service / e2e_test_service 跨服务读 task_service 数据）=====
service TaskDataService {
  // 按 ID 读取单个 TestResult（归属 task_service，其他服务禁止直连 DB 查此表）
  rpc GetTestResultById(GetTestResultByIdRequest) returns (TaskDataResponse);
  // 按 task_id + case_ids 批量读取 TaskCase
  rpc GetTaskCaseByIds(GetTaskCaseByIdsRequest) returns (TaskDataResponse);
  // 按 task_id 读取 Task 详情
  rpc GetTaskById(GetTaskByIdRequest) returns (TaskDataResponse);
  // 按 task_id 读取关联设备
  rpc GetTaskDevices(GetTaskDevicesRequest) returns (TaskDataResponse);
  // 按 task_id 读取关联 API
  rpc GetTaskApis(GetTaskApisRequest) returns (TaskDataResponse);
  // 写入测试结果（api_test_service / e2e_test_service / evaluation_service 执行完成后调用）
  rpc SubmitResult(SubmitResultRequest) returns (TaskDataResponse);
  // 更新 TaskCase 状态（evaluation_service 评估完成后调用）
  rpc UpdateTaskCaseStatus(UpdateTaskCaseStatusRequest) returns (TaskDataResponse);
  // 更新 TestResult 的 algorithm_result（evaluation_service 多轮聚合后调用）
  rpc UpdateTestResultAlgorithmResult(UpdateTestResultAlgorithmResultRequest) returns (TaskDataResponse);
  // 更新 TestResult 的 result_data 和 result_data_path（evaluation_service 预提取 algorithm_results 快照时调用）
  rpc UpdateTestResultData(UpdateTestResultDataRequest) returns (TaskDataResponse);
  // 按 task_id + test_case_id 批量读取 TestResult
  rpc GetTestResultsByTaskAndCase(GetTestResultsByTaskAndCaseRequest) returns (TaskDataResponse);
  // 更新 TestResult 的 execution_status（evaluation_service 标记完成时调用）
  rpc UpdateTestResultStatus(UpdateTestResultStatusRequest) returns (TaskDataResponse);
  // 更新 Task 的 status（evaluation_service 重新评估流转时调用）
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (TaskDataResponse);
  // 查询 TaskMergeRelation（api_gateway 报告对比用）
  rpc GetTaskMergeRelations(GetTaskMergeRelationsRequest) returns (TaskDataResponse);
  // 查询 Log 列表（api_gateway 日志用）
  rpc ListLogs(ListLogsRequest) returns (TaskDataResponse);
  // 批量写入日志（shared/utils/log_handler 后台 worker 用，替代直连 DB）
  rpc BatchCreateLogs(BatchCreateLogsRequest) returns (TaskDataResponse);
  // 查询日志统计（group_by level + count）
  rpc GetLogStats(GetLogStatsRequest) returns (TaskDataResponse);
  // 增量查询日志（id > last_id，返回 max_id）
  rpc ListLogsAfterId(ListLogsAfterIdRequest) returns (TaskDataResponse);
  // 按 id 列表/条件查询日志（导出用）
  rpc GetLogsForExport(GetLogsForExportRequest) returns (TaskDataResponse);
  // 查询日志总数（含按日期范围）
  rpc GetLogCount(GetLogCountRequest) returns (TaskDataResponse);
  // 批量更新日志标记
  rpc UpdateLogsMark(UpdateLogsMarkRequest) returns (TaskDataResponse);
  // 批量清除日志（按日期/标记）
  rpc ClearLogs(ClearLogsRequest) returns (TaskDataResponse);
  // 归档日志（按天数，dry_run 预检）
  rpc ArchiveLogs(ArchiveLogsRequest) returns (TaskDataResponse);
  // 查询 TestCaseGroup 列表（api_gateway 分组管理用）
  rpc ListTestCaseGroups(ListTestCaseGroupsRequest) returns (TaskDataResponse);
  // 按 ID 列表批量查询 TestCaseGroup（导入导出用）
  rpc GetTestCaseGroupsByIds(GetTestCaseGroupsByIdsRequest) returns (TaskDataResponse);
  // 按名称列表批量查询 TestCaseGroup（导入导出用）
  rpc GetTestCaseGroupsByNames(GetTestCaseGroupsByNamesRequest) returns (TaskDataResponse);
  // 按 ID 查询单个 TestCaseGroup
  rpc GetTestCaseGroupById(GetTestCaseGroupByIdRequest) returns (TaskDataResponse);
  // 按名称查询单个 TestCaseGroup（导入时查重用）
  rpc GetTestCaseGroupByName(GetTestCaseGroupByNameRequest) returns (TaskDataResponse);
  // 创建 TestCaseGroup（导入时新建分组用）
  rpc CreateTestCaseGroup(CreateTestCaseGroupRequest) returns (TaskDataResponse);
  // 更新 TestCaseGroup（名称/描述/算法类型）
  rpc UpdateTestCaseGroup(UpdateTestCaseGroupRequest) returns (TaskDataResponse);
  // 软删除 TestCaseGroup（含 cascade 选项）
  rpc DeleteTestCaseGroup(DeleteTestCaseGroupRequest) returns (TaskDataResponse);
  // 聚合统计（供 stats_cache / home_service 用）— count/group_by
  rpc GetTaskStats(TaskAggStatsRequest) returns (TaskDataResponse);
  rpc GetTestCaseStats(TestCaseAggStatsRequest) returns (TaskDataResponse);
}

message GetTestResultByIdRequest {
  int32 result_id = 1;
}
message GetTaskCaseByIdsRequest {
  int32 task_id = 1;
  repeated string case_ids = 2;
}
message GetTaskByIdRequest {
  int32 task_id = 1;
}
message GetTaskDevicesRequest {
  int32 task_id = 1;
}
message GetTaskApisRequest {
  int32 task_id = 1;
}
message SubmitResultRequest {
  int32 task_id = 1;
  string result_data = 2;  // JSON：TestResult 字段
}
message UpdateTaskCaseStatusRequest {
  int32 task_id = 1;
  string case_id = 2;
  string status = 3;          // pending/completed/failed/skipped
  string execution_status = 4;  // pending/running/completed/stopped/failed
  string evaluation_status = 5; // queued/pending/running/calculating/completed/stopped/failed
  string error_message = 6;
}
message UpdateTestResultAlgorithmResultRequest {
  int32 result_id = 1;
  string algorithm_result = 2;  // JSON：完整的 algorithm_result 字段
}
message UpdateTestResultDataRequest {
  int32 result_id = 1;
  string result_data = 2;        // JSON：轻量 result_data（DB 列）
  string result_data_path = 3;   // 大字段文件路径（可为空）
}
message GetTestResultsByTaskAndCaseRequest {
  int32 task_id = 1;
  string test_case_id = 2;  // 可选，为空返回该 task 下所有
}
message UpdateTestResultStatusRequest {
  int32 result_id = 1;
  string execution_status = 2;  // pending/running/completed/stopped/failed
}
message UpdateTaskStatusRequest {
  int32 task_id = 1;
  string status = 2;  // pending/queued/running/evaluating/reevaluate_queued/reevaluating/completed/failed/stopped/paused/skipped
}
message TaskDataResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的结果
}

message GetTaskMergeRelationsRequest {
  int32 task_id = 1;  // 按 task_id 查询合并关系
}
message ListLogsRequest {
  int32 task_id = 1;          // 可选，按 task_id 过滤
  string level = 2;           // 可选，按级别过滤
  int32 page = 3;             // 分页页码
  int32 per_page = 4;        // 每页条数
  string start_date = 5;     // 可选，开始日期
  string end_date = 6;       // 可选，结束日期
}
message ListTestCaseGroupsRequest {
  string algorithm_type = 1;  // 可选，按算法类型过滤
  string search = 2;          // 可选，搜索关键词
}
message GetTestCaseGroupsByIdsRequest {
  repeated string group_ids = 1;  // TestCaseGroup ID 列表
}
message GetTestCaseGroupsByNamesRequest {
  repeated string group_names = 1;  // TestCaseGroup 名称列表
}
message GetTestCaseGroupByIdRequest {
  string group_id = 1;
}
message GetTestCaseGroupByNameRequest {
  string group_name = 1;
}
message CreateTestCaseGroupRequest {
  string name = 1;
  string description = 2;
  string algorithm_type = 3;
  string group_id = 4;  // 可选，指定 ID（导入用）
}
message UpdateTestCaseGroupRequest {
  string group_id = 1;
  string name = 2;              // 新名称（可选，空则不更新）
  string description = 3;      // 新描述（可选，空则不更新）
  string algorithm_type = 4;   // 新算法类型（可选，空则不更新）
}
message DeleteTestCaseGroupRequest {
  string group_id = 1;
  bool cascade = 2;            // true: 同时软删该分组下所有 TestCase
}

// ===== TaskDataService 聚合统计 Request（供 stats_cache / home_service 用）=====
// 注：名称带 Agg 前缀以避免与 TaskConfigService.GetTaskStatsRequest /
// TestCaseConfigService.GetTestCaseStatsRequest 同名冲突。
message TaskAggStatsRequest {
  string status = 1;          // 可选，按状态过滤
  string algorithm_type = 2;  // 可选
  string group_by = 3;        // 可选，分组字段（如 status / algorithm_type）
}
message TestCaseAggStatsRequest {
  string algorithm_type = 1;  // 可选
  int32 group_id = 2;         // 可选
  string group_by = 3;        // 可选，分组字段（如 algorithm_type / group_id）
}

// ===== Log CRUD RPC（P0-3 新增，替代 api_gateway/shared/utils 直连 DB）=====

message BatchCreateLogsRequest {
  string logs_json = 1;  // JSON: [{time, level, category, module, source, content, task_id?, ...}, ...]
}
message GetLogStatsRequest {
  string level = 1;           // 可选，按级别过滤（支持逗号分隔多级别）
  string module = 2;          // 可选
  string category = 3;        // 可选
  string mark = 4;            // 可选
  int32 device_id = 5;       // 可选
  int32 task_id = 6;          // 可选
  string keyword = 7;         // 可选
  string content_include = 8; // 可选
  string content_exclude = 9; // 可选
  string start_time = 10;     // 可选 ISO
  string end_time = 11;       // 可选 ISO
  string algorithm_type = 12; // 可选
}
message ListLogsAfterIdRequest {
  int32 last_id = 1;   // 增量基准 ID
  int32 limit = 2;     // 返回条数上限
}
message GetLogsForExportRequest {
  repeated int32 log_ids = 1;  // 可选，按 id 列表查询
  string level = 2;             // 可选
  string module = 3;             // 可选
}
message GetLogCountRequest {
  string start_date = 1;  // 可选 ISO，统计 >= 此日期的 hot 日志
}
message UpdateLogsMarkRequest {
  repeated int32 log_ids = 1;
  string mark = 2;
}
message ClearLogsRequest {
  string before_datetime = 1;  // 可选 ISO，删除此时间之前的日志
  bool keep_marked = 2;        // 为 true 时保留有 mark 的日志
}
message ArchiveLogsRequest {
  int32 days = 1;     // 归档 days 天前的日志
  bool dry_run = 2;   // 为 true 时只统计不执行
}

