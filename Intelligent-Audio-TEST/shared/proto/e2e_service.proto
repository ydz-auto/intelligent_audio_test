syntax = "proto3";
package e2e_service;
option py_generic_services = true;

// ===== 音频服务 =====
service AudioService {
  // 播放音频
  rpc PlayAudio(PlayAudioRequest) returns (PlayAudioResponse);
  // 停止播放
  rpc StopAudio(StopAudioRequest) returns (StopAudioResponse);
  // 获取播放状态
  rpc GetPlayStatus(GetPlayStatusRequest) returns (GetPlayStatusResponse);
  // 获取音频文件信息
  rpc GetAudioInfo(GetAudioInfoRequest) returns (AudioInfoResponse);
  // 声压级测量
  rpc MeasureSPL(MeasureSPLRequest) returns (SPLResponse);
  // 开始SPL测量
  rpc StartSPL(StartSPLRequest) returns (StartSPLResponse);
  // 停止SPL测量
  rpc StopSPL(StopSPLRequest) returns (StopSPLResponse);
  // 扫描所有物理输出设备
  rpc GetPhysicalDevices(GetPhysicalDevicesRequest) returns (GetPhysicalDevicesResponse);
  // 根据唯一标识获取设备索引
  rpc GetDeviceIndex(GetDeviceIndexRequest) returns (GetDeviceIndexResponse);
  // 按模式停止音频播放
  rpc StopAudioByPattern(StopAudioByPatternRequest) returns (StopAudioByPatternResponse);
}

// ===== 设备驱动服务 =====
service DeviceService {
  // 创建设备驱动（连接设备）
  rpc CreateDriver(CreateDriverRequest) returns (CreateDriverResponse);
  // 销毁设备驱动
  rpc DestroyDriver(DestroyDriverRequest) returns (DestroyDriverResponse);
  // 注册任务事件回调
  rpc RegisterTaskEvents(RegisterTaskEventsRequest) returns (RegisterTaskEventsResponse);
  // 注销任务事件回调
  rpc UnregisterTaskEvents(UnregisterTaskEventsRequest) returns (UnregisterTaskEventsResponse);
  // 获取任务事件
  rpc GetTaskEvents(GetTaskEventsRequest) returns (GetTaskEventsResponse);
  // 扫描设备
  rpc DriverScan(DriverScanRequest) returns (DriverScanResponse);
  // 解锁设备
  rpc DriverUnlock(DriverUnlockRequest) returns (DriverUnlockResponse);
  // 获取 mock 模式
  rpc GetMockMode(GetMockModeRequest) returns (GetMockModeResponse);
  // 设置 mock 模式
  rpc SetMockMode(SetMockModeRequest) returns (SetMockModeResponse);
  // 按关键词获取驱动名
  rpc GetDriverNameByKeywords(GetDriverNameByKeywordsRequest) returns (GetDriverNameByKeywordsResponse);
  // 获取已注册关键词
  rpc GetRegisteredKeywords(GetRegisteredKeywordsRequest) returns (GetRegisteredKeywordsResponse);
}

// ===== 播放编排服务 =====
service PlaybackService {
  // 开始播放编排
  rpc StartPlayback(StartPlaybackRequest) returns (StartPlaybackResponse);
  // 停止播放编排
  rpc StopPlayback(StopPlaybackRequest) returns (StopPlaybackResponse);
}

// ===== 设备结果采集服务 =====
service DeviceResultService {
  // 采集设备结果
  rpc CollectResult(CollectResultRequest) returns (CollectResultResponse);
  // 重新提取设备结果
  rpc ReextractResult(ReextractResultRequest) returns (ReextractResultResponse);
}

// ===== 环境设备服务 =====
service EnvDeviceService {
  // 控制环境设备（导轨旋转等）
  rpc ControlEnvDevice(ControlEnvDeviceRequest) returns (ControlEnvDeviceResponse);
}

// ===== E2E 执行服务 =====
service ExecutionService {
  // 启动 E2E 任务（执行单个 E2E 用例）
  rpc StartE2ETask(StartE2ETaskRequest) returns (StartE2ETaskResponse);
  // 停止 E2E 任务
  rpc StopE2ETask(StopE2ETaskRequest) returns (StopE2ETaskResponse);
  // 获取 E2E 任务状态
  rpc GetE2ETaskStatus(GetE2ETaskStatusRequest) returns (GetE2ETaskStatusResponse);
}

