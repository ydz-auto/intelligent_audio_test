syntax = "proto3";
package api_test_service;
option py_generic_services = true;

// ===== API 测试服务 =====
service APITestService {
  // 创建 API 测试任务
  rpc CreateAPITest(CreateAPITestRequest) returns (CreateAPITestResponse);
  // 启动 API 测试
  rpc StartAPITest(StartAPITestRequest) returns (StartAPITestResponse);
  // 停止 API 测试
  rpc StopAPITest(StopAPITestRequest) returns (StopAPITestResponse);
  // 获取 API 测试状态
  rpc GetAPITestStatus(GetAPITestStatusRequest) returns (APITestStatusResponse);

  // ===== API 配置 CRUD =====
  // 创建 API 配置
  rpc CreateAPIConfig(CreateAPIConfigRequest) returns (CreateAPIConfigResponse);
  // 更新 API 配置
  rpc UpdateAPIConfig(UpdateAPIConfigRequest) returns (UpdateAPIConfigResponse);
  // 删除 API 配置（软删除）
  rpc DeleteAPIConfig(DeleteAPIConfigRequest) returns (DeleteAPIConfigResponse);
  // 分页查询 API 列表
  rpc ListAPIConfigs(ListAPIConfigsRequest) returns (ListAPIConfigsResponse);
  // 查询单个 API 详情
  rpc GetAPIConfig(GetAPIConfigRequest) returns (GetAPIConfigResponse);
  // 测试 API 连接（含 WebSocket/HTTP 健康检查）
  rpc TestAPIConnection(TestAPIConnectionRequest) returns (TestAPIConnectionResponse);
  // 停止 API 测试连接
  rpc StopAPITestConfig(StopAPITestConfigRequest) returns (StopAPITestConfigResponse);
}

// ===== API RMS→SPL 映射配置服务（UC-0902 数字域灵敏度校准，与设备域 SPLConfigService 对称）=====
service ApiRmsSplConfigService {
  // 创建映射
  rpc CreateRmsSplMapping(CreateRmsSplMappingRequest) returns (CreateRmsSplMappingResponse);
  // 更新映射
  rpc UpdateRmsSplMapping(UpdateRmsSplMappingRequest) returns (UpdateRmsSplMappingResponse);
  // 删除映射（软删除）
  rpc DeleteRmsSplMapping(DeleteRmsSplMappingRequest) returns (DeleteRmsSplMappingResponse);
  // 分页查询映射列表
  rpc ListRmsSplMappings(ListRmsSplMappingsRequest) returns (ListRmsSplMappingsResponse);
  // 查询单个映射详情
  rpc GetRmsSplMapping(GetRmsSplMappingRequest) returns (GetRmsSplMappingResponse);
  // 按 API 查映射列表
  rpc GetRmsSplMappingsByApi(GetRmsSplMappingsByApiRequest) returns (GetRmsSplMappingsByApiResponse);
  // 执行校准（并发互斥：DistributedLock lock:spl:calibration:{api_id}）
  rpc CalibrateRmsSplMapping(CalibrateRmsSplMappingRequest) returns (CalibrateRmsSplMappingResponse);
  // 设为 API 当前默认映射（apis.rms_spl_mapping_id）
  rpc SetDefaultRmsSplMapping(SetDefaultRmsSplMappingRequest) returns (SetDefaultRmsSplMappingResponse);
}

// ==================== APITestService Messages ====================

message CreateAPITestRequest {
  string task_id = 1;
  string test_config = 2;  // JSON 序列化的 API 测试配置
}

message CreateAPITestResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的创建结果
}

message StartAPITestRequest {
  string task_id = 1;
  string device_type = 2;  // physical / http_api / websocket_api（用例级路由，执行域 P0 新增）
  string device_id = 3;    // 被测设备 ID（physical=设备ID / API 类=api.id，执行域 P0 新增）
  repeated int32 case_ids = 4;  // 精确用例分发（INT-71）：task_service 逐用例领取后按 TaskCase.id 派发；空则按 pending/queued 兜底读取
}

message StartAPITestResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message StopAPITestRequest {
  string task_id = 1;
}

message StopAPITestResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message GetAPITestStatusRequest {
  string task_id = 1;
}

message APITestStatusResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的 API 测试状态
}

// ==================== API 配置 CRUD Messages ====================

message CreateAPIConfigRequest {
  string data = 1;  // JSON 序列化的创建参数
}

message CreateAPIConfigResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message UpdateAPIConfigRequest {
  int32 api_id = 1;
  string data = 2;  // JSON 序列化的更新参数
}

message UpdateAPIConfigResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message DeleteAPIConfigRequest {
  int32 api_id = 1;
}

message DeleteAPIConfigResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message ListAPIConfigsRequest {
  int32 page = 1;
  int32 per_page = 2;
  string keyword = 3;
  string status = 4;
  string algorithm_type = 5;
}

message ListAPIConfigsResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message GetAPIConfigRequest {
  int32 api_id = 1;
}

message GetAPIConfigResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message TestAPIConnectionRequest {
  int32 api_id = 1;
}

message TestAPIConnectionResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

message StopAPITestConfigRequest {
  int32 api_id = 1;
}

message StopAPITestConfigResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
}

// ==================== ApiRmsSplConfigService Messages ====================
// 响应统一含 int32 code（业务 HTTP 语义码：200/201 成功、400/404/409 失败原因），
// 网关据此映射 409 CONFLICT / 404 NOT_FOUND；旧版本 servicer 未填时为 0，
// 网关回退为 success ? 200 : 400。

message CreateRmsSplMappingRequest {
  string data = 1;  // JSON 序列化的创建参数
}

message CreateRmsSplMappingResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
  int32 code = 4;
}

message UpdateRmsSplMappingRequest {
  int32 mapping_id = 1;
  string data = 2;  // JSON 序列化的更新参数
}

message UpdateRmsSplMappingResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
  int32 code = 4;
}

message DeleteRmsSplMappingRequest {
  int32 mapping_id = 1;
}

message DeleteRmsSplMappingResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
  int32 code = 4;
}

message ListRmsSplMappingsRequest {
  int32 page = 1;
  int32 per_page = 2;
  int32 api_id = 3;
  string calibration_status = 4;
}

message ListRmsSplMappingsResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
  int32 code = 4;
}

message GetRmsSplMappingRequest {
  int32 mapping_id = 1;
}

message GetRmsSplMappingResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
  int32 code = 4;
}

message GetRmsSplMappingsByApiRequest {
  int32 api_id = 1;
}

message GetRmsSplMappingsByApiResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
  int32 code = 4;
}

message CalibrateRmsSplMappingRequest {
  int32 mapping_id = 1;
  string calibration_data = 2;  // JSON 序列化的校准点数据 {"points": [...]}
}

message CalibrateRmsSplMappingResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
  int32 code = 4;
}

message SetDefaultRmsSplMappingRequest {
  int32 api_id = 1;
  int32 mapping_id = 2;  // 0 表示清除默认映射
}

message SetDefaultRmsSplMappingResponse {
  bool success = 1;
  string message = 2;
  string data = 3;
  int32 code = 4;
}
