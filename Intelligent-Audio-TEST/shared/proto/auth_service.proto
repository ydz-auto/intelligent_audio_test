syntax = "proto3";

package auth;

// ===== 认证服务（用户管理 + 权限查询 + 认证校验）=====
service AuthService {
  // 按 ID 获取用户（含角色名、权限列表）
  rpc GetUser(GetUserRequest) returns (AuthResponse);
  // 按用户名获取用户
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (AuthResponse);
  // 按 OAuth 提供商 + 外部 ID 获取用户
  rpc GetUserByOAuth(GetUserByOAuthRequest) returns (AuthResponse);
  // 创建用户（OAuth 或本地注册），返回新用户 ID
  rpc CreateUser(CreateUserRequest) returns (AuthResponse);
  // 更新最后登录时间/IP
  rpc UpdateLastLogin(UpdateLastLoginRequest) returns (AuthResponse);
  // 获取用户权限码列表
  rpc GetUserPermissions(GetUserPermissionsRequest) returns (AuthResponse);
  // 列出所有角色
  rpc ListRoles(ListRolesRequest) returns (AuthResponse);
  // 分页列出用户
  rpc ListUsers(ListUsersRequest) returns (AuthResponse);
  // 更新用户状态
  rpc UpdateUserStatus(UpdateUserStatusRequest) returns (AuthResponse);
  // 授予权限
  rpc GrantPermission(GrantPermissionRequest) returns (AuthResponse);
  // 撤销权限
  rpc RevokePermission(RevokePermissionRequest) returns (AuthResponse);
  // 软删除用户
  rpc DeleteUser(DeleteUserRequest) returns (AuthResponse);
  // 更新用户资料（username/email/status/password，空串字段不修改）
  rpc UpdateUser(UpdateUserRequest) returns (AuthResponse);
  // 设置用户角色
  rpc SetUserRole(SetUserRoleRequest) returns (AuthResponse);

  // ===== 角色与权限管理 =====
  // 按角色 ID 获取角色（含权限码列表）
  rpc GetRole(GetRoleRequest) returns (AuthResponse);
  // 创建角色（name/description/repeated permission_codes）
  rpc CreateRole(CreateRoleRequest) returns (AuthResponse);
  // 更新角色信息（name/description 空串=不修改）
  rpc UpdateRole(UpdateRoleRequest) returns (AuthResponse);
  // 全量替换角色权限（repeated permission_codes）
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (AuthResponse);
  // 删除角色（连带 role_permissions）
  rpc DeleteRole(DeleteRoleRequest) returns (AuthResponse);
  // 列出全部权限点
  rpc ListPermissions(ListPermissionsRequest) returns (AuthResponse);
}

message GetUserRequest {
  int32 user_id = 1;
}
message GetUserByUsernameRequest {
  string username = 1;
}
message GetUserByOAuthRequest {
  string provider = 1;
  string subject = 2;
}
message CreateUserRequest {
  string username = 1;
  string email = 2;
  string oauth_provider = 3;
  string oauth_subject = 4;
  int32 role_id = 5;
  string role_name = 6;  // 角色名（如 'guest'），为空时用 role_id
  string password = 7;   // 明文密码（本地注册用户），为空表示无密码（OAuth 用户）
  int32 operator_id = 8; // 操作者用户 ID（审计归因，自注册为 0）
}
message UpdateLastLoginRequest {
  int32 user_id = 1;
  string ip = 2;
}
message GetUserPermissionsRequest {
  int32 user_id = 1;
}
message ListRolesRequest {}
message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3;
  string keyword = 4;  // username/email 模糊匹配，空串不过滤
  int32 role_id = 5;   // 角色过滤，0 不过滤
}
message UpdateUserStatusRequest {
  int32 user_id = 1;
  string status = 2;
  int32 operator_id = 3; // 操作者用户 ID（审计归因）
}
message GrantPermissionRequest {
  int32 user_id = 1;
  string permission = 2;
  int32 operator_id = 3; // 操作者用户 ID（审计归因）
}
message RevokePermissionRequest {
  int32 user_id = 1;
  string permission = 2;
  int32 permission_id = 3; // 按权限点 ID 撤销（差量撤销语义），优先于 permission 码
  int32 operator_id = 4;   // 操作者用户 ID（审计归因）
}
message DeleteUserRequest {
  int32 user_id = 1;
  int32 operator_id = 2; // 操作者用户 ID（审计归因）
}
message UpdateUserRequest {
  int32 user_id = 1;
  string username = 2;    // 空串=不修改
  string email = 3;       // 空串=不修改
  string status = 4;      // 空串=不修改；active/inactive/locked
  string password = 5;    // 空串=不修改；明文密码，服务端哈希落库
  int32 operator_id = 6;  // 操作者用户 ID（审计归因）
}
message SetUserRoleRequest {
  int32 user_id = 1;
  int32 role_id = 2;
  int32 operator_id = 3; // 操作者用户 ID（审计归因）
}
message GetRoleRequest {
  int32 role_id = 1;
}
message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated string permission_codes = 3;
  int32 operator_id = 4; // 操作者用户 ID（审计归因）
}
message UpdateRoleRequest {
  int32 role_id = 1;
  string name = 2;        // 空串=不修改
  string description = 3; // 空串=不修改
  int32 operator_id = 4;  // 操作者用户 ID（审计归因）
}
message SetRolePermissionsRequest {
  int32 role_id = 1;
  repeated string permission_codes = 2; // 全量替换 role_permissions
  int32 operator_id = 3;                // 操作者用户 ID（审计归因）
}
message DeleteRoleRequest {
  int32 role_id = 1;
  int32 operator_id = 2; // 操作者用户 ID（审计归因）
}
message ListPermissionsRequest {}
message AuthResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的结果；失败时返回 {"error_code": "<AuthErrorCode>"}
}
