syntax = "proto3";

package auth;

// ===== 认证服务（用户管理 + 权限查询 + 认证校验）=====
service AuthService {
  // 按 ID 获取用户（含角色名、权限列表）
  rpc GetUser(GetUserRequest) returns (AuthResponse);
  // 按用户名获取用户
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (AuthResponse);
  // 按 OAuth 提供商 + 外部 ID 获取用户
  rpc GetUserByOAuth(GetUserByOAuthRequest) returns (AuthResponse);
  // 创建用户（OAuth 或本地注册），返回新用户 ID
  rpc CreateUser(CreateUserRequest) returns (AuthResponse);
  // 更新最后登录时间/IP
  rpc UpdateLastLogin(UpdateLastLoginRequest) returns (AuthResponse);
  // 获取用户权限码列表
  rpc GetUserPermissions(GetUserPermissionsRequest) returns (AuthResponse);
  // 列出所有角色
  rpc ListRoles(ListRolesRequest) returns (AuthResponse);
  // 分页列出用户
  rpc ListUsers(ListUsersRequest) returns (AuthResponse);
  // 更新用户状态
  rpc UpdateUserStatus(UpdateUserStatusRequest) returns (AuthResponse);
  // 授予权限
  rpc GrantPermission(GrantPermissionRequest) returns (AuthResponse);
  // 撤销权限
  rpc RevokePermission(RevokePermissionRequest) returns (AuthResponse);
  // 软删除用户
  rpc DeleteUser(DeleteUserRequest) returns (AuthResponse);
  // 更新用户资料（username/email/status/password，空串字段不修改）
  rpc UpdateUser(UpdateUserRequest) returns (AuthResponse);
  // 设置用户角色
  rpc SetUserRole(SetUserRoleRequest) returns (AuthResponse);

  // ===== 角色与权限管理 =====
  // 按角色 ID 获取角色（含权限码列表）
  rpc GetRole(GetRoleRequest) returns (AuthResponse);
  // 创建角色（name/description/repeated permission_codes）
  rpc CreateRole(CreateRoleRequest) returns (AuthResponse);
  // 更新角色信息（name/description 空串=不修改）
  rpc UpdateRole(UpdateRoleRequest) returns (AuthResponse);
  // 全量替换角色权限（repeated permission_codes）
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (AuthResponse);
  // 删除角色（连带 role_permissions）
  rpc DeleteRole(DeleteRoleRequest) returns (AuthResponse);
  // 列出全部权限点
  rpc ListPermissions(ListPermissionsRequest) returns (AuthResponse);

  // ===== 登录体系改造（INT-51）=====
  // 用户名+密码登录校验（服务端 bcrypt 校验 password_hash，成功返回用户数据）
  rpc LoginWithPassword(LoginWithPasswordRequest) returns (AuthResponse);
  // 自定义 OAuth 提供方管理：全部（管理端，含禁用）
  rpc ListOAuthProviders(ListOAuthProvidersRequest) returns (AuthResponse);
  // 按 ID 获取提供方
  rpc GetOAuthProvider(GetOAuthProviderRequest) returns (AuthResponse);
  // 按 slug 获取提供方（登录链路）
  rpc GetOAuthProviderBySlug(GetOAuthProviderBySlugRequest) returns (AuthResponse);
  // 已启用提供方列表（登录页动态渲染，公开）
  rpc ListEnabledOAuthProviders(ListEnabledOAuthProvidersRequest) returns (AuthResponse);
  // 创建提供方
  rpc CreateOAuthProvider(CreateOAuthProviderRequest) returns (AuthResponse);
  // 更新提供方（空串字段=不修改；client_secret 空串=保留原值）
  rpc UpdateOAuthProvider(UpdateOAuthProviderRequest) returns (AuthResponse);
  // 删除提供方
  rpc DeleteOAuthProvider(DeleteOAuthProviderRequest) returns (AuthResponse);
}

message GetUserRequest {
  int32 user_id = 1;
}
message GetUserByUsernameRequest {
  string username = 1;
}
message GetUserByOAuthRequest {
  string provider = 1;
  string subject = 2;
}
message CreateUserRequest {
  string username = 1;
  string email = 2;
  string oauth_provider = 3;
  string oauth_subject = 4;
  int32 role_id = 5;
  string role_name = 6;  // 角色名（如 'guest'），为空时用 role_id
  string password = 7;   // 明文密码（本地注册用户），为空表示无密码（OAuth 用户）
  int32 operator_id = 8; // 操作者用户 ID（审计归因，自注册为 0）
  bool registered = 9;   // true=自助注册（审计事件 AUTH_USER_REGISTERED，INT-51）
}
message UpdateLastLoginRequest {
  int32 user_id = 1;
  string ip = 2;
}
message GetUserPermissionsRequest {
  int32 user_id = 1;
}
message ListRolesRequest {}
message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3;
  string keyword = 4;  // username/email 模糊匹配，空串不过滤
  int32 role_id = 5;   // 角色过滤，0 不过滤
}
message UpdateUserStatusRequest {
  int32 user_id = 1;
  string status = 2;
  int32 operator_id = 3; // 操作者用户 ID（审计归因）
}
message GrantPermissionRequest {
  int32 user_id = 1;
  string permission = 2;
  int32 operator_id = 3; // 操作者用户 ID（审计归因）
}
message RevokePermissionRequest {
  int32 user_id = 1;
  string permission = 2;
  int32 permission_id = 3; // 按权限点 ID 撤销（差量撤销语义），优先于 permission 码
  int32 operator_id = 4;   // 操作者用户 ID（审计归因）
}
message DeleteUserRequest {
  int32 user_id = 1;
  int32 operator_id = 2; // 操作者用户 ID（审计归因）
}
message UpdateUserRequest {
  int32 user_id = 1;
  string username = 2;    // 空串=不修改
  string email = 3;       // 空串=不修改
  string status = 4;      // 空串=不修改；active/inactive/locked
  string password = 5;    // 空串=不修改；明文密码，服务端哈希落库
  int32 operator_id = 6;  // 操作者用户 ID（审计归因）
}
message SetUserRoleRequest {
  int32 user_id = 1;
  int32 role_id = 2;
  int32 operator_id = 3; // 操作者用户 ID（审计归因）
}
message GetRoleRequest {
  int32 role_id = 1;
}
message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated string permission_codes = 3;
  int32 operator_id = 4; // 操作者用户 ID（审计归因）
}
message UpdateRoleRequest {
  int32 role_id = 1;
  string name = 2;        // 空串=不修改
  string description = 3; // 空串=不修改
  int32 operator_id = 4;  // 操作者用户 ID（审计归因）
}
message SetRolePermissionsRequest {
  int32 role_id = 1;
  repeated string permission_codes = 2; // 全量替换 role_permissions
  int32 operator_id = 3;                // 操作者用户 ID（审计归因）
}
message DeleteRoleRequest {
  int32 role_id = 1;
  int32 operator_id = 2; // 操作者用户 ID（审计归因）
}
message ListPermissionsRequest {}

// ===== 登录体系改造（INT-51）=====
message LoginWithPasswordRequest {
  string username = 1;
  string password = 2;
}
message ListOAuthProvidersRequest {
  bool include_disabled = 1; // 管理端 true=全部；false=仅启用
}
message GetOAuthProviderRequest {
  int32 provider_id = 1;
}
message GetOAuthProviderBySlugRequest {
  string slug = 1;
}
message ListEnabledOAuthProvidersRequest {}
message CreateOAuthProviderRequest {
  string name = 1;
  string slug = 2;
  string icon = 3;
  bool enabled = 4;
  string client_id = 5;
  string client_secret = 6;
  string authorize_url = 7;
  string token_url = 8;
  string userinfo_url = 9;
  string scopes = 10;
  string user_id_field = 11;
  string username_field = 12;
  string display_name_field = 13;
  string email_field = 14;
  int32 operator_id = 15; // 操作者用户 ID（审计归因）
}
message UpdateOAuthProviderRequest {
  int32 provider_id = 1;
  string name = 2;                // 空串=不修改
  string slug = 3;                // 空串=不修改
  string icon = 4;                // 空串=不修改
  bool enabled = 5;               // 以 update_enabled 判定是否应用
  bool update_enabled = 6;        // true 时应用 enabled 字段
  string client_id = 7;           // 空串=不修改
  string client_secret = 8;       // 空串=保留原值
  string authorize_url = 9;       // 空串=不修改
  string token_url = 10;          // 空串=不修改
  string userinfo_url = 11;       // 空串=不修改
  string scopes = 12;             // 空串=不修改
  string user_id_field = 13;      // 空串=不修改
  string username_field = 14;     // 空串=不修改
  string display_name_field = 15; // 空串=不修改
  string email_field = 16;        // 空串=不修改
  int32 operator_id = 17;         // 操作者用户 ID（审计归因）
}
message DeleteOAuthProviderRequest {
  int32 provider_id = 1;
  int32 operator_id = 2; // 操作者用户 ID（审计归因）
}
message AuthResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的结果；失败时返回 {"error_code": "<AuthErrorCode>"}
}
