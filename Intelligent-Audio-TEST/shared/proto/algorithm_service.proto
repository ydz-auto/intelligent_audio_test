syntax = "proto3";

package algorithm;

// ===== 算法分组服务 =====
service AlgorithmGroupService {
  rpc CreateAlgorithmGroup(CreateAlgorithmGroupRequest) returns (AlgorithmResponse);
  rpc UpdateAlgorithmGroup(UpdateAlgorithmGroupRequest) returns (AlgorithmResponse);
  rpc DeleteAlgorithmGroup(DeleteAlgorithmGroupRequest) returns (AlgorithmResponse);
  rpc ListAlgorithmGroups(ListAlgorithmGroupsRequest) returns (AlgorithmResponse);
  rpc GetAlgorithmGroup(GetAlgorithmGroupRequest) returns (AlgorithmResponse);
}

// ===== 算法定义服务 =====
service AlgorithmDefinitionService {
  // CRUD
  rpc CreateAlgorithm(CreateAlgorithmRequest) returns (AlgorithmResponse);
  rpc UpdateAlgorithm(UpdateAlgorithmRequest) returns (AlgorithmResponse);
  rpc DeleteAlgorithm(DeleteAlgorithmRequest) returns (AlgorithmResponse);
  rpc ListAlgorithms(ListAlgorithmsRequest) returns (AlgorithmResponse);
  rpc GetAlgorithm(GetAlgorithmRequest) returns (AlgorithmResponse);
  rpc GetAlgorithmOptions(GetAlgorithmOptionsRequest) returns (AlgorithmResponse);

  // 参数 CRUD
  rpc ListParams(ListParamsRequest) returns (AlgorithmResponse);
  rpc GetParam(GetParamRequest) returns (AlgorithmResponse);
  rpc ListCaseParams(ListCaseParamsRequest) returns (AlgorithmResponse);
  rpc ListReferenceParams(ListReferenceParamsRequest) returns (AlgorithmResponse);

  // 设备/API 参数写操作
  rpc CreateParam(CreateParamRequest) returns (AlgorithmResponse);
  rpc UpdateParam(UpdateParamRequest) returns (AlgorithmResponse);
  rpc DeleteParam(DeleteParamRequest) returns (AlgorithmResponse);
  rpc FindParamByCode(FindParamByCodeRequest) returns (AlgorithmResponse);

  // 用例参数写操作
  rpc CreateCaseParam(CreateCaseParamRequest) returns (AlgorithmResponse);
  rpc UpdateCaseParam(UpdateCaseParamRequest) returns (AlgorithmResponse);
  rpc DeleteCaseParam(DeleteCaseParamRequest) returns (AlgorithmResponse);
  rpc FindCaseParamByCode(FindCaseParamByCodeRequest) returns (AlgorithmResponse);
  rpc ReviveCaseParam(ReviveCaseParamRequest) returns (AlgorithmResponse);

  // 参考参数写操作
  rpc CreateReferenceParam(CreateReferenceParamRequest) returns (AlgorithmResponse);
  rpc UpdateReferenceParam(UpdateReferenceParamRequest) returns (AlgorithmResponse);
  rpc DeleteReferenceParam(DeleteReferenceParamRequest) returns (AlgorithmResponse);
  rpc FindReferenceParam(FindReferenceParamRequest) returns (AlgorithmResponse);

  // 映射
  rpc ListMappings(ListMappingsRequest) returns (AlgorithmResponse);
  rpc GetDimensionParams(GetDimensionParamsRequest) returns (AlgorithmResponse);
  rpc GetAlgorithmDimensions(GetAlgorithmDimensionsRequest) returns (AlgorithmResponse);

  // 参数映射写操作
  rpc CreateMapping(CreateMappingRequest) returns (AlgorithmResponse);
  rpc UpdateMapping(UpdateMappingRequest) returns (AlgorithmResponse);
  rpc DeleteMapping(DeleteMappingRequest) returns (AlgorithmResponse);
  rpc GetMapping(GetMappingRequest) returns (AlgorithmResponse);

  // 维度关系
  rpc CreateDimensionRelation(CreateDimensionRelationRequest) returns (AlgorithmResponse);
  rpc UpdateDimensionRelation(UpdateDimensionRelationRequest) returns (AlgorithmResponse);
  rpc DeleteDimensionRelation(DeleteDimensionRelationRequest) returns (AlgorithmResponse);
  rpc DeleteRelationsByDimension(DeleteRelationsByDimensionRequest) returns (AlgorithmResponse);
  rpc GetRelationsByDimension(GetRelationsByDimensionRequest) returns (AlgorithmResponse);
  rpc SyncDimensionRelations(SyncDimensionRelationsRequest) returns (AlgorithmResponse);

  // 评估维度参数管理
  rpc CreateDimensionParam(CreateDimensionParamRequest) returns (AlgorithmResponse);
  rpc DeleteDimensionParamsByDirection(DeleteDimensionParamsByDirectionRequest) returns (AlgorithmResponse);
  rpc FindAudioDimensionIds(FindAudioDimensionIdsRequest) returns (AlgorithmResponse);

  // 参数映射同步
  rpc SyncParamMappings(SyncParamMappingsRequest) returns (AlgorithmResponse);
  rpc ListParamMappingsForDimension(ListParamMappingsForDimensionRequest) returns (AlgorithmResponse);

  // 导入/导出
  rpc ImportAlgorithms(ImportAlgorithmsRequest) returns (AlgorithmResponse);
  rpc ReloadAlgorithmConfig(ReloadAlgorithmConfigRequest) returns (AlgorithmResponse);

  // 算法定义写操作（flush 语义，供 task_service 旧 servicer 委托）
  rpc CreateAlgorithmDefinition(CreateAlgorithmDefinitionRequest) returns (AlgorithmResponse);
  rpc UpdateAlgorithmDefinitionAttrs(UpdateAlgorithmDefinitionAttrsRequest) returns (AlgorithmResponse);
  rpc SoftDeleteAlgorithm(SoftDeleteAlgorithmRequest) returns (AlgorithmResponse);
  rpc FindAlgorithmByType(FindAlgorithmByTypeRequest) returns (AlgorithmResponse);
  rpc ListAlgorithmDefinitions(ListAlgorithmDefinitionsRequest) returns (AlgorithmResponse);
  rpc ListOnlineAlgorithmDefinitions(ListOnlineAlgorithmDefinitionsRequest) returns (AlgorithmResponse);
  rpc CountAlgorithmsInGroup(CountAlgorithmsInGroupRequest) returns (AlgorithmResponse);
  rpc CreateImportDeviceParam(CreateImportDeviceParamRequest) returns (AlgorithmResponse);
  rpc ListAlgorithmDefinitionsForBulkDelete(ListAlgorithmDefinitionsForBulkDeleteRequest) returns (AlgorithmResponse);
  rpc BulkDeleteAlgorithms(BulkDeleteAlgorithmsRequest) returns (AlgorithmResponse);

  // 算法分组写操作（flush 语义）
  rpc FindGroupByName(FindGroupByNameRequest) returns (AlgorithmResponse);
  rpc GetGroup(GetGroupRequest) returns (AlgorithmResponse);
  rpc CreateGroup(CreateGroupRequest) returns (AlgorithmResponse);
  rpc UpdateGroupAttrs(UpdateGroupAttrsRequest) returns (AlgorithmResponse);
  rpc SoftDeleteGroup(SoftDeleteGroupRequest) returns (AlgorithmResponse);
  rpc ListGroups(ListGroupsRequest) returns (AlgorithmResponse);
  rpc CountAlgorithmsInGroupForGroup(CountAlgorithmsInGroupForGroupRequest) returns (AlgorithmResponse);

  // 维度关联写操作（flush 语义）
  rpc SoftDeleteAlgorithmDimensionRelations(SoftDeleteAlgorithmDimensionRelationsRequest) returns (AlgorithmResponse);
  rpc FindDimensionRelation(FindDimensionRelationRequest) returns (AlgorithmResponse);
  rpc GetDimensionRelation(GetDimensionRelationRequest) returns (AlgorithmResponse);
  rpc ListDimensionRelations(ListDimensionRelationsRequest) returns (AlgorithmResponse);
  rpc UpdateDimensionRelationAttrs(UpdateDimensionRelationAttrsRequest) returns (AlgorithmResponse);
  rpc SoftDeleteDimensionRelation(SoftDeleteDimensionRelationRequest) returns (AlgorithmResponse);

  // 评估维度参数读
  rpc ListDimensionParams(ListDimensionParamsRequest) returns (AlgorithmResponse);

  // 事务控制
  rpc CommitTransaction(CommitTransactionRequest) returns (AlgorithmResponse);
  rpc RollbackTransaction(RollbackTransactionRequest) returns (AlgorithmResponse);
  rpc FlushTransaction(FlushTransactionRequest) returns (AlgorithmResponse);

  // 算法定义全量保存（INT-589：聚合事务 + 乐观锁 + 草稿能力）
  // SaveAlgorithmDefinition：完整定义（基础字段 + 六类子实体）一次原子落库；
  //   data JSON 含 id（有则更新、无则创建）、expected_updated_at（乐观锁版本）。
  //   AlgorithmResponse.code：SAVED（新建）/ OK（更新）/ CONFLICT（乐观锁冲突）/
  //   VALIDATION_FAILED（校验失败，含维度不存在/必填缺失等）。
  rpc SaveAlgorithmDefinition(SaveAlgorithmDefinitionRequest) returns (AlgorithmResponse);
  // SaveAlgorithmDefinitionDraft：30s 自动保存写草稿快照（不落正式六表），
  //   data JSON 为完整定义快照（含 algorithm_type），按 algorithm_type upsert。
  rpc SaveAlgorithmDefinitionDraft(SaveAlgorithmDefinitionDraftRequest) returns (AlgorithmResponse);
  // GetAlgorithmDefinitionDraft：读取草稿快照（前端编辑恢复），data 为快照 JSON。
  rpc GetAlgorithmDefinitionDraft(GetAlgorithmDefinitionDraftRequest) returns (AlgorithmResponse);
  // ClearAlgorithmDefinitionDraft：发布/删除成功后清除草稿快照（INT-1514），
  //   与 SaveAlgorithmDefinition 的 clear_snapshot 口径一致；data 返回
  //   {algorithm_type, cleared}，无草稿时 cleared=false 仍算成功。
  rpc ClearAlgorithmDefinitionDraft(ClearAlgorithmDefinitionDraftRequest) returns (AlgorithmResponse);
}

// ===== 算法领域查询服务（CQRS 读侧，迁移自 shared/algorithm）=====
service AlgorithmQueryService {
  // 配置加载器（原 algorithm_config_loader）
  rpc GetAlgorithmConfig(GetAlgorithmConfigRequest) returns (AlgorithmResponse);
  rpc GetAllAlgorithmsList(GetAllAlgorithmsListRequest) returns (AlgorithmResponse);
  rpc GetAlgorithmParamsMerged(GetAlgorithmParamsMergedRequest) returns (AlgorithmResponse);
  rpc GetDeviceParamsList(GetDeviceParamsListRequest) returns (AlgorithmResponse);
  rpc GetApiParamsList(GetApiParamsListRequest) returns (AlgorithmResponse);
  rpc GetCaseParamsList(GetCaseParamsListRequest) returns (AlgorithmResponse);
  rpc GetReferenceParamsList(GetReferenceParamsListRequest) returns (AlgorithmResponse);
  rpc GetParamMappingForComponent(GetParamMappingForComponentRequest) returns (AlgorithmResponse);
  rpc GetEvaluationDimensionParams(GetEvaluationDimensionParamsRequest) returns (AlgorithmResponse);
  rpc GetAlgorithmDefinitionInfo(GetAlgorithmDefinitionInfoRequest) returns (AlgorithmResponse);
  rpc ReloadConfig(ReloadConfigRequest) returns (AlgorithmResponse);

  // 字段映射器（原 field_mapper）
  rpc GetFieldMappings(GetFieldMappingsRequest) returns (AlgorithmResponse);
  rpc GetEvaluationFieldMappings(GetEvaluationFieldMappingsRequest) returns (AlgorithmResponse);
  rpc BuildApiRequestData(BuildApiRequestDataRequest) returns (AlgorithmResponse);
  rpc ConvertFieldValue(ConvertFieldValueRequest) returns (AlgorithmResponse);
  // 批量字段值转换（INT-1749）：一次请求处理 N 个值，执行侧映射编排不再逐字段跨服务。
  //   data JSON: {"items": [{"transform_type": "...", "value": <任意 JSON>}, ...]}
  //   响应 data JSON: {"values": [...与 items 同序...],
  //                    "errors": [{"index","transform_type","error"}, ...]}
  //   非法输入策略：保留原值 + errors 回传（服务端 WARNING），不抛异常、不静默吞成空串。
  rpc ConvertFieldValues(ConvertFieldValuesRequest) returns (AlgorithmResponse);

  // 结果字段映射器（原 algorithm_result_field_mapper）
  rpc GetOutputFields(GetOutputFieldsRequest) returns (AlgorithmResponse);
  rpc GetReferenceOutputFields(GetReferenceOutputFieldsRequest) returns (AlgorithmResponse);
  rpc ExtractResultFields(ExtractResultFieldsRequest) returns (AlgorithmResponse);
  rpc GetTimelineFields(GetTimelineFieldsRequest) returns (AlgorithmResponse);
  rpc GetFullFieldMapping(GetFullFieldMappingRequest) returns (AlgorithmResponse);
  rpc MapApiResults(MapApiResultsRequest) returns (AlgorithmResponse);
  rpc ExtractRoundResults(ExtractRoundResultsRequest) returns (AlgorithmResponse);

  // 用例参数提取器（原 case_parameter_extractor）
  rpc ExtractCaseAllParams(ExtractCaseAllParamsRequest) returns (AlgorithmResponse);
  rpc NormalizeAlgorithmParams(NormalizeAlgorithmParamsRequest) returns (AlgorithmResponse);
  rpc NormalizeAlgorithmParamsToList(NormalizeAlgorithmParamsToListRequest) returns (AlgorithmResponse);
  rpc GetRoundAlgoParams(GetRoundAlgoParamsRequest) returns (AlgorithmResponse);
  rpc GetAlgoParam(GetAlgoParamRequest) returns (AlgorithmResponse);
  rpc BuildCaseFormSchema(BuildCaseFormSchemaRequest) returns (AlgorithmResponse);

  // 参考参数生成器（原 reference_params_generator）
  rpc GenerateReferenceParams(GenerateReferenceParamsRequest) returns (AlgorithmResponse);
  rpc LoadReferenceParamsFile(LoadReferenceParamsFileRequest) returns (AlgorithmResponse);
  rpc GetReferenceTextValue(GetReferenceTextValueRequest) returns (AlgorithmResponse);
  rpc GetAllReferenceParams(GetAllReferenceParamsRequest) returns (AlgorithmResponse);
  rpc GetReferenceParamsForReport(GetReferenceParamsForReportRequest) returns (AlgorithmResponse);
}

// ===== 通用响应 =====
message AlgorithmResponse {
  bool success = 1;
  string message = 2;
  string data = 3;  // JSON 序列化的结果
  string code = 4;  // 机器可读结果码（SAVED/OK/CONFLICT/VALIDATION_FAILED，INT-589）
  // 旧 servicer 未填为空串；网关按 success 回退，不依赖 code。
}

