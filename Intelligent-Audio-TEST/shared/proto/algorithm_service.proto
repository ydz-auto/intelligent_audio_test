// ===== 算法定义全量保存（INT-589）=====
message SaveAlgorithmDefinitionRequest {
  string data = 1;  // JSON: 完整定义（基础字段 + device/api/case 参数 +
                    // mappings + associated_dimensions + reference_params +
                    // expected_updated_at）
}
message SaveAlgorithmDefinitionDraftRequest {
  string data = 1;  // JSON: 完整定义快照（含 algorithm_type）
}
message GetAlgorithmDefinitionDraftRequest {
  string algorithm_type = 1;
}
message ClearAlgorithmDefinitionDraftRequest {
  string algorithm_type = 1;
}

// ===== 算法领域查询服务请求（迁移自 shared/algorithm）=====

// 配置加载器请求
message GetAlgorithmConfigRequest {
  string algorithm_type = 1;
}
message GetAllAlgorithmsListRequest {}
message GetAlgorithmParamsMergedRequest {
  string algorithm_type = 1;
}
message GetDeviceParamsListRequest {
  string algorithm_type = 1;
}
message GetApiParamsListRequest {
  string algorithm_type = 1;
  // INT-1756（C6a）：API 实例级作用域。proto3 optional 拿 presence 语义，
  // 区分「未传」（回落算法级默认）与显式传值；响应仍是 JSON 字符串，行带 api_id。
  optional int32 api_id = 2;
}
message GetCaseParamsListRequest {
  string algorithm_type = 1;
}
message GetReferenceParamsListRequest {
  string algorithm_type = 1;
}
message GetParamMappingForComponentRequest {
  string algorithm_type = 1;
  string component_type = 2;  // device/api/case/reference/evaluation
  optional int32 api_id = 3;  // INT-1756：API 实例级作用域（未传=算法级默认）
}
message GetEvaluationDimensionParamsRequest {
  int32 dimension_id = 1;
}
message GetAlgorithmDefinitionInfoRequest {
  string algorithm_type = 1;
}
message ReloadConfigRequest {}

// 字段映射器请求
message GetFieldMappingsRequest {
  string algorithm_type = 1;
  string component_type = 2;  // device/api/evaluation
  optional int32 api_id = 3;  // INT-1756：API 实例级作用域（未传=算法级默认）
}
message GetEvaluationFieldMappingsRequest {
  string algorithm_type = 1;
}
message BuildApiRequestDataRequest {
  string algorithm_type = 1;
  string data = 2;  // JSON: 设备参数 + API 参数
}
message ConvertFieldValueRequest {
  string transform_type = 1;
  string data = 2;  // JSON: {value, ...}
}
// INT-1749 批量变换：items 走 JSON（value 可为任意 JSON 类型，保持与应用内同构）
message ConvertFieldValuesRequest {
  string data = 1;  // JSON: {"items": [{"transform_type": "...", "value": ...}, ...]}
}

// 结果字段映射器请求
message GetOutputFieldsRequest {
  string algorithm_type = 1;
  string test_type = 2;  // 可选，voice_llm 区分 api/e2e
  // INT-1757（C6b）：输出声明按 API 实例级作用域取（未传=算法级默认）。
  optional int32 api_id = 3;
}
message GetReferenceOutputFieldsRequest {
  string algorithm_type = 1;
}
message ExtractResultFieldsRequest {
  string algorithm_type = 1;
  string algorithm_result = 2;  // JSON: 算法执行结果
  string result_data = 3;        // JSON: 结果数据
}
message GetTimelineFieldsRequest {
  string algorithm_type = 1;
}
message GetFullFieldMappingRequest {
  string algorithm_type = 1;
}
message MapApiResultsRequest {
  string algorithm_type = 1;
  string raw_results = 2;  // JSON: 原始结果
  string test_type = 3;     // voice_llm 时使用
}
message ExtractRoundResultsRequest {
  string algorithm_result = 1;  // JSON
  string test_type = 2;
}

// 用例参数提取器请求
message ExtractCaseAllParamsRequest {
  string case_config = 1;  // JSON: 用例配置
}
message NormalizeAlgorithmParamsRequest {
  string algorithm_params = 1;  // JSON: list 或 dict
}
message NormalizeAlgorithmParamsToListRequest {
  string algorithm_params = 1;  // JSON: list 或 dict
}
message GetRoundAlgoParamsRequest {
  string algorithm_params_col = 1;  // JSON: 按轮分组
  int32 round_number = 2;
}
message GetAlgoParamRequest {
  string algorithm_params = 1;  // JSON: [{field_code, field_value}]
  string field_code = 2;
}
message BuildCaseFormSchemaRequest {
  string algorithm_type = 1;
}

// 参考参数生成器请求
message GenerateReferenceParamsRequest {
  string data = 1;  // JSON: {test_case_config, round_data}
}
message LoadReferenceParamsFileRequest {
  string filepath = 1;
}
message GetReferenceTextValueRequest {
  string reference_params_col = 1;  // JSON: test_case.reference_params
  string code = 2;
}
message GetAllReferenceParamsRequest {
  string reference_params_col = 1;  // JSON
}
message GetReferenceParamsForReportRequest {
  string reference_params_col = 1;  // JSON
}
