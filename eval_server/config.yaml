# eval_server 结构配置（YAML）。
# 密钥（LLM_JUDGE_API_KEY 等）与部署级覆盖（LOG_DIR / STATIC_BASE_PATH）仍在 eval_server/.env，
# 加载顺序：config.yaml 提供默认值 → .env 覆盖（见 app/config.py）。修改后重启 eval_server 生效。

static_base_path: D:\00_static\static
log_max_bytes: 10485760
log_backup_count: 30
debug: false
port: 8888
host: 0.0.0.0
# ── 并发控制 ──
local_max_concurrency: 100
wsgi_threads: 128
# 各维度并发上限（env_judge/reject_judge 传音频给 LLM，限 5；其余放开）
concurrency_limits:
  wer: 100
  ser: 100
  der: 100
  cpwer: 100
  tcpwer: 100
  stm_wer: 100
  llm_judge: 100
  turn_taking: 100
  interruption_metrics: 100
  non_interactive_latency: 100
  noise_latency: 100
  env_judge: 5
  high_freq_turn_taking: 100
  high_freq_llm_judge: 100
  reject_judge: 5
  turn_eval: 100
default_max_concurrency: 100
# LLM 调用共享并发（按「中转站 × 品牌」两级分池）：文本池 / 音频池
llm_text_max_concurrency: 100
llm_audio_max_concurrency: 5
# 模型品牌识别规则（模型名小写 substring 匹配，新增品牌加一行即可）
llm_brand_keywords:
  gemini:
  - gemini
  openai:
  - chatgpt
  - gpt
  - o1
  - o3
  - o4
  - codex
  anthropic:
  - claude
  qwen:
  - qwen
  - qwq
  - qvq
  doubao:
  - doubao
  - seed
  deepseek:
  - deepseek
  glm:
  - glm
  - chatglm
  moonshot:
  - moonshot
  - kimi
  ernie:
  - ernie
  - wenxin
  minimax:
  - minimax
  - abab
  - mimo
  hunyuan:
  - hunyuan
  grok:
  - grok
# LLM Judge 配置（OpenAI 兼容代理）；api_key 在 .env
llm_judge:
  api_base_url: https://az.gptplus5.com/v1
  default_model: gemini-3.7-flash
  dimension_models:
    llm_judge: ''
    high_freq_llm_judge: ''
    false_takeover: ''
    reply_quality: ''
  max_tokens: 4096
  temperature: 0.1
  timeout: 300
  prompt_template: '你是一个严格的语言逻辑专家，你需要结合上下文并逐字逐词分析【当前用户提问】、【当前助手回答】与【历史对话】三者之间的逻辑是否正确，你需要遵照【评价规则】进行打分，并给出打分的理由。


    【评价规则】包含五个大类，每个大类里包含若干小类，你需要认真阅读理解各个小类，打出最合适的分数。


    【评价规则】

    <A>回答时有以下表现之一为1分：

    1）截断、中英混杂、异常符号输出。注意：中英混杂指出现了英文字母，并且影响句意理解才判为中英混杂。例如：你好，Jack. 不影响句意完整，不视为中英混杂。

    2）回答在黄赌毒、领土和1号人物的问题上，立场不正确

    3）没有回答用户的问题，没有遵从用户的要求

    4）提供的信息有错误、不真实或者有时效性问题

    5）逻辑混乱，表达没有条理

    6）上下文不接续

    7）大量内容重复/雷同：【当前助手回答】与【历史对话】中的助手回复出现了大量重复或雷同的内容，或者【当前助手回答】存在大量重复内容，影响阅读体验

    8）表达加重或引起用户的负性情绪，例如：指责用户，对用户的行为进行论断

    9）前文助手对用户的话产生了误解，用户进行了纠正，但助手无法改正


    <B>回答时没有出现1分的问题，并符合以下描述之一，为2分：

    1）回答了用户的部分问题，或者完成了用户的部分要求

    2）部分回答了用户的问题，但答案不完整；正确但信息量不足；答案和用户的问题针对性不强，相关性不够高

    3）表达啰嗦、笼统不专业，或者内容过长导致用户记不住

    4）较多内容重复

    5）用户表达的意图不清晰时，没有追问澄清就直接作答

    6）对话引导不当，提问与话题不相关、无意义，或者反复追问相似问题，或者所提问题用户难以回答

    7）还没有完成讨论或任务就终止话题

    8）用户表达了情绪，但没有对用户表达共情：用户说很伤心或者说一个什么事隐含了用户的情绪，模型需要表达

    9）表达不符合任务场景的风格要求，例如：在比较正式、重要的场景中，使用过于活泼、不严谨的表达，或者比较轻松的场景中表达过于正式

    10）表达不符合社交语境，未考虑用户与他人的社交关系

    11）与用户的关系距离把握不好，过度亲近、没有边界感，例如涉嫌窥探用户隐私


    <C>回答时没有出现上述1分或2分的问题，并达到以下大部分标准，为3分：

    1）用户意图明确时，能够准确理解，完全回答了用户的问题

    2）信息内容正确，回答完整，要点齐全

    3）逻辑清晰、有条理，有一定的专业性

    4）表达简明扼要，没有啰嗦冗余的表达

    5）当用户意图不清晰或者表达不完整时，能够进行追问澄清

    6）有一定的对话接续引导，或者能恰当地终止话题

    7）能够识别用户情绪，并做出一定的共情回应，但回应比较笼统，泛泛地表达共情，没有结合用户的具体场景

    8）表达符合任务场景的风格要求，比如该正式的正式，该活泼的活泼

    9）表达符合社交语境，较好地把握了用户与他人的社交关系

    10）与用户的关系距离把握比较恰当，有一定的边界感

    11）如果前文助手对用户的话产生了误解，用户进行了纠正，助手能基于用户纠正的内容，改正自己的回复


    <D>回答时没有出现上述1分或2分的问题，并且在超越3分的基础上，达到了以下大部分标准，为4分：

    1）识别了用户的较容易发现的隐含意图，并进行了回应

    2）信息正确，内容完整，要点无缺失，并且有细节

    3）表达有逻辑，有条理，简明扼要，重点突出，有专业性，且表达口语化，易懂，易记

    4）当用户意图不清晰或者表达不完整时，追问合理

    5）对话引导易于回答，使用户能够继续对话

    6）准确识别用户情绪，并准确表达共情


    <E>回答时没有出现上述1分或2分的问题，并且在超越4分的基础上，达到了以下大部分标准，为5分：

    1）用户的隐含意图较难发现，但回答精准地识别并回应了用户的隐含意图

    2）信息正确，内容完整有细节，并提供了额外的有价值信息

    3）当用户意图不清晰或者表达不完整时，追问澄清切中要害，问的是关键的问题

    4）对话引导有细节，有吸引力，用户有兴趣，乐于继续对话

    5）精准地识别或推断出用户情绪，做出有细节、真实的共情表达

    6）针对用户的情绪需求，恰当地表达支持和陪伴，或有针对性地进行调节或提供有针对性、可操作的解决方案

    7）表达风格恰如其分，并符合用户的语言风格，在风格、修辞及功能等层面均与用户语言适配，超越了基础风格匹配

    8）表达非常符合社交语境，能够精准地把握用户与他人的社交关系，提供回答


    【当前用户问题】：{query}


    【当前助手回答】：{hypothesis}


    请严格按照以下 JSON 格式输出结果，包含两个参数（score、reason）：

    【自动评测开始】

    {"score": 0, "reason": ""}

    【自动评测结束】

    注意：score 为整数（1-5），reason 为字符串，不要输出 JSON 以外的内容。'
